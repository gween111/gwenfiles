// PHẦN 2: LOGIC ỨNG DỤNG (JS THUẦN)
// ============================================================================

let currentView = 'CATEGORY_SELECT';
let selectedChapter = null;
let selectedSubCategory = null;
let quizMode = 'sequential'; // 'sequential' (theo thứ tự) hoặc 'random' (ngẫu nhiên)
let numQuestions = 5;
let activeQuestions = [];
let currentQuestionIndex = 0;
let userAnswers = {};
let showResults = false;

function shuffleArray(array) {
    const newArr = [...array];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}

function calculateScore() {
    let score = 0;
    let maxScore = 0;
    activeQuestions.forEach(q => {
        maxScore += q.points || 0;
        if (userAnswers[q.id] === q.correctAnswer) {
            score += q.points || 0;
        }
    });
    return { score, maxScore };
}

function setView(viewName) {
    currentView = viewName;
    render();
}

window.handleSelectChapter = function(chap) {
    selectedChapter = chap;
    if (chap === 'ALL') {
        goToSetup('ALL', 'ALL');
    } else {
        setView('SUB_CATEGORY_SELECT');
    }
}

window.goToSetup = function(chapter, subCat) {
    selectedChapter = chapter;
    selectedSubCategory = subCat;
    
    let total = 0;
    if (chapter === 'ALL') {
        total = Object.values(quizData).flatMap(c => Object.values(c).flat()).length;
    } else if (subCat === 'ALL') {
        total = Object.values(quizData[chapter]).flat().length;
    } else {
        total = quizData[chapter][subCat].length;
    }

    numQuestions = total;
    quizMode = 'sequential'; 
    setView('SETUP');
}

window.updateMode = function(mode) {
    quizMode = mode;
    render(); // Render lại giao diện để đổi giữa thanh trượt và ô nhập số
}

window.startQuiz = function() {
    let pool = [];
    if (selectedChapter === 'ALL') {
        pool = Object.values(quizData).flatMap(chap => Object.values(chap).flat());
    } else if (selectedSubCategory === 'ALL') {
        pool = Object.values(quizData[selectedChapter]).flat();
    } else {
        pool = quizData[selectedChapter][selectedSubCategory];
    }

    if(pool.length === 0) {
        alert("Phần này hiện chưa có câu hỏi nào, vui lòng dán thêm dữ liệu!");
        return;
    }

    let finalQs = [...pool];
    
    if (quizMode === 'random') {
        finalQs = shuffleArray(finalQs).slice(0, numQuestions);
    } else {
        let startInput = document.getElementById('startIdx');
        let endInput = document.getElementById('endIdx');
        let start = startInput ? parseInt(startInput.value) - 1 : 0;
        let end = endInput ? parseInt(endInput.value) : finalQs.length;
        
        if (start < 0) start = 0;
        if (end > finalQs.length) end = finalQs.length;
        if (start >= end) {
            alert("Khoảng câu hỏi không hợp lệ!");
            return;
        }
        finalQs = finalQs.slice(start, end);
    }
    
    activeQuestions = finalQs;
    currentQuestionIndex = 0;
    userAnswers = {};
    showResults = false;
    setView('QUIZ');
}

window.handleSelectAnswer = function(optionKey) {
    const currentQ = activeQuestions[currentQuestionIndex];
    if (userAnswers[currentQ.id] || showResults) return;
    userAnswers[currentQ.id] = optionKey;
    render();
}

window.nextQuestion = function() {
    if (currentQuestionIndex < activeQuestions.length - 1) {
        currentQuestionIndex++;
        render();
    }
}

window.prevQuestion = function() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        render();
    }
}

window.finishQuiz = function() {
    showResults = true;
    render();
}

window.confirmExit = function() {
    if (showResults || confirm("Bạn sẽ mất tiến trình hiện tại. Chắc chắn thoát?")) {
        setView('CATEGORY_SELECT');
    }
}

window.updateNumQuestions = function(val) {
    numQuestions = parseInt(val);
    document.getElementById('displayNumQs').innerText = numQuestions;
}

        <div class="py-12 px-4 sm:px-6 lg:px-8">
            <div class="max-w-3xl mx-auto animate-fade-in">
                <div class="flex items-center mb-8 border-b pb-4">
                    <button onclick="setView('CATEGORY_SELECT')" class="p-2 rounded-full hover:bg-gray-200 transition-colors mr-3">
                        <i data-lucide="arrow-left" class="h-6 w-6 text-gray-600"></i>
                    </button>
                    <h2 class="text-2xl font-extrabold text-gray-900 leading-tight">${selectedChapter}</h2>
                </div>

                <div class="space-y-4">
                    <button onclick="goToSetup('${selectedChapter}', 'ALL')" class="w-full bg-gradient-to-r from-indigo-500 to-blue-600 shadow-md rounded-xl p-5 hover:shadow-lg transition-all duration-200 flex items-center justify-between text-left group">
                        <div>
                            <h4 class="text-xl font-bold text-white">Ôn toàn bộ chương này</h4>
                            <p class="text-blue-100 text-sm mt-1">Tổng cộng ${totalInChap} câu hỏi</p>
                        </div>
                        <i data-lucide="layers" class="h-7 w-7 text-white opacity-80 group-hover:opacity-100"></i>
                    </button>

                    <div class="text-sm font-bold text-gray-400 uppercase tracking-wider mt-6 mb-2">Hoặc chọn ôn theo từng phần nhỏ:</div>
                    ${subCatsHtml}
                </div>
            </div>
        </div>
        `;
    }
    
    else if (currentView === 'SETUP') {
        let totalAvailable = 0;
        if (selectedChapter === 'ALL') {
            totalAvailable = Object.values(quizData).flatMap(c => Object.values(c).flat()).length;
        } else if (selectedSubCategory === 'ALL') {
            totalAvailable = Object.values(quizData[selectedChapter]).flat().length;
        } else {
            totalAvailable = quizData[selectedChapter][selectedSubCategory].length;
        }
        
        const displayCategory = selectedChapter === 'ALL' 
            ? "Tổng hợp (Tất cả các chương)" 
            : selectedSubCategory === 'ALL'
                ? `${selectedChapter} - Toàn bộ`
                : selectedSubCategory;

        let backAction = selectedChapter === 'ALL' ? "setView('CATEGORY_SELECT')" : "setView('SUB_CATEGORY_SELECT')";

        let setupControlsHtml = '';
        if (quizMode === 'random') {
            setupControlsHtml = `
                <h3 class="font-semibold text-gray-700 mb-4 flex items-center">
                    <i data-lucide="dices" class="w-5 h-5 mr-2 text-gray-500"></i>
                    Rút ngẫu nhiên bao nhiêu câu?
                </h3>
                <input type="range" min="1" max="${totalAvailable}" value="${numQuestions}" oninput="updateNumQuestions(this.value)" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"/>
                <div class="mt-6 text-center bg-gray-50 py-4 rounded-xl border border-gray-100">
                    <span id="displayNumQs" class="text-4xl font-extrabold text-blue-600">${numQuestions}</span>
                    <span class="text-gray-500 font-medium ml-2 text-lg">/ ${totalAvailable} câu</span>
                </div>
            `;
        } else {
            setupControlsHtml = `
                <h3 class="font-semibold text-gray-700 mb-4 flex items-center">
                    <i data-lucide="list-ordered" class="w-5 h-5 mr-2 text-gray-500"></i>
                    Chọn khoảng câu hỏi để ôn:
                </h3>
                <div class="flex items-center space-x-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-500 font-bold mb-1">Từ câu số:</label>
                        <input type="number" id="startIdx" min="1" max="${totalAvailable}" value="1" class="w-full p-3 border border-gray-300 rounded-lg text-lg font-bold text-blue-600 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm text-gray-500 font-bold mb-1">Đến câu số:</label>
                        <input type="number" id="endIdx" min="1" max="${totalAvailable}" value="${totalAvailable}" class="w-full p-3 border border-gray-300 rounded-lg text-lg font-bold text-blue-600 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="text-center mt-3 text-sm text-gray-500 font-medium">(Tổng có sẵn: ${totalAvailable} câu)</div>
            `;
        }

        html = `
        <div class="py-12 px-4 flex justify-center items-center min-h-screen">
            <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 animate-fade-in">
                <div class="flex items-center text-blue-600 mb-6">
                    <i data-lucide="settings" class="w-8 h-8 mr-3"></i>
                    <h2 class="text-2xl font-bold">Cài đặt bài ôn</h2>
                </div>
                
                <div class="mb-6">
                    <h3 class="font-semibold text-gray-700 mb-2">Chủ đề:</h3>
                    <div class="p-3 bg-blue-50 text-blue-800 rounded-lg font-medium leading-relaxed">
                        ${displayCategory}
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="font-semibold text-gray-700 mb-3">Chế độ ôn tập:</h3>
                    <div class="flex space-x-3">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="mode" value="sequential" ${quizMode === 'sequential' ? 'checked' : ''} onchange="updateMode('sequential')" class="peer sr-only"/>
                            <div class="p-3 text-center border-2 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 text-gray-500 font-medium transition-colors">
                                Theo thứ tự
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="mode" value="random" ${quizMode === 'random' ? 'checked' : ''} onchange="updateMode('random')" class="peer sr-only"/>
                            <div class="p-3 text-center border-2 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 text-gray-500 font-medium transition-colors">
                                Đảo ngẫu nhiên
                            </div>
                        </label>
                    </div>
                </div>

                <div class="mb-8">
                    ${setupControlsHtml}
                </div>

                <div class="flex space-x-3">
                    <button onclick="${backAction}" class="flex-1 px-4 py-3 border border-gray-300 text-gray-700 rounded-xl font-bold hover:bg-gray-50 transition-colors">
                        Quay lại
                    </button>
                    <button onclick="startQuiz()" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-sm">
                        Bắt đầu
                    </button>
                </div>
            </div>
        </div>
        `;
    } 
    
    else if (currentView === 'QUIZ') {
        const currentQuestion = activeQuestions[currentQuestionIndex];
        const progressPercentage = ((currentQuestionIndex + 1) / activeQuestions.length) * 100;
        const hasAnswered = !!userAnswers[currentQuestion.id] || showResults;

        let optionsHtml = '';
        for (const [key, value] of Object.entries(currentQuestion.options)) {
            const isSelected = userAnswers[currentQuestion.id] === key;
            const isCorrect = currentQuestion.correctAnswer === key;
            const isWrong = isSelected && !isCorrect;
            
            let buttonClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-start justify-between ";
            
            if (!hasAnswered) {
                buttonClass += "border-gray-200 hover:border-blue-300 hover:bg-gray-50 text-gray-700 cursor-pointer";
            } else {
                if (isCorrect) {
                    buttonClass += "border-green-500 bg-green-50 text-green-900 shadow-sm"; 
                } else if (isWrong) {
                    buttonClass += "border-red-400 bg-red-50 text-red-900"; 
                } else {
                    buttonClass += "border-gray-200 opacity-60 text-gray-500 bg-gray-50 cursor-default"; 
                }
            }

            let iconHtml = '';
            if (hasAnswered && isCorrect) iconHtml = '<i data-lucide="check-circle" class="h-6 w-6 text-green-500 shrink-0 ml-3"></i>';
            if (hasAnswered && isWrong) iconHtml = '<i data-lucide="x-circle" class="h-6 w-6 text-red-500 shrink-0 ml-3"></i>';

            optionsHtml += `
                <button onclick="handleSelectAnswer('${key}')" ${hasAnswered ? 'disabled' : ''} class="${buttonClass}">
                    <div class="flex">
                        <span class="font-bold mr-3">${key}.</span>
                        <span class="leading-relaxed">${value}</span>
                    </div>
                    ${iconHtml}
                </button>
            `;
        }

        let resultsHtml = '';
        if (showResults) {
            const { score, maxScore } = calculateScore();
            const percent = Math.round((score / maxScore) * 100) || 0;
            resultsHtml = `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8 text-center animate-fade-in">
                <h3 class="text-2xl font-bold text-gray-800 mb-2">Kết quả của bạn</h3>
                <div class="text-5xl font-extrabold text-blue-600 mb-4 mt-4">
                    ${score} <span class="text-2xl text-gray-400 font-medium">/ ${maxScore} điểm</span>
                </div>
                <p class="text-gray-600 mb-8 text-lg">
                    Bạn đạt được <strong class="text-gray-800">${percent}%</strong> tổng số điểm.
                    <br/>Dùng nút "Câu trước/Câu tiếp" để xem lại các lỗi sai.
                </p>
                
                <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                    <button onclick="setView('SETUP')" class="inline-flex justify-center items-center px-6 py-3 border border-gray-300 text-base font-bold rounded-xl text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                        <i data-lucide="rotate-ccw" class="h-5 w-5 mr-2"></i> Ôn lại phần này
                    </button>
                    <button onclick="setView('CATEGORY_SELECT')" class="inline-flex justify-center items-center px-6 py-3 border border-transparent text-base font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm">
                        <i data-lucide="list" class="h-5 w-5 mr-2"></i> Đổi bài khác
                    </button>
                </div>
            </div>
            `;
        }

        let prevBtnClass = currentQuestionIndex === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-300 shadow-sm';
        let prevBtn = `
            <button onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''} class="flex items-center px-5 py-3 rounded-xl font-bold transition-colors ${prevBtnClass}">
                <i data-lucide="arrow-left" class="h-5 w-5 mr-2"></i> Câu trước
            </button>
        `;

        let nextBtn = '';
        if (!showResults && currentQuestionIndex === activeQuestions.length - 1) {
            nextBtn = `
                <button onclick="finishQuiz()" class="flex items-center px-8 py-3 rounded-xl font-bold text-white bg-green-600 hover:bg-green-700 shadow-md transition-all hover:scale-105">
                    Xem kết quả <i data-lucide="check-circle" class="h-5 w-5 ml-2"></i>
                </button>
            `;
        } else {
            let nextBtnClass = currentQuestionIndex === activeQuestions.length - 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm';
            nextBtn = `
                <button onclick="nextQuestion()" ${currentQuestionIndex === activeQuestions.length - 1 ? 'disabled' : ''} class="flex items-center px-5 py-3 rounded-xl font-bold transition-colors ${nextBtnClass}">
                    Câu tiếp <i data-lucide="arrow-right" class="h-5 w-5 ml-2"></i>
                </button>
            `;
        }

        html = `
        <div class="py-8 px-4 sm:px-6 lg:px-8">
            <div class="max-w-3xl mx-auto">
                
                <div class="flex items-center justify-between mb-6">
                    <button onclick="confirmExit()" class="flex items-center text-gray-600 hover:text-blue-600 transition-colors font-medium">
                        <i data-lucide="list" class="h-5 w-5 mr-2"></i> Danh sách bài
                    </button>
                    <div class="text-sm font-semibold text-blue-700 bg-blue-50 border border-blue-100 px-4 py-2 rounded-full shadow-sm">
                        Câu ${currentQuestionIndex + 1} / ${activeQuestions.length}
                    </div>
                </div>

                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
                    CĐ: ${quizMode === 'sequential' ? 'Theo thứ tự' : 'Ngẫu nhiên'} &nbsp;&bull;&nbsp; ${selectedSubCategory === 'ALL' ? 'Toàn bộ chương' : selectedSubCategory}
                </div>

                <div class="w-full bg-gray-200 rounded-full h-2 mb-8 relative overflow-hidden">
                    <div class="bg-blue-600 h-2 rounded-full transition-all duration-300 ease-out absolute top-0 left-0" style="width: ${progressPercentage}%"></div>
                </div>

                ${resultsHtml}

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 mb-6">
                    <div class="mb-6">
                        <span class="inline-block bg-blue-100 text-blue-800 text-sm px-3 py-1 rounded-lg font-bold mb-4 shadow-sm border border-blue-200">
                            ${currentQuestion.points} Điểm
                        </span>
                        <h3 class="text-xl font-semibold text-gray-800 leading-relaxed">
                            ${currentQuestion.question}
                        </h3>
                    </div>

                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>

                    ${hasAnswered && currentQuestion.explanation ? `
                    <div class="mt-8 p-5 bg-amber-50 border border-amber-200 rounded-xl animate-fade-in">
                        <div class="flex items-center text-amber-800 font-bold mb-3 text-lg">
                            <i data-lucide="lightbulb" class="w-5 h-5 mr-2"></i> Giải thích đáp án:
                        </div>
                        <p class="text-amber-900 leading-relaxed font-medium">
                            ${currentQuestion.explanation}
                        </p>
                    </div>
                    ` : ''}
                </div>

                <div class="flex justify-between items-center pb-12">
                    ${prevBtn}
                    ${nextBtn}
                </div>

            </div>
        </div>
        `;
    }

    app.innerHTML = html;
    lucide.createIcons();
}

render();
</script>
</body>
</html>
