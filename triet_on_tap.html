    { id: 29, question: "Câu 29. Trong các phát biểu dưới đây, phát biểu nào SAI?", options: { A: "Phương pháp biện chứng coi nguyên nhân của mọi biến đổi nằm ngoài đối tượng.", B: "Phương pháp biện chứng nhận thức đối tượng ở trong các mối liên hệ với nhau, ảnh hưởng nhau, ràng buộc nhau.", C: "Phương pháp biện chứng nhận thức đối tượng ở trạng thái vận động biến đổi, nằm trong khuynh hướng chung là phát triển.", D: "Phương pháp biện chứng là phương pháp nhận thức khoa học." }, correctAnswer: "A", explanation: "Phương pháp biện chứng coi nguyên nhân của sự biến đổi nằm ngay BÊN TRONG đối tượng (do mâu thuẫn nội tại).", points: 10 },
    { id: 30, question: "Câu 30. Cơ sở để phân chia các trào lưu triết học thành chủ nghĩa duy vật và chủ nghĩa duy tâm là:", options: { A: "Cách giải quyết mặt thứ hai của vấn đề cơ bản của triết học.", B: "Cách giải quyết vấn đề cơ bản của triết học.", C: "Cách giải quyết mặt thứ nhất của vấn đề cơ bản của triết học.", D: "Quan điểm lý luận nhận thức." }, correctAnswer: "C", explanation: "Tùy thuộc vào việc trả lời câu hỏi 'Vật chất hay ý thức có trước?' (mặt thứ nhất) mà chia thành CNDV hay CNDT.", points: 10 },
    { id: 31, question: "Câu 31. Chủ nghĩa duy vật:", options: { A: "Là những học thuyết triết học cho rằng vật chất, giới tự nhiên là cái sinh ra cùng với ý thức.", B: "Là học thuyết triết học cho rằng vật chất có trước, ý thức có sau, vật chất quyết định ý thức.", C: "Là những học thuyết triết học cho rằng ý thức là cái có trước vật chất, giới tự nhiên và quyết định vật chất, giới tự nhiên.", D: "Là những học thuyết triết học cho rằng vật chất, giới tự nhiên chỉ tồn tại trong ý thức con người mà thôi." }, correctAnswer: "B", explanation: "CNDV khẳng định tính thứ nhất của vật chất.", points: 10 },
    { id: 32, question: "Câu 32. Một học thuyết triết học chỉ mang tính nhất nguyên khi nào?", options: { A: "Khi thừa nhận tính thứ nhất của một nguyên thể.", B: "Khi không thừa nhận sự thống nhất của thế giới.", C: "Khi thừa nhận ý thức và vật chất độc lập với nhau.", D: "Khi coi thế giới là một thể thống nhất duy nhất." }, correctAnswer: "A", explanation: "Nhất nguyên là chỉ thừa nhận MỘT nguồn gốc duy nhất (hoặc là vật chất, hoặc là ý thức) sinh ra thế giới.", points: 10 },
    { id: 33, question: "Câu 33. Thế nào là nhị nguyên luận?", options: { A: "Vật chất có trước, ý thức có sau.", B: "Vật chất và ý thức song song tồn tại, không cái nào phụ thuộc cái nào.", C: "Ý thức có trước, vật chất có sau.", D: "Vật chất quyết định ý thức." }, correctAnswer: "B", explanation: "Nhị nguyên thừa nhận 2 nguyên thể vật chất và ý thức cùng song song tồn tại.", points: 10 },
    { id: 34, question: "Câu 34. Chủ nghĩa duy tâm có những hình thức cơ bản nào?", options: { A: "Chủ nghĩa duy tâm khách quan và chủ nghĩa duy tâm chủ quan.", B: "Chủ nghĩa duy thực và chủ nghĩa duy danh.", C: "Chủ nghĩa duy thực và phiếm thần luận.", D: "Chủ nghĩa duy danh và phiếm thần luận." }, correctAnswer: "A", explanation: "CNDT gồm 2 nhánh chính: Chủ quan (đề cao cảm giác cá nhân) và Khách quan (đề cao tinh thần tuyệt đối).", points: 10 },
    { id: 35, question: "Câu 35. Chủ nghĩa vật có những hình thức cơ bản nào?", options: { A: "Duy vật tôn giáo, duy vật thần bí, duy vật biện chứng.", B: "Duy vật tự phát, duy vật tôn giáo, duy vật biện chứng.", C: "Duy vật cổ điển, duy vật hiện sinh, duy vật khoa học.", D: "Duy vật cổ đại, duy vật siêu hình, duy vật biện chứng." }, correctAnswer: "D", explanation: "3 hình thức: Duy vật chất phác cổ đại -> Duy vật siêu hình cận đại -> Duy vật biện chứng.", points: 10 },
    { id: 36, question: "Câu 36. Hạn chế lớn nhất của chủ nghĩa duy vật thời cận đại là:", options: { A: "Tính chất duy tâm.", B: "Tính chất không triệt để.", C: "Tính chất siêu hình.", D: "Tính trực quan, mộc mạc, chất phác." }, correctAnswer: "C", explanation: "CNDV thời cận đại mang tính cơ giới, siêu hình, nhìn nhận sự vật tĩnh tại và rời rạc.", points: 10 },
    { id: 37, question: "Câu 37. “Tồn tại được cảm giác là quan điểm của trường phái:", options: { A: "Chủ nghĩa duy tâm khách quan.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy vật siêu hình.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "B", explanation: "Đây là câu nói nổi tiếng của Berkeley, đại biểu CNDT chủ quan.", points: 10 },
    { id: 38, question: "Câu 38. Điền từ thích hợp vào chỗ trống (...) trong luận điểm sau của V.I. Lênin: “Nhận thức là sự mãi và vô tận của ... đến khách thể (Bút ký triết học)?", options: { A: "Chủ thể.", B: "Ý thức.", C: "", D: "" }, correctAnswer: "A", explanation: "(Lưu ý: Do file gốc lỗi gõ, bản chất đáp án đúng về mặt ý nghĩa là Tư duy/Chủ thể tiến đến khách thể).", points: 10 },
    { id: 39, question: "Câu 39. Trường phái triết học nào cho rằng nhận thức là sự kết hợp các cảm giác của con người?", options: { A: "Chủ nghĩa duy tâm khách quan.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy vật siêu hình.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "B", explanation: "CNDT chủ quan coi sự vật chỉ là phức hợp của các cảm giác cá nhân.", points: 10 },
    { id: 40, question: "Câu 40. Mệnh đều nào sau đây là đúng khi nói về phương pháp siêu hình?", options: { A: "Xem xét sự vật trong mối liên hệ tác động qua lại lẫn nhau.", B: "Xem xét sự vật trong quá trình vận động, phát triển.", C: "Thừa nhận có sự đứng im tương đối của các sự vật, hiện tượng trong thế giới vật chất.", D: "Xem xét sự vật trong trạng thái đứng im." }, correctAnswer: "D", explanation: "Phương pháp siêu hình xem xét sự vật một cách tĩnh tại, đứng im, không có phát triển.", points: 10 },
    { id: 41, question: "Câu 41. Trường phái triết học nào giải thích mọi hiện tượng của tự nhiên bằng sự tác động qua lại giữa lực hút và lực đẩy?", options: { A: "Chủ nghĩa duy vật tự phát thời kỳ cổ đại.", B: "Chủ nghĩa duy vật siêu hình thế kỷ XVII - XVIII.", C: "Chủ nghĩa duy vật biện chứng.", D: "Chủ nghĩa duy tâm." }, correctAnswer: "B", explanation: "CNDV thế kỷ 17-18 bị cơ học cổ điển chi phối nên giải thích mọi thứ bằng cơ học máy móc (lực hút, đẩy).", points: 10 },
    { id: 42, question: "Câu 42. Luận điểm sau đây thuộc lập trường triết học nào: “Chúng ta chỉ nhận thức được các cảm giác của chúng ta thôi”?", options: { A: "Chủ nghĩa duy tâm khách quan.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy vật siêu hình.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "B", explanation: "Khẳng định tuyệt đối hóa cảm giác cá nhân là đặc trưng của CNDT chủ quan.", points: 10 },
    { id: 43, question: "Câu 43. Đâu là quan điểm của chủ nghĩa duy tâm chủ quan?", options: { A: "“Ngẫm hay muôn sự tại trời” (Nguyễn Du).", B: "“Đức chúa trời đã sinh ra thế giới trong sáu ngày\".", C: "Tinh thần, ý thức của con người do “trời” ban cho.", D: "“Không có cái lý nào ngoài tâm”, “Ngoài tâm không có vật”." }, correctAnswer: "D", explanation: "Khẳng định mọi sự vật chỉ tồn tại trong tâm (cảm giác con người).", points: 10 },
    { id: 44, question: "Câu 44. Quan điểm nào dưới đây của chủ nghĩa duy tâm khách quan?", options: { A: "Sự vật là sự phức hợp những cảm giác.", B: "“Người buồn cảnh có vui đâu bao giờ\" (Nguyễn Du).", C: "Ý niệm tuyệt đối, tinh thần thế giới là cái có trước thế giới vật chất”.", D: "“Không có cái lý nào ngoài tâm”, “Ngoài tâm không có vật”." }, correctAnswer: "C", explanation: "CNDT khách quan thừa nhận một tinh thần vũ trụ tối cao sinh ra vạn vật.", points: 10 },
    { id: 45, question: "Câu 45. Trường phái triết học nào cho nhận thức là sự tự ý thức về mình của ý niệm tuyệt đối?", options: { A: "Chủ nghĩa duy tâm khách quan.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy vật siêu hình.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "A", explanation: "Thuật ngữ 'Ý niệm tuyệt đối' gắn liền với CNDT khách quan (tiêu biểu là Hê-ghen).", points: 10 },
    { id: 46, question: "Câu 46. Câu ca dao: “Yêu nhau củ ấu cũng tròn, ghét nhau quả bò hòn cũng ngọt” có thể phản ánh quan điểm của trường phái nào?", options: { A: "Chủ nghĩa duy tâm khách quan.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy vật siêu hình.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "B", explanation: "Tâm trạng con người quyết định nhận thức về sự vật - phản ánh CNDT chủ quan.", points: 10 },
    { id: 47, question: "Câu 47. Câu nói: “Cái đẹp không nằm trên đôi má hồng của người thiếu nữ mà nằm trong đôi mắt của kẻ si tình” là quan điểm của:", options: { A: "Chủ nghĩa duy tâm khách quan.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy vật siêu hình.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "B", explanation: "Đề cao cái chủ quan, cảm xúc cá nhân quyết định hiện thực.", points: 10 },
    { id: 48, question: "Câu 48. Khái niệm cái bàn nói chung tồn tại trước cái bàn cụ thể, quy định sự tồn tại của cái bàn cụ thể là quan điểm của:", options: { A: "Chủ nghĩa duy tâm khách quan.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy vật siêu hình.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "A", explanation: "Đây là lý thuyết 'Ý niệm' của Platon - một đại biểu của CNDT khách quan.", points: 10 },

    { id: 50, question: "Câu 50. Chủ nghĩa duy tâm chủ quan quan niệm như thế nào về sự tồn tại của các sự vật hiện tượng trong thế giới?", options: { A: "Mọi sự vật do nguyên tử tạo nên.", B: "Các sự vật hiện tượng do Thượng Đế tạo ra.", C: "Sự vật là phức hợp của cảm giác.", D: "Sự vật tồn tại tự nó và cho nó." }, correctAnswer: "C", explanation: "CNDT Chủ quan luôn đồng nhất sự vật với cảm giác của chủ thể.", points: 10 },
    { id: 51, question: "Câu 51. Điền từ thích hợp vào chỗ trống (...): “... là toàn bộ những quan niệm của con người về thế giới, về bản thân con người, về cuộc sống và vị trí của con người trong thế giới đó”?", options: { A: "Phương pháp luận.", B: "Phương pháp.", C: "Nhân sinh quan.", D: "Thế giới quan." }, correctAnswer: "D", explanation: "Đây là định nghĩa chuẩn của Thế giới quan.", points: 10 },
    { id: 52, question: "Câu 52. Trình tự xuất hiện của các hình thức thế giới quan theo trình tự thời gian sớm nhất đến muộn nhất là:", options: { A: "Tôn giáo - thần thoại - triết học.", B: "Thần thoại - tôn giáo - triết học.", C: "Triết học - tôn giáo - thần thoại.", D: "Thần thoại - triết học - tôn giáo." }, correctAnswer: "B", explanation: "Loài người trải qua: TGQ Thần thoại -> TGQ Tôn giáo -> TGQ Triết học.", points: 10 },
    { id: 53, question: "Câu 53. Luận điểm: “Không ai tắm hai lần trên một dòng sông là của nhà triết học nào?", options: { A: "Hê-ra-clít (Heraclitus).", B: "A-ri-xtốt (Aristotle).", C: "Đê-mô-crít (Democritus).", D: "Pla-tôn (Plato)." }, correctAnswer: "A", explanation: "Heraclitus - nhà triết học duy vật tự phát nhấn mạnh sự vận động không ngừng.", points: 10 },
    { id: 54, question: "Câu 54. Luận điểm: “Tôi tư duy, vậy tôi tồn tại” là của nhà triết học nào?", options: { A: "Bê-cơn (Bacon).", B: "Đề-các (Descartes).", C: "Hốp-xơ (Hobbes).", D: "Lốc-cơ (Locke)." }, correctAnswer: "B", explanation: "Descartes (René Descartes) là tác giả của luận điểm kinh điển này.", points: 10 },

            { id: 2201, question: "Câu 1. Người được C. Mác coi là “thủy tổ” của phép biện chứng duy vật là?", options: { A: "Đê-mô-crít (Democritus).", B: "Hê-ra-clít (Heraclitus).", C: "Hê-ghen (Hegel).", D: "Canto (Kant)." }, correctAnswer: "B", explanation: "Hê-ra-clít được coi là người sáng lập ra phép biện chứng thời cổ đại với quan niệm nổi tiếng về sự vận động không ngừng của thế giới.", points: 10 },
    { id: 2202, question: "Câu 2. Theo quan điểm của triết học Mác - Lênin, biện chứng:", options: { A: "Là khái niệm dùng để chỉ sự tách biệt, cô lập, tĩnh tại, không vận động, không phát triển của các sự vật, hiện tượng, quá trình trong tự nhiên, xã hội và tư duy.", B: "Là khái niệm dùng để chỉ quá trình vận động tiến lên không ngừng của các sự vật, hiện tượng, quá trình trong tự nhiên, xã hội và tư duy.", C: "Là khái niệm dùng để chỉ mối liên hệ, tương tác, chuyển hóa và vận động phát triển theo quy luật của các sự vật, hiện tượng, quá trình trong tự nhiên, xã hội và tư duy.", D: "Là khái niệm dùng để chỉ mối liên hệ ràng buộc lẫn nhau của các sự vật, hiện tượng, quá trình trong tự nhiên, xã hội và tư duy." }, correctAnswer: "C", explanation: "Biện chứng là sự xem xét thế giới trong các mối liên hệ phổ biến, sự tác động qua lại và sự vận động, phát triển không ngừng theo những quy luật khách quan.", points: 10 },

    { id: 2217, question: "Câu 17. Điểm giới hạn mà tại đó sự thay đổi về lượng sẽ làm thay đổi chất của sự vật được gọi là:", options: { A: "Độ.", B: "Bước nhảy.", C: "Chất.", D: "Điểm nút." }, correctAnswer: "D", explanation: "Điểm nút là điểm mà sự tích lũy về lượng đã đủ để phá vỡ giới hạn độ, tạo ra sự nhảy vọt về chất.", points: 10 },
    { id: 2218, question: "Câu 18. Luận điểm “phát triển là quá trình vận động tiến lên theo đường xoáy ốc” thuộc lập trường triết học nào?", options: { A: "Duy vật siêu hình.", B: "Duy tâm khách quan.", C: "Duy vật biện chứng.", D: "Duy tâm chủ quan." }, correctAnswer: "C", explanation: "Đường xoáy ốc là biểu tượng hoàn hảo nhất cho sự phát triển biện chứng: có sự tiến lên, có tính chu kỳ, dường như lặp lại cái cũ nhưng ở mức độ cao hơn.", points: 10 },
    { id: 2219, question: "Câu 19. Theo quan điểm của triết học Mác - Lênin, mâu thuẫn biện chứng là:", options: { A: "Sự không nhất quán trong tư duy.", B: "Sự bù trừ lẫn nhau của các mặt đối lập.", C: "Sự thống nhất của các mặt đối lập bên trong các sự vật, hiện tượng hoặc giữa các sự vật hiện, tượng.", D: "Sự thống nhất và đấu tranh của các mặt đối lập trong các sự vật hiện tượng hoặc giữa các sự vật, hiện tượng với nhau." }, correctAnswer: "D", explanation: "Mâu thuẫn biện chứng luôn bao hàm cả hai quá trình: sự thống nhất và sự đấu tranh của các mặt đối lập.", points: 10 },
    { id: 2220, question: "Câu 20. Quan điểm phát triển đòi hỏi phải xem xét sự vật như thế nào?", options: { A: "Xem xét sự vật trong trạng thái đang tồn tại của sự vật.", B: "Xem xét sự vật không những trong trạng thái đang tồn tại của sự vật mà còn phải vạch ra xu hướng biến đổi của sự vật.", C: "Xem xét sự vật trong trạng thái cô lập.", D: "Xem xét sự vật trong trạng thái đứng im." }, correctAnswer: "B", explanation: "Quan điểm phát triển đòi hỏi nhìn nhận sự vật như một quá trình, không chỉ thấy hiện tại mà phải dự báo được xu hướng chuyển hóa tất yếu.", points: 10 },
    { id: 2221, question: "Câu 21. Nguồn gốc của sự phát triển theo quan điểm duy vật biện chứng là:", options: { A: "Do lực lượng siêu nhiên tạo nên.", B: "Do sự tác động của ý thức con người.", C: "Do sự đứng im tương đối của vật chất.", D: "Nguồn gốc của sự phát triển nằm ngay trong bản thân sự vật, do mâu thuẫn bên trong của sự vật quy định." }, correctAnswer: "D", explanation: "Sự đấu tranh để giải quyết mâu thuẫn nội tại chính là nguồn gốc, động lực sâu xa của sự phát triển.", points: 10 },
    { id: 2222, question: "Câu 22. Theo quan điểm của chủ nghĩa duy vật biện chứng, sự phát triển có những tính chất cơ bản nào?", options: { A: "Tính liên tục và gián đoạn.", B: "Tính đặc thù và bất biến.", C: "Tính khách quan, tính phổ biến, tính đa dạng, phong phú và tính kế thừa.", D: "Tính tương đối và tuyệt đối." }, correctAnswer: "C", explanation: "Bốn tính chất cơ bản của sự phát triển là khách quan, phổ biến, đa dạng phong phú và mang tính kế thừa.", points: 10 },
    { id: 2223, question: "Câu 23. Theo quan điểm của chủ nghĩa duy vật biện chứng, quy luật chuyển hoá từ những sự thay đổi về lượng dẫn đến sự thay đổi về chất chỉ ra:", options: { A: "Khuynh hướng của sự vận động và phát triển.", B: "Nguồn gốc của sự vận động và phát triển.", C: "Cách thức của sự vận động và phát triển.", D: "Phương thức của vận động và sự phát triển." }, correctAnswer: "C", explanation: "Quy luật lượng-chất vạch ra CÁCH THỨC chung nhất của sự vận động và phát triển (tích lũy dần về lượng tạo ra sự nhảy vọt về chất).", points: 10 },
    { id: 2224, question: "Câu 24. Trong lĩnh vực xã hội, quy luật lượng - chất được thực hiện với điều kiện gì?", options: { A: "Sự tác động ngẫu nhiên, không cần điều kiện.", B: "Cần hoạt động có ý thức của con người.", C: "Các quá trình tự động không cần đến hoạt động có ý thức của con người.", D: "Tùy từng lĩnh vực cụ thể mà có sự tham gia của con người." }, correctAnswer: "B", explanation: "Khác với tự nhiên vận động vô thức, quy luật trong xã hội bắt buộc phải được thực hiện thông qua hoạt động có ý thức, có mục đích của con người.", points: 10 },
    { id: 2225, question: "Câu 25. Theo quan điểm của chủ nghĩa duy vật biện chứng, quy luật thống nhất và đấu tranh của các mặt đối lập chỉ ra:", options: { A: "Khuynh hướng của sự vận động và phát triển.", B: "Nguồn gốc, động lực của sự vận động và phát triển.", C: "Cách thức của sự vận động và phát triển.", D: "Mục đích của sự vận động và phát triển." }, correctAnswer: "B", explanation: "Quy luật mâu thuẫn là hạt nhân của phép biện chứng, vạch ra NGUỒN GỐC, ĐỘNG LỰC của mọi sự phát triển.", points: 10 },
    { id: 2226, question: "Câu 26. Theo quan điểm của chủ nghĩa duy vật biện chứng, quy luật phủ định của phủ định chỉ ra:", options: { A: "Khuynh hướng của sự vận động và phát triển.", B: "Nguồn gốc của sự vận động và phát triển.", C: "Cách thức của sự vận động và phát triển.", D: "Mục đích của sự vận động và phát triển." }, correctAnswer: "A", explanation: "Quy luật phủ định của phủ định vạch ra KHUYNH HƯỚNG tiến lên theo hình xoáy ốc của sự vật.", points: 10 },
    { id: 2227, question: "Câu 27. Khi chúng ta nhúng một thanh sắt đã nung đỏ vào chậu nước lạnh thì nhiệt độ của nước ở trong chậu tăng lên. Song sự tăng nhiệt độ của nước ở trong chậu, đến lượt mình, lại kìm hãm tốc độ tỏa nhiệt của sắt. Hãy cho biết, tình huống trên thể hiện nội dung nào dưới đây:", options: { A: "Nguyên nhân sinh ra kết quả nhưng sau khi xuất hiện, kết quả ảnh hường trở lại đối với nguyên nhân.", B: "Bản chất sinh ra hiện tượng nhưng sau khi xuất hiện, hiện tượng ảnh hưởng trở lại đối với bản chất.", C: "Nội dung sinh ra hình thức nhưng sau khi xuất hiện, hình thức ảnh hưởng trở lại đối với nội dung.", D: "Hiện thực sinh ra khả năng nhưng sau khi xuất hiện, khả năng ảnh hưởng trở lại đối với hiện thực." }, correctAnswer: "A", explanation: "Thanh sắt nóng là nguyên nhân, làm nước tăng nhiệt là kết quả. Nước nóng lên lại tác động ngược làm kìm hãm thanh sắt tỏa nhiệt, thể hiện sự tác động ngược của kết quả đối với nguyên nhân.", points: 10 },
    { id: 2228, question: "Câu 28. Trong số các nội dung sau, nội dung nào là biểu hiện của thuật ngụy biện khi xem xét các sự vật, hiện tượng:", options: { A: "Khái quát những tri thức phong phú về nhiều mặt, nhiều mối liên hệ để rút ra tri thức về bản chất của sự vật.", B: "Kết hợp một cách vô nguyên tắc những cái hết sức khác nhau thành một hình ảnh không đúng về sự vật.", C: "Tuy để ý đến những mặt, những mối liên hệ khác nhau của sự vật, nhưng lại đưa cái không cơ bản thành cái cơ bản, cái không bản chất thành cái bản chất.", D: "Chỉ dựa vào một số mặt, một số mối liên hệ nào đó của sự vật để đưa ra kết luận về sự vật khi chưa có đầy đủ thông tin về nó." }, correctAnswer: "C", explanation: "Thuật ngụy biện là việc cố tình đánh tráo khái niệm, biến cái thứ yếu, không bản chất thành cái cơ bản, bản chất để bảo vệ một luận điểm sai trái.", points: 10 },
    { id: 2229, question: "Câu 29. Theo quan điểm của triết học Mác- Lênin, điều nào dưới đây không đúng với quan điểm toàn diện:", options: { A: "Khi nhận thức các sự vật, hiện tượng phải xem xét tất cả các mặt, các mối liên hệ trong sự tác động qua lại vốn có.", B: "Phải giữ nguyên các mối liên hệ của mỗi sự vật, không được thay đổi vai trò, vị trí của chúng trong mọi trường hợp.", C: "Phải biết phân biệt từng mối liên hệ.", D: "Phải lưu ý tới sự chuyển hóa lẫn nhau giữa các mỗi liên hệ ở những điều kiện xác định." }, correctAnswer: "B", explanation: "Các mối liên hệ luôn vận động và thay đổi vai trò (từ thứ yếu thành chủ yếu...) trong những điều kiện khác nhau, chứ không bao giờ đứng im, cố định.", points: 10 },
    { id: 2230, question: "Câu 30. Theo quan điểm của triết học Mác - Lênin, điều nào dưới đây không đúng với quan điểm về sự phát triển:", options: { A: "Yếu tố quyết định sự phát triển là môi trường khách quan, bên ngoài.", B: "Sự phát triển là kết quả của quá trình thay đổi dần dần về lượng dẫn đến sự thay đổi về chất và ngược lại.", C: "Sự phát triển có thể bao gồm những bước lùi tạm thời.", D: "Sự phát triển dẫn đến sự vật dường như quay về điểm khởi đầu nhưng trên cơ sở cao hơn." }, correctAnswer: "A", explanation: "Nguồn gốc của sự phát triển là do mâu thuẫn BÊN TRONG sự vật, chứ không phải do môi trường bên ngoài quyết định.", points: 10 },
    { id: 2231, question: "Câu 31. Trong số những phạm trù dưới đây, phạm trù nào không phải là phạm trù của phép biện chứng duy vật:", options: { A: "Chất.", B: "Lượng.", C: "Vận tốc.", D: "Vận động." }, correctAnswer: "C", explanation: "Vận tốc là một đại lượng vật lý học cụ thể, không phải là một phạm trù triết học chung nhất.", points: 10 },
    { id: 2232, question: "Câu 32. Trong những quan điểm sau, quan điểm nào không phải là quan điểm của triết học Mác - Lênin về phạm trù:", options: { A: "Phạm trù được hình thành trong quá trình hoạt động nhân thức và thực tiễn.", B: "Phạm trù là những bậc thang của quá trình nhận thức.", C: "Phạm trù là hình ảnh chủ quan của thế giới khách quan.", D: "Phạm trù có sẵn trong bản thân con người một cách bẩm sinh." }, correctAnswer: "D", explanation: "Triết học Mác khẳng định phạm trù là kết quả của quá trình nhận thức đúc kết từ thực tiễn, không phải là khái niệm tiên thiên bẩm sinh do thượng đế ban cho.", points: 10 },
    { id: 2233, question: "Câu 33. Trong Bút ký triết học, V.I. Lênin nhận xét rằng, dù người ta bắt đầu bằng bất cứ mệnh đề đơn giản nào, chẳng hạn như “Ivan là một người”, “Giutsaca là con chó”... thì ngay ở đó người ta đã thấy có phép biện chứng rồi. Hãy cho biết, nhận xét trên của V.I. Lênin nói về mối liên hệ giữa hai phạm trù nào dưới đây:", options: { A: "Bản chất và hiện tượng.", B: "Nội dung và hình thức.", C: "Cái riêng và cái chung.", D: "Tất nhiên và ngẫu nhiên." }, correctAnswer: "C", explanation: "'Ivan' hay 'Giutsaca' là CÁI RIÊNG cá biệt, còn 'người' hay 'con chó' là CÁI CHUNG. Một phán đoán đơn giản nhất cũng bao hàm mối quan hệ biện chứng giữa cái riêng và cái chung.", points: 10 },
    { id: 2234, question: "Câu 34. Dựa trên quan điểm của triết học Mác - Lênin về mối quan hệ giữa cái riêng và cái chung, luận điểm nào sau đây là ĐÚNG?", options: { A: "Cái chung tồn tại độc lập, không phụ thuộc vào cái riêng và sinh ra cái riêng.", B: "Cái riêng chỉ tồn tại trong một thời gian nhất định, còn cái chung tồn tại vĩnh viễn.", C: "Chỉ có cái riêng tồn tại thực sự, còn cái chung chỉ là những tên gọi do lý trí đặt ra, không phản ánh một cái gì có trong hiện thực.", D: "Cái riêng chỉ tồn tại trong mối quan hệ với cái chung, không có cái riêng tồn tại độc lập tuyệt đối tách rời cái chung." }, correctAnswer: "D", explanation: "Bất cứ cái riêng nào cũng bao hàm trong nó những thuộc tính chung của một lớp sự vật, không có cái riêng nào hoàn toàn cô lập, tách rời cái chung.", points: 10 },
    { id: 2235, question: "Câu 35. Phạm trù triết học nào dùng để chỉ những mặt, những thuộc tính không những có ở một sự vật, hiện tượng này mà còn lặp lại trong nhiều sự vật, hiện tượng khác?", options: { A: "Cái phổ biến.", B: "Cái chung.", C: "Cái đơn nhất.", D: "Cái quy luật." }, correctAnswer: "B", explanation: "Đây là định nghĩa chuẩn của phạm trù 'cái chung'.", points: 10 },
    { id: 2236, question: "Câu 36. Dựa trên quan quan điểm của triết học Mác - Lênin về cái chung và cái riêng, luận điểm nào sau đây là ĐÚNG?", options: { A: "Cái chung là cái toàn bộ, phong phú hơn cái riêng còn cái riêng là cái bộ phận, nhưng sâu sắc hơn cái chung.", B: "Cái chung là cái toàn bộ, sâu sắc hơn cái riêng còn cái riêng là cái bộ phận nhưng phong phú hơn cái chung", C: "Cái riêng là cái toàn bộ, phong phú hơn cái chung còn cái chung là cái bộ phận, nhưng sâu sắc hơn cái riêng.", D: "Cái riêng là cái toàn bộ, sâu sắc hơn cái chung còn cái chung là cái bộ phận, nhưng phong phú hơn cái riêng." }, correctAnswer: "C", explanation: "Lênin khẳng định: Cái riêng phong phú hơn cái chung vì ngoài cái chung nó còn chứa cái đơn nhất. Cái chung sâu sắc hơn cái riêng vì nó phản ánh những thuộc tính bản chất, lặp lại ổn định.", points: 10 },
    { id: 2237, question: "Câu 37. Theo quan điểm của triết học Mác - Lênin, cái mới xuất hiện dưới dạng nào dưới đây?", options: { A: "Cái chung.", B: "Cái riêng.", C: "Cái đơn nhất.", D: "Cái phổ biến." }, correctAnswer: "C", explanation: "Khi mới ra đời, cái mới thường xuất hiện lẻ tẻ, cá biệt dưới dạng 'cái đơn nhất', sau đó qua quá trình phát triển, nó mới lớn mạnh dần thành 'cái chung'.", points: 10 },
    { id: 2238, question: "Câu 38. Theo quan điểm của triết học Mác - Lênin, cái mới là cái:", options: { A: "Ra đời sau, phù hợp với quy luật.", B: "Ra đời từ cái cũ và kế thừa những yếu tố tích cực của cái cũ.", C: "Mở đường cho sự phát triển tiếp theo.", D: "Tất cả các đáp án trên đều đúng." }, correctAnswer: "D", explanation: "Cái mới biện chứng không chỉ là cái sinh ra sau, mà phải đại diện cho sự tiến bộ, hợp quy luật và kế thừa cái cũ.", points: 10 },
    { id: 2239, question: "Câu 39. Trong những nội dung dưới đây, nội dung nào thể hiện quan điểm triết học Mác - Lênin về mối quan hệ giữa nguyên nhân và kết quả?", options: { A: "Một nguyên nhân có thể sinh ra một hoặc nhiều kết quả,", B: "Mối quan hệ giữa nguyên nhân và kết quả lệ thuộc vào ý muốn chủ quan của con người", C: "Khái niệm nguyên nhân và kết quả chỉ là những ký hiệu mà con người dùng để ghi những cảm giác của mình.", D: "Trong sự vận động của thế giới vật chất, có nguyên nhân đầu tiên và kết quả cuối cùng" }, correctAnswer: "A", explanation: "Quan hệ nhân quả rất phức tạp, một nguyên nhân (như một chính sách kinh tế mới) có thể tạo ra vô số kết quả khác nhau (tăng thu nhập, thay đổi cơ cấu xã hội...).", points: 10 },
    { id: 2240, question: "Câu 40. Nội dung sau thể hiện tính chất gì của mỗi liên hệ nhân - quả: “Tất cả mọi hiện tượng trong tự nhiên và trong xã hội đều được gây ra bởi những nguyên nhân nhất định, không có hiện tượng nào là không có nguyên nhân”?", options: { A: "Tính khách quan.", B: "Tính phổ biến.", C: "Tính tất yếu.", D: "Tính đa dạng, phong phú." }, correctAnswer: "B", explanation: "Sự khẳng định 'không có hiện tượng nào là không có nguyên nhân' thể hiện sự tồn tại rộng khắp, phổ biến của quy luật nhân quả.", points: 10 },
    { id: 2241, question: "Câu 41. Những nguyên nhân mà sự có mặt của chúng chỉ quyết định những đặc điểm nhất thời, không ổn định, cá biệt của hiện tượng được gọi là nguyên nhân gì?", options: { A: "Nguyên nhân khách quan.", B: "Nguyên nhân bên trong.", C: "Nguyên nhân chủ yếu.", D: "Nguyên nhân thứ yếu." }, correctAnswer: "D", explanation: "Nguyên nhân thứ yếu chỉ quy định các chi tiết nhỏ, cá biệt, không đóng vai trò quyết định sự tồn tại bản chất của kết quả.", points: 10 },
    { id: 2242, question: "Câu 42. Cái do những nguyên nhân cơ bản, bên trong của kết cấu vật chất quyết định và trong những điều kiện nhất định phải xảy ra đúng như thế chứ không thể khác được gọi là gì?", options: { A: "Bản chất.", B: "Kết quả.", C: "Tất nhiên.", D: "Đơn nhất" }, correctAnswer: "C", explanation: "Đây là định nghĩa của phạm trù 'tất nhiên'.", points: 10 },
    { id: 2243, question: "Câu 43. Luận điểm nào sau đây là ĐÚNG khi nói về cái tất nhiên và cái ngẫu nhiên?", options: { A: "Ngẫu nhiên là cái do những nguyên nhân cơ bản, bên trong của kết cấu vật chất quyết định.", B: "Ngẫu nhiên là cái do những nguyên nhân bên ngoài, do sự ngẫu hợp của nhiều hoàn cảnh bên ngoài quyết định.", C: "Ngẫu nhiên là cái vừa do những nguyên nhân bên trong, vừa do nguyên nhân bên ngoài quyết định.", D: "Tất cả các phương án trên đều đúng." }, correctAnswer: "B", explanation: "Ngẫu nhiên phát sinh từ sự chằng chéo của các nguyên nhân bên ngoài, không phản ánh quy luật phát triển nội tại cốt lõi.", points: 10 },
    { id: 2244, question: "Câu 44. Dựa trên quan điểm của triết học Mác - Lênin về phạm trù cái chung và phạm trù tất nhiên, luận điểm nào sau đây là ĐÚNG?", options: { A: "Phạm trù cái chung và phạm trù tất nhiên hoàn toàn đồng nhất với nhau.", B: "Phạm trù cái chung rộng hơn phạm trù tất nhiên.", C: "Phạm trù cái chung hẹp hơn phạm trù tất nhiên.", D: "Phạm trù cái chung hoàn toàn khác biệt phạm trù tất nhiên." }, correctAnswer: "B", explanation: "Cái tất nhiên bao giờ cũng là cái chung (vì nó lặp lại ở mọi cá thể), nhưng không phải mọi cái chung đều là tất nhiên (có cái chung chỉ là ngẫu nhiên).", points: 10 },
    { id: 2245, question: "Câu 45. Dựa trên quan điểm của triết học Mác - Lênin về cái chung và cái riêng, luận điểm nào sau đây là ĐÚNG?", options: { A: "Cái chung là cái bao trùm toàn bộ cái riêng.", B: "Chỉ có cái chung tồn tại thực còn cái riêng không tồn tại.", C: "Cái chung, cái riêng cùng tồn tại khách quan, giữa chúng có mối quan hệ hữu cơ.", D: "Chỉ có cái riêng tồn tại thực còn cái chung chỉ là tên gọi trống rỗng." }, correctAnswer: "C", explanation: "Cả hai đều tồn tại thực tế, không có cái riêng thuần túy tách rời cái chung và ngược lại.", points: 10 },
    { id: 2246, question: "Câu 46. Dựa trên quan điểm của triết học Mác - Lênin về cái chung và cái riêng, luận điểm nào sau đây là ĐÚNG?", options: { A: "Cái chung chỉ tồn tại trong cái riêng.", B: "Cái chung nằm ngoài cái riêng, bao trùm toàn bộ cái riêng.", C: "Cái chung có những đặc điểm giống với cái riêng.", D: "Cái chung quyết định sự tồn tại của cái riêng." }, correctAnswer: "A", explanation: "Cái chung không lơ lửng ở một không gian trừu tượng nào đó mà nó biểu hiện ra thông qua từng cá thể (cái riêng) cụ thể.", points: 10 },
    { id: 2247, question: "Câu 47. Việc áp dụng một cách dập khuôn cách học của người này cho người khác là vi phạm nguyên tắc phương pháp luận của cặp phạm trù nào sau đây?", options: { A: "Nguyên nhân và kết quả.", B: "Bản chất và hiện tượng", C: "Cái chung và cái riêng.", D: "Khả năng và hiện thực." }, correctAnswer: "C", explanation: "Mỗi người có đặc điểm cá nhân (cái riêng, cái đơn nhất) khác nhau, nếu áp đặt y hệt công thức (cái chung) mà bỏ qua cái đơn nhất là sai lầm giáo điều.", points: 10 },
    { id: 2248, question: "Câu 48. Dựa trên quan điểm của triết học Mác - Lênin về cái tất nhiên và ngẫu nhiên, luận điểm nào sau đây là ĐÚNG?", options: { A: "Phủ nhận tính khách quan của cái tất nhiên và ngẫu nhiên.", B: "Thừa nhận tính khách quan của cái tất nhiên nhưng không thừa nhận tính khách quan của cái ngẫu nhiên.", C: "Thừa nhận tính khách quan của cái ngẫu nhiên nhưng không thừa nhận tính khách quan của cái tất nhiên.", D: "Cả cái tất nhiên và cái ngẫu nhiên đều có tính khách quan." }, correctAnswer: "D", explanation: "Dù diễn ra một cách tất yếu hay ngẫu nhiên thì chúng đều tồn tại hiện thực, nằm ngoài ý muốn chủ quan của con người.", points: 10 },
    { id: 2249, question: "Câu 49. Dựa trên quan điểm của triết học Mác - Lênin về vai trò của tất nhiên và ngẫu nhiên đối với quá trình phát triển của sự vật, luận điểm nào sau đây là ĐÚNG?", options: { A: "Tất nhiên đóng vai trò chi phối sự phát triển, còn ngẫu nhiên không có vai trò gì.", B: "Tất nhiên đống vai trò thúc đẩy sự phát triển, còn ngẫu nhiên kìm hãm sự phát triển.", C: "Tất nhiên và ngẫu nhiên đều đóng vai trò chi phối sự phát triển như nhau.", D: "Tất nhiên đóng vai trò chi phối sự phát triển, còn ngẫu nhiên có thể làm cho sự phát triển ấy diễn ra nhanh hay chậm." }, correctAnswer: "D", explanation: "Cái tất nhiên vạch ra chiều hướng vận động cốt lõi, nhưng vô số cái ngẫu nhiên tác động có thể làm quá trình đó tăng tốc hoặc bị trì hoãn.", points: 10 },
    { id: 2250, question: "Câu 50. Trong một buổi thảo luận, khi bàn về vai trò của cái tất nhiên và ngẫu nhiên đối với sự vận động phát triển của sự vật, một nhóm sinh viên đã đưa ra các ý kiến như sau. Hãy cho biết ý kiến nào đúng?", options: { A: "Cái ngẫu nhiên quyết định sự tồn tại, phát triển của sự vật.", B: "Cái tất nhiên quyết định sự tồn tại, phát triển của sự vật.", C: "Cả cái tất nhiên và cái ngẫu nhiên đều quyết định sự tồn tại, phát triển của sự vật.", D: "Cả cái tất nhiên và ngẫu nhiên đều không quyết định sự tồn tại và phát triển của sự vật." }, correctAnswer: "B", explanation: "Cái tất nhiên bắt nguồn từ mâu thuẫn bên trong, do đó nó luôn là nhân tố quyết định chiều hướng tồn tại và phát triển.", points: 10 },
    { id: 2251, question: "Câu 51. Vì sao trong nhận thức và hoạt động thực tiễn chúng ta phải phân tích, xem xét kỹ các nguyên nhân gây ra một kết quả nào đó?", options: { A: "Vì một kết quả do nhiều nguyên nhân sinh ra và các nguyên nhân ấy có vị trí, vai trò như nhau.", B: "Vì một kết quả do nhiều nguyên nhân sinh ra và các nguyên nhân ấy có vị trí, vai trò khác nhau.", C: "Vì mọi kết quả đều có một nguyên nhân nào đó sinh ra.", D: "Vì một nguyên nhân sinh ra nhiều kết quả và các kết quả có vị trí vai trò khác nhau." }, correctAnswer: "B", explanation: "Trong thực tế, một sự kiện có thể do nhiều nguyên nhân hợp thành (nguyên nhân chủ yếu, thứ yếu, bên trong, bên ngoài). Ta phải phân tích để tìm ra tác nhân quyết định nhất.", points: 10 },
    { id: 2252, question: "Câu 52. Vì sao kết quả có thể chuyển hóa thành nguyên nhân?", options: { A: "Vì quan hệ nhân quả biểu hiện tính liên tục và vô cùng tận trong sự phát triển của sự vật, hiện tượng trong thế giới khách quan.", B: "Vì đó là sự sắp đặt bởi các quy luật khách quan.", C: "Vì nó phụ thuộc vào lăng kính chủ quan của chủ thể nhận thức.", D: "Vì nguyên nhân là cái có trước, kết quả là cái có sau." }, correctAnswer: "A", explanation: "Chuỗi nhân-quả trong vũ trụ là vô hạn. Kết quả của hiện tượng này sẽ tiếp tục trở thành nguyên nhân sinh ra các hiện tượng khác.", points: 10 },
    { id: 2253, question: "Câu 53. Vì sao trong nhận thức và hoạt động thực tiễn chúng ta không được phủ nhận mối quan hệ nhân - quả?", options: { A: "Vì mối liên hệ nhân - quả biểu hiện rất phức tạp.", B: "Vì nguyên nhân và kết quả có sự chuyển hóa lẫn nhau.", C: "Vì nguyên nhân là cái có trước, kết quả là cái có sau.", D: "Vì mối liên hệ nhân - quả tồn tại khách quan." }, correctAnswer: "D", explanation: "Mối liên hệ nhân quả là quy luật tồn tại độc lập với ý thức con người. Không thể chối bỏ một sự thật khách quan đang chi phối thế giới.", points: 10 },
    { id: 2254, question: "Câu 54. Điền từ thích hợp vào chỗ trống (...) để được một định nghĩa đúng: “Kết quả dùng để chỉ sự biến đổi xuất hiện do ... giữa các mặt, các yếu tố trong một sự vật, hiện tượng hoặc giữa các sự vật, hiện tượng”?", options: { A: "Sự phụ thuộc.", B: "Sự đối lập.", C: "Sự tác động.", D: "Sự phủ định." }, correctAnswer: "C", explanation: "Sự 'tác động' lẫn nhau chính là cơ chế để sinh ra sự biến đổi (kết quả).", points: 10 },
    { id: 2255, question: "Câu 55. Theo quan điểm của triết học Mác - Lênin, đâu là đặc điểm của mối quan hệ nhân - quả?", options: { A: "Quan hệ được sắp xếp theo trình tự trước - sau.", B: "Quan hệ sản sinh.", C: "Quan hệ một chiều.", D: "Quan hệ hai chiều." }, correctAnswer: "B", explanation: "Nguyên nhân và kết quả không chỉ đơn thuần đi liền nhau về thời gian (như ngày và đêm) mà nguyên nhân bắt buộc phải SẢN SINH ra kết quả.", points: 10 },
    { id: 2256, question: "Câu 56. Điền từ thích hợp vào chỗ trống (...) để được một định nghĩa đúng: “Phạm trù tất nhiên dùng để chỉ cái do ... của kết cấu vật chất quyết định và trong những điều kiện nhất định, nó phải xảy ra như thế, không thể khác”.", options: { A: "Những nguyên nhân cơ bản, bên trong.", B: "Những nguyên nhân bên ngoài.", C: "Những nguyên nhân không cơ bản.", D: "Những nguyên nhân thứ yếu." }, correctAnswer: "A", explanation: "Cái tất nhiên luôn bắt nguồn từ cốt lõi, từ những nguyên nhân bên trong, mang tính bản chất.", points: 10 },
    { id: 2257, question: "Câu 57. Điền từ thích hợp vào chỗ trống (...) để được một định nghĩa đúng: “... là sự tác động qua lại giữa các mặt, các khuynh hướng đối lập nằm trong chính mỗi sự vật, hiện tượng; có vai trò quy định trực tiếp quá trình vận động và phát triển của sự vật, hiện tượng”?", options: { A: "Mâu thuẫn chủ yếu.", B: "Mâu thuẫn cơ bản.", C: "Mâu thuẫn đối kháng.", D: "Mâu thuẫn bên trong." }, correctAnswer: "D", explanation: "Từ khóa 'nằm trong chính mỗi sự vật' dùng để định nghĩa Mâu thuẫn bên trong.", points: 10 },
    { id: 2258, question: "Câu 58. Theo quan điểm của triết học Mác - Lênin, luận điểm nào sau đây là ĐÚNG?", options: { A: "Cả tất nhiên và ngẫu nhiên đều có tính quy luật.", B: "Ngẫu nhiên mang tính xác suất, chỉ có tất nhiên có tính quy luật.", C: "Mọi thứ đều là tất nhiên, ngẫu nhiên là cái tất nhiên không có quy luật.", D: "Tất nhiên và ngẫu nhiên đều không có tính quy luật." }, correctAnswer: "A", explanation: "Tuy ngẫu nhiên do hoàn cảnh bên ngoài quy định nhưng số lượng lớn các ngẫu nhiên vẫn tuân theo quy luật (như quy luật thống kê). Do đó cả tất nhiên và ngẫu nhiên đều có tính quy luật.", points: 10 },
    { id: 2259, question: "Câu 59. Điền từ thích hợp vào chỗ trống (..) để được một định nghĩa đúng: “Phạm trù ... dùng để chỉ cách thức liên hệ, tổ chức, sắp xếp các phần tử, yếu tố, bộ phận cấu thành một đối tượng nhất định”.", options: { A: "Bản chất.", B: "Hiện tượng.", C: "Nội dung.", D: "Hình thức." }, correctAnswer: "D", explanation: "Đây là định nghĩa chuẩn của phạm trù Hình thức.", points: 10 },
    { id: 2260, question: "Câu 60. Vì sao trong nhận thức và hoạt đông thực tiễn ta không được xem nhẹ hình thức?", options: { A: "Vì hình thức là yếu tố thường xuyên biến đổi.", B: "Vì hình thức là yếu tố ổn định hơn nội dung.", C: "Vì hình thức có tính độc lập tương đối đối với nội dung.", D: "Vì hình thức quyết định nội dung." }, correctAnswer: "C", explanation: "Hình thức không hoàn toàn thụ động. Hình thức phù hợp sẽ thúc đẩy nội dung phát triển, hình thức lỗi thời sẽ kìm hãm, do đó luôn phải chú trọng đổi mới hình thức.", points: 10 },
    { id: 2261, question: "Câu 61. Theo quan điểm của triết học Mác - Lênin, tổng hợp tất cả những mặt, những yếu tố, những quá trình tạo nên sự vật, được gọi là:", options: { A: "Chất.", B: "Bản chất.", C: "Nội dung.", D: "Lượng." }, correctAnswer: "C", explanation: "Đây là định nghĩa chuẩn của phạm trù Nội dung.", points: 10 },
    { id: 2262, question: "Câu 62. Dựa trên quan điểm của triết học Mác - Lênin về bản chất và quy luật, luận điểm nào sau đây là ĐÚNG?", options: { A: "Bản chất và quy luật là những phạm trù cùng bậc, nhưng chúng không hoàn toàn đồng nhất với nhau.", B: "Bản chất và quy luật là những phạm trù cùng bậc và chúng hoàn toàn đồng nhất với nhau.", C: "Bản chất và quy luật là những phạm trù không cùng bậc và cũng không đồng nhất với nhau.", D: "Tất cả các đáp án trên đều đúng." }, correctAnswer: "A", explanation: "V.I. Lênin khẳng định: Khái niệm quy luật là một khái niệm cùng loại với khái niệm bản chất, nhưng bản chất rộng hơn vì nó chứa nhiều quy luật.", points: 10 },
    { id: 2263, question: "Câu 63. Dựa trên quan điểm của triết học Mác - Lênin về bản chất và hiện tượng, luận điểm nào sau đây là ĐÚNG?", options: { A: "Bản chất và hiện tượng đối lập nhau, tách rời nhau.", B: "Bản chất và hiện tượng là hai mặt vừa thống nhất, vừa đối lập nhau.", C: "Bản chất và hiện tượng là hai sản phẩm tư duy trừu tượng.", D: "Bản chất và hiện tượng là sản phẩm của ý niệm." }, correctAnswer: "B", explanation: "Bản chất bao giờ cũng bộc lộ qua hiện tượng (thống nhất), nhưng đôi khi hiện tượng biểu hiện dưới dạng xuyên tạc, giả tạo che giấu bản chất (đối lập).", points: 10 },
    { id: 2264, question: "Câu 64. “Tổng hợp tất cả những mặt, những mối liên hệ tất nhiên tương đối ổn định ở bên trong sự vật, quy định sự vận động và phát triển của sự vật” được gọi là:", options: { A: "Nội dung.", B: "Quy luật.", C: "Bản chất.", D: "Tất nhiên." }, correctAnswer: "C", explanation: "Đây là định nghĩa của Bản chất.", points: 10 },
    { id: 2265, question: "Câu 65. Trong các hiện tượng sau đây, hiện tượng nào vi phạm nguyên tắc phương pháp luận được rút ra từ nội dung lý luận của mối quan hệ giữa hiện tượng và bản chất?", options: { A: "Không ngừng thu thập và tổng kết các hiện tượng.", B: "Để cao kinh nghiệm, tuyệt đối hóa vai trò của kinh nghiệm.", C: "Phát triển khoa học để tìm ra bản chất của sự vật hiện tượng.", D: "Căn cứ vào cái bản chất để cải tạo hiện thực." }, correctAnswer: "B", explanation: "Kinh nghiệm thực tiễn thường chỉ ghi nhận được các hiện tượng bên ngoài bề mặt. Nếu tuyệt đối hóa kinh nghiệm mà không đi sâu phân tích lý luận thì sẽ không thấy được bản chất.", points: 10 },
    { id: 2266, question: "Câu 66. “Trong xã hội có giai cấp, bất kỳ nhà nước nào cũng là bộ máy trấn áp của giai cấp này đối với giai cấp khác. Điều đó thể hiện ở chỗ, bất kỳ nhà nước nào cũng có quân đội, cảnh sát, tòa án, nhà tù....”. Hãy cho biết, nội dung này là một trong những biểu hiện trên thực tế của mối quan hệ giữa 2 phạm trù nào dưới đây:", options: { A: "Tất nhiên - ngẫu nhiên.", B: "Nguyên nhân - kết quả.", C: "Bản chất - hiện tượng.", D: "Nội dung - hình thức." }, correctAnswer: "C", explanation: "Bản chất của nhà nước (bộ máy trấn áp) được bộc lộ thông qua các công cụ hiện tượng rõ ràng (cảnh sát, nhà tù...).", points: 10 },
    { id: 2267, question: "Câu 67. Dựa trên quan điểm của triết học Mác - Lênin về cặp phạm trù bản chất và hiện tượng, luận điểm nào sau đây là ĐÚNG?", options: { A: "Hiện tượng biến đổi nhanh hơn so với bản chất.", B: "Hiện tượng biến đổi chậm hơn so với bản chất.", C: "Hiện tượng không phụ thuộc vào bản chất.", D: "Hiện tượng không biến đổi so với bản chất." }, correctAnswer: "A", explanation: "Bản chất mang tính ổn định, là cái cốt lõi bên trong. Còn hiện tượng là cái bên ngoài, thường xuyên biến đổi linh hoạt tùy theo hoàn cảnh.", points: 10 },
    { id: 2268, question: "Câu 68. Dựa trên quan điểm của triết học Mác - Lênin về cặp phạm trù khả năng và hiện thực, luận điểm nào sau đây là ĐÚNG?", options: { A: "Trong hoạt động thực tiễn, cần căn cứ trước hết vào khả năng.", B: "Trong hoạt động thực tiễn, cần căn cứ trước hết vào hiện thực, đồng thời phải tính đến các khả năng.", C: "Trong hoạt động thực tiển, cần căn cứ trước hết vào hiện thực, không cần tính đền các khả năng.", D: "Trong hoạt động thực tiễn, chỉ cần căn cứ vào khả năng, không cần căn cứ vào hiện thực." }, correctAnswer: "B", explanation: "Hiện thực là cái đã xảy ra, chắc chắn, nên phải làm căn cứ quyết định. Nhưng cũng phải tính trước các khả năng có thể phát sinh để có phương án dự phòng.", points: 10 },
    { id: 2269, question: "Câu 69. Dựa trên quan điểm của triết học Mác - Lênin về cặp phạm trù khả năng và hiện thực, luận điểm nào sau đây là ĐÚNG?", options: { A: "Trong hoạt động thực tiễn chỉ cần dựa vào khả năng để xác định chủ trương, phương hướng, mục đích hành động của mình.", B: "Trong hoạt động thực tiễn chỉ cần dựa vào hiện thực, không cần tính đến khả năng để xác định chủ trương, phương hướng, mục đích hành động của mình.", C: "Trong hoạt động thực tiễn cân dựa vào hiện thực và cũng phải tính đến các khả năng để xác định chủ trương, phương hướng, mục đích hành động của mình.", D: "Trong hoạt động thực tiễn không cần dựa vào hiện thực, mà chỉ cần dựa theo suy nghĩ chủ quan của bản thân để xác định chủ trương, phương hướng, mục đích hành động." }, correctAnswer: "C", explanation: "Đồng nghĩa với câu trên, hoạt động thực tiễn phải bắt rễ từ hiện thực chắc chắn nhưng phải linh hoạt lường trước tương lai (khả năng).", points: 10 },
    { id: 2270, question: "Câu 70. Dựa trên quan điểm của triết học Mác - Lênin về cặp phạm trù tất nhiên và ngẫu nhiên, luận điểm nào sau đây là ĐÚNG?", options: { A: "Cái tất nhiên và cái ngẫu nhiên có thể chuyển hóa cho nhau.", B: "Cái tất nhiên và cái ngẫu nhiên hoàn toàn tách rời nhau.", C: "Cái tất nhiên và cái ngẫu nhiên loại trừ lẫn nhau.", D: "Cái tất nhiên bao giờ cũng vạch đường đi cho mình thông qua vô số cái ngẫu nhiên, còn cái ngẫu nhiên là hình thức biểu hiện của cái tất nhiên." }, correctAnswer: "D", explanation: "Tất nhiên không nằm lơ lửng, nó bắt buộc phải biểu hiện ra ngoài thông qua những sự việc ngẫu nhiên.", points: 10 },
    { id: 2271, question: "Câu 71. Khi ta nhúng một nửa cái thước vào chậu nước, nhìn vào ta thấy cái thước bị gấp khúc, trong khi đó sự thực cái thước vẫn thắng. Tình huống trên thể hiện quan điểm triết học Mác - Lênin về nội dung nào dưới đây:", options: { A: "Hiện tượng thay đổi nhanh hơn bản chất.", B: "Bản chất thay đổi thì hiện tượng cũng thay đổi theo.", C: "Hiện tượng phản ánh sai lệch bản chất.", D: "Bản chất sâu sắc hơn hiện tượng." }, correctAnswer: "C", explanation: "Đây là ví dụ điển hình về 'hiện tượng giả', khi bề ngoài cảm giác đánh lừa làm chúng ta không thấy được bản chất thật của sự vật.", points: 10 },
    { id: 2272, question: "Câu 72. Bản chất bóc lột giá trị thặng dư của giai cấp tư sản được biểu hiện qua nhiều hiện tượng khác nhau, chẳng hạn như nhà tư bản ngày càng giàu có; công nhân có thu nhập thấp và cuộc sống ngày càng khó khăn; nhiều phong trào đấu tranh của giai cấp công nhân diễn ra; bất bình đẳng xã hội tăng lên,... Luận điểm trên cho phép chúng ta rút ra kết luận nào dưới đây:", options: { A: "Hiện tượng sâu sắc hơn bản chất.", B: "Hiện tượng phong phú hơn bản chất.", C: "Hiện tượng quan trọng hơn bản chất.", D: "Bản chất là bất biến." }, correctAnswer: "B", explanation: "Một bản chất có thể bộc lộ ra ngoài thông qua hàng ngàn hiện tượng muôn màu muôn vẻ, nên hiện tượng luôn phong phú hơn bản chất.", points: 10 },
    { id: 2273, question: "Câu 73. Khi ta gieo một đồng tiền kim loại hoàn toàn đối xứng xuống đất thì khả năng xuất hiện một trong hai mặt của đồng tiền là:", options: { A: "Khả năng chủ yếu.", B: "Khả năng thứ yếu.", C: "Khả năng tất nhiên.", D: "Khả năng ngẫu nhiên." }, correctAnswer: "D", explanation: "Xác suất đồng tiền sấp hay ngửa chịu sự tác động của hàng ngàn yếu tố bên ngoài (lực cản gió, lực tay, mặt sàn...), nên nó là ngẫu nhiên.", points: 10 },
    { id: 2274, question: "Câu 74. V.I. Lênin cho rằng: “Người mác-xít chỉ có thể sử dụng, để làm căn cứ cho chính sách của mình, những sự thật được chứng minh rõ rệt và không thể chối cãi được”. Trong câu trích này, V.I. Lênin nhấn mạnh các chính sách phải dựa vào:", options: { A: "Cái chung.", B: "Hiện thực.", C: "Tất nhiên.", D: "Bản chất." }, correctAnswer: "B", explanation: "Những 'sự thật được chứng minh rõ rệt' chính là cái Đã Xảy Ra, đang tồn tại vững chắc - tức là Hiện Thực.", points: 10 },
    { id: 2275, question: "Câu 75. Quy luật nào nói lên mối liên hệ nội tại của những khái niệm, phạm trù, những phán đoán nhờ đó trong tư tưởng của con người hình thành tri thức nào đó về sự vật?", options: { A: "Quy luật tự nhiên.", B: "Quy luật xã hội.", C: "Quy luật của tư duy.", D: "Quy luật riêng." }, correctAnswer: "C", explanation: "Đây là các quy luật tư duy logic (như quy luật đồng nhất, mâu thuẫn) diễn ra bên trong bộ óc để xử lý thông tin.", points: 10 },
    { id: 2276, question: "Câu 76. Theo quan điểm của triết học Mác - Lênin, thuộc tính:", options: { A: "Là những tính chất của sự vật, là cái vốn có của sự vật.", B: "Là những tính chất không phải là tính chất vốn có của sự vật.", C: "Mỗi sự vật chỉ có duy nhất một thuộc tính.", D: "Là biểu hiện của những chất bị che giấu." }, correctAnswer: "A", explanation: "Thuộc tính là những tính chất cấu thành nên bản chất, chất lượng của sự vật (vd: đường có thuộc tính ngọt, muối có thuộc tính mặn).", points: 10 },
    { id: 2277, question: "Câu 77. Trong lịch sử triết học, do tuyệt đối hóa tính tiệm tiến, tính dần dần của sự thay đổi về lượng nên các nhà triết học siêu hình đã phủ nhận sự tồn tại của:", options: { A: "Bước nhảy.", B: "Lượng.", C: "Vận động.", D: "Chất bị che giấu." }, correctAnswer: "A", explanation: "Siêu hình thường cho rằng sự phát triển chỉ là sự to lên hay nhỏ đi về lượng một cách đều đều mà không thừa nhận các bước nhảy vọt phá vỡ sự vật cũ.", points: 10 },
    { id: 2278, question: "Câu 78. Quy luật nào đóng vai trò hạt nhân của phép biện chứng duy vật?", options: { A: "Quy luật thống nhất và đấu tranh của các mặt đối lập.", B: "Quy luật phủ định của phủ định.", C: "Quy luật đấu tranh giai cấp.", D: "Quy luật chuyển hóa từ những sự thay đổi về lượng thành những sự thay đổi về chất và ngược lại." }, correctAnswer: "A", explanation: "Quy luật mâu thuẫn (thống nhất và đấu tranh) là hạt nhân cốt lõi vì nó vạch ra nguồn gốc tự thân của mọi sự vận động trong vũ trụ.", points: 10 },
    { id: 2279, question: "Câu 79. Theo quan điểm của chủ nghĩa duy vật biện chứng, phát triển:", options: { A: "Là sự vận động trong cân bằng.", B: "Là quá trình vận động từ thấp đến cao, từ đơn giản đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn của tự nhiên, xã hội và tư duy.", C: "Là sự tăng lên một cách đơn thuần về lượng của các sự vật, hiện tượng mà không có thay đổi về chất.", D: "Là quá trình tiến lên liên tục, không có những bước quanh co phức tạp." }, correctAnswer: "B", explanation: "Sự phát triển không phải là đi vòng tròn, mà là sự vận động có hướng đi lên theo tiến trình lịch sử.", points: 10 },
    { id: 2280, question: "Câu 80. Mỗi sự vật có bao nhiêu chất?", options: { A: "1 chất.", B: "2 chất.", C: "3 chất.", D: "Vô vàn chất." }, correctAnswer: "D", explanation: "Vì sự vật có vô vàn các mối quan hệ với những sự vật khác, nên ở mỗi góc nhìn, sự vật lại bộc lộ một 'chất' khác nhau.", points: 10 },
    { id: 2281, question: "Câu 81. Dựa trên quan điểm của triết học Mác - Lênin về phạm trù “độ”, luận điểm nào sau đây là ĐÚNG?", options: { A: "Là điểm giới hạn mà ở đó sự thay đổi về lượng sẽ làm thay đổi chất của sự vật.", B: "Là quá trình chuyển hóa về chất do những thay đổi về lượng trước đó gây nên.", C: "Là sự thống nhất giữa chất và lượng, để chỉ khoảng giới hạn mà ở đó sự thay đổi về lượng chưa làm thay đổi căn bản về chất của sự vật.", D: "Là khoảng giới hạn mà ở đó sự thay đổi về lượng đủ để làm thay đổi căn bản về chất của sự vật." }, correctAnswer: "C", explanation: "Ví dụ: Nước ở dạng lỏng có 'độ' là từ >0°C đến <100°C. Trong khoảng đó, lượng nhiệt có thể thay đổi nhưng chất (trạng thái lỏng) vẫn được giữ nguyên.", points: 10 },
    { id: 2282, question: "Câu 82. Việc không tôn trọng quá trình tích lũy về lượng ở mức độ cần thiết cho sự biến đổi về chất là sự biểu hiện của xu hướng nào?", options: { A: "Nóng vội.", B: "Bảo thủ.", C: "Chủ quan.", D: "Tiến bộ." }, correctAnswer: "A", explanation: "Chưa chịu học tập rèn luyện (tích lũy lượng) mà đã muốn có ngay thành quả (nhảy vọt chất) là biểu hiện của nôn nóng, tả khuynh.", points: 10 },
    { id: 2283, question: "Câu 83. Việc không dám thực hiện những bước nhảy cần thiết khi tích lũy về lượng đã đạt đến giới hạn độ là biểu hiện của xu hướng nào?", options: { A: "Bảo thủ.", B: "Nóng vội.", C: "Tiến bộ.", D: "Chủ quan." }, correctAnswer: "A", explanation: "Đã đủ điều kiện chín muồi nhưng lại chần chừ, không chịu bứt phá đổi mới là tâm lý bảo thủ, trì trệ, hữu khuynh.", points: 10 },
    { id: 2284, question: "Câu 84. Trong hoạt động nhận thức và thực tiễn, nếu chỉ chú trọng thực hiện những sự thay đổi về lượng mà không chú trọng thực hiện những bước nhảy cần thiết để tạo ra sự thay đổi về chất thì sẽ mắc phải sai lầm nào sau đây?", options: { A: "Bảo thủ, hữu khuynh.", B: "Nôn nóng, tả khuynh.", C: "Cục bộ, địa phương.", D: "Giáo điều, rập khuôn." }, correctAnswer: "A", explanation: "Đây là lỗi thiếu ý chí cách mạng, ngại thay đổi (hữu khuynh).", points: 10 },
    { id: 2285, question: "Câu 85. Trong hoạt động nhận thức và thực tiễn, nếu không chú trọng thực hiện những sự thay đổi về lượng mà chú trọng thực hiện những bước nhảy cần thiết để tạo ra sự thay đổi về chất thì sẽ mắc phải sai lầm nào sau đây?", options: { A: "Bảo thủ, hữu khuynh.", B: "Nôn nóng, tả khuynh.", C: "Cục bộ, địa phương.", D: "Giáo điều, rập khuôn." }, correctAnswer: "B", explanation: "Đây là lỗi đốt cháy giai đoạn, bất chấp quy luật khách quan (tả khuynh).", points: 10 },
    { id: 2286, question: "Câu 86. Dựa trên quan điểm của triết học Mác - Lênin về mối quan hệ giữa chất và lượng, luận điểm nào sau đây là SAI?", options: { A: "Mọi sự vật, hiện tượng đều là sự thống nhất giữa chất và lượng.", B: "Sự thay đổi về lượng và sự thay đổi về chất của sự vật có mối quan hệ biện chứng với nhau.", C: "Sự phân biệt giữa chất và lượng chỉ là tương đối, giữa chúng không có ranh giới tuyệt đối.", D: "Sự thay đổi về lượng và sự thay đổi về chất của sự vật là độc lập với nhau, không liên quan, tác động gì đến nhau." }, correctAnswer: "D", explanation: "Lượng và chất luôn luôn tác động biện chứng: lượng đổi dẫn đến chất đổi, và chất mới lại mở ra khả năng chứa đựng một lượng mới.", points: 10 },
    { id: 2287, question: "Câu 87. Hiện tượng sinh viên đăng ký nhiều môn học để mau chóng tốt nghiệp trước thời hạn mà không quan tâm đến chất lượng đào tạo, đến chuẩn đầu ra là vi phạm nguyên tắc phương pháp luận của quy luật nào sau đây?", options: { A: "Quy luật chuyển hóa từ những sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại.", B: "Quy luật thống nhất và đấu tranh của các mặt đối lập.", C: "Quy luật phủ định của phủ định.", D: "Quy luật của lý luận nhận thức." }, correctAnswer: "A", explanation: "Đây là tình trạng cố nhồi nhét Lượng mà bỏ quên yếu tố rèn giũa để tạo nên thay đổi thực sự về Chất.", points: 10 },
    { id: 2288, question: "Câu 88. Theo quan điểm của triết học Mác - Lênin, mâu thuẫn được tạo thành từ:", options: { A: "Hai khuynh hướng vận động ngẫu nhiên.", B: "Hai yếu tố bất kỳ trong một sự vật.", C: "Hai mặt đối lập vừa thống nhất vừa đấu tranh với nhau.", D: "Những hiện tượng bên ngoài tác động vào sự vật." }, correctAnswer: "C", explanation: "Mâu thuẫn triết học không phải là cãi vã, mà là một cơ cấu bao gồm 2 mặt vừa thống nhất hữu cơ nương tựa nhau, vừa phủ định loại trừ nhau.", points: 10 },
    { id: 2289, question: "Câu 89. Theo quan điểm của triết học Mác - Lênin, khái niệm “chất” được hiểu là:", options: { A: "Bản chất của sự vật.", B: "Chất liệu tạo nên sự vật.", C: "Tính quy định khách quan vốn có của sự vật và hiện tượng, là sự thống nhất hữu cơ của các thuộc tính làm cho sự vật là nó chứ không phải là cái khác.", D: "Là tính quy định khách quan, vốn có của sự vật biểu thị số lượng, quy mô, trình độ, tốc độ, nhịp điệu vận động và phát triển của sự vật." }, correctAnswer: "C", explanation: "Chất là đặc trưng nội tại giúp phân biệt cái bàn với cái ghế, kim loại với phi kim...", points: 10 },
    { id: 2290, question: "Câu 90. Theo quan điểm của triết học Mác - Lênin, ví dụ nào dưới đây là đúng khi nói về chất:", options: { A: "Chất của cái nhà là xi măng, gạch, thép.", B: "Chất của xí nghiệp là công nhân, máy móc, sản phẩm.", C: "Chất là sự tốt, xấu của sự vật, là hiệu quả của hoạt động con người.", D: "Tất cả các đáp án trên đều sai." }, correctAnswer: "D", explanation: "A và B nhầm 'chất' với vật liệu cấu thành. C nhầm 'chất' với đánh giá đạo đức/giá trị tốt xấu. Trong triết học, chất là tính quy định khách quan phân biệt sự vật.", points: 10 },
    { id: 2291, question: "Câu 91. Phát biểu nào sau đây là đúng khi nói về phạm trù chất trong quy luật chuyển hóa từ những sự thay đổi về lượng thành những sự thay đổi về chất và ngược lại?", options: { A: "Chất là chất liệu của sự vật.", B: "Chất là bản chất của sự vật và có mối liên hệ thống nhất với hiện tượng.", C: "Chất là sự thống nhất hữu cơ của những thuộc tính làm cho sự vật là nó chứ không phải là các khác.", D: "Chất là sự tồn tại khách quan của bản thân sự vật." }, correctAnswer: "C", explanation: "Định nghĩa kinh điển về Chất theo triết học Mác-Lênin.", points: 10 },
    { id: 2292, question: "Câu 92. Theo quan điểm của triết học Mác - Lênin, khái niệm “lượng”:", options: { A: "Là tổng hợp các thuộc tính của sự vật.", B: "Tính quy định khách quan vốn có của sự vật và hiện tượng, là sự thống nhất hữu cơ của các thuộc tính làm cho sự vật là nó chứ không phải là cái khác.", C: "Là một thuộc tính của sự vật.", D: "Là tính quy định khách quan, vốn có của sự vật biểu thị về mặt số lượng, quy mô, trình độ, tốc độ, nhịp điệu vận động và phát triển của sự vật." }, correctAnswer: "D", explanation: "Lượng đo lường kích thước, chiều dài, tốc độ chạy, trọng lượng... của sự vật.", points: 10 },
    { id: 2293, question: "Câu 93. Đâu không phải là lượng tương ứng của chất “sinh viên giỏi”?", options: { A: "Điểm số các môn học.", B: "Thành tích nghiên cứu khoa học sinh viên.", C: "Thành tích tham gia phong trào tình nguyện.", D: "Mức độ thường xuyên tham gia phát biểu ý kiến xây dựng bài." }, correctAnswer: "D", explanation: "D mang tính chất hành vi cá nhân (biểu hiện) nhiều hơn là một thước đo định lượng (lượng) vững chắc cấu thành nên một chuẩn mực học thuật như 'sinh viên giỏi'.", points: 10 },
    { id: 2294, question: "Câu 94. Biện chứng khách quan là phạm trù dùng để chỉ:", options: { A: "Biện chứng của chính quá trình nhận thức thể giới bởi con người.", B: "Biện chứng của tư duy phản ánh thế giới vào bộ óc con người.", C: "Biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người.", D: "Sự phản ánh của biện chứng khách quan vào đầu óc con người." }, correctAnswer: "C", explanation: "Tự bản thân vũ trụ đang liên tục vận động và chuyển hóa (mặt trời lặn mọc, thủy triều, tiến hóa sinh học...), đó là biện chứng khách quan.", points: 10 },
    { id: 2295, question: "Câu 95. Dựa trên quan điểm của triết học Mác - Lênin về mối liên hệ, luận điểm nào sau đây là SAI?", options: { A: "Mối liên hệ phổ biến có tính khách quan.", B: "Mối liên hệ phổ biến có tính đa dạng, phong phú.", C: "Mối liên hệ giữa các sự vật, hiện tượng có tính phổ biến.", D: "Mối liên hệ giữa các sự vật, hiện tượng chỉ là do con người tưởng tượng ra." }, correctAnswer: "D", explanation: "Mối liên hệ tồn tại trong bản thân cấu trúc vật chất của thế giới, con người chỉ nhận thức chúng chứ không tưởng tượng ra chúng.", points: 10 },
    { id: 2296, question: "Câu 96. Câu chuyện dân gian nào đây đưa ra bài học về sự cần thiết phải có quan điểm toàn diện trong nhận thức?", options: { A: "Đẽo cày giữa đường.", B: "Trí khôn của ta đây.", C: "Cóc kiện trời.", D: "Thầy bói xem voi." }, correctAnswer: "D", explanation: "Sờ một bộ phận (tai, vòi, chân) rồi kết luận về toàn bộ con voi là ví dụ kinh điển của việc nhận thức phiến diện, thiếu quan điểm toàn diện.", points: 10 },
    { id: 2297, question: "Câu 97. Nghiên cứu nguyên lý về sự phát triển, yêu cầu muốn nhận thức được khuynh hướng phát triển của sự vật, hiện tượng thì phải tuân thủ nguyên tắc?", options: { A: "Nguyên tắc toàn diện.", B: "Nguyên tắc khách quan.", C: "Nguyên tắc sáng tạo.", D: "Nguyên tắc phát triển." }, correctAnswer: "D", explanation: "Nguyên tắc phát triển yêu cầu nhìn nhận sự vật trong xu hướng vận động, biến đổi không ngừng của nó.", points: 10 },
    { id: 2298, question: "Câu 98. Quan điểm toàn diện, quan điểm lịch sử - cụ thể là những quan điểm được rút ra từ:", options: { A: "Mối quan hệ giữa nhận thức và thực tiễn.", B: "Mối quan hệ giữa vật chất và ý thức.", C: "Hai nguyên lý cơ bản của phép biện chứng duy vật.", D: "Các quy luật cơ bản của phép biện chứng duy vật." }, correctAnswer: "C", explanation: "Quan điểm toàn diện rút ra từ nguyên lý về mối liên hệ phổ biến. Quan điểm lịch sử-cụ thể cũng được rút ra từ việc tổng hợp tinh thần của cả 2 nguyên lý này.", points: 10 },
    { id: 2299, question: "Câu 99. Theo quan điểm của triết học Mác - Lênin, nguyên tắc phát triển yêu cầu:", options: { A: "Cần đặt đối tượng trong xu hướng vận động nhằm phát hiện xu hướng biến đổi, dự Báo khuynh hướng phát triển trong tương lai.", B: "Cần tìm hình thức, phương pháp tác động phù hợp với từng giai đoạn, đặc điểm, tính chất của đối tượng để thức đẩy hoặc kìm hãm sự phát triển đó.", C: "Cần phát hiện và ủng hộ đối tượng mới hợp quy luật, tạo điều kiện cho nó phát triển.", D: "Cần đặt đối tượng trong chỉnh thể thống nhất của tất cả các mặt, các bộ phận, các yếu tố, các mối liên hệ của chỉnh thể đó." }, correctAnswer: "A", explanation: "Đã đánh giá sự vật là phải đánh giá nó sẽ đi về đâu trong tương lai, chứ không chỉ đóng băng nó ở hiện tại.", points: 10 },
    { id: 2300, question: "Câu 100. Căn cứ vào quan hệ giữa các mặt đối lập trong một sự vật, hiện tượng hoặc giữa các sự vật, hiện tượng với nhau, có thể phân chia mâu thuẫn thành:", options: { A: "Mâu thuẫn đối kháng và mâu thuẫn không đối kháng.", B: "Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu.", C: "Mâu thuẫn cơ bản và mâu thuẫn không cơ bản.", D: "Mâu thuẫn bên trong và mâu thuẫn bên ngoài." }, correctAnswer: "D", explanation: "Nếu xét mối quan hệ giữa các mặt TRONG 1 sự vật thì là nội tại (bên trong), xét quan hệ GIỮA sự vật này với sự vật khác thì là ngoại tại (bên ngoài). Lỗi văn bản câu hỏi có thể gây nhiễu, nhưng đáp án logic phân loại theo 'quan hệ vị trí' là D.", points: 10 },
    { id: 2301, question: "Câu 101. Căn cứ vào vai trò của mâu thuẫn đối với sự tồn tại và phát triển của sự vật, hiện tượng trong mỗi giai đoạn nhất định, có thể phân chia mâu thuẫn thành:", options: { A: "Mâu thuẫn đối kháng và mâu thuẫn không đối kháng.", B: "Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu.", C: "Mâu thuẫn cơ bản và mâu thuẫn không cơ bản.", D: "Mâu thuẫn bên trong và mâu thuẫn bên ngoài." }, correctAnswer: "B", explanation: "Tùy từng giai đoạn lịch sử mà có một mâu thuẫn nổi lên đóng vai trò quyết định chi phối (chủ yếu), còn các mâu thuẫn khác bị đẩy xuống (thứ yếu).", points: 10 },
    { id: 2302, question: "Câu 102. Căn cứ vào tính chất đối lập về lợi ích cơ bản giữa các giai cấp trong xã hội có đối kháng giai cấp, có thể phân chia mâu thuẫn thành:", options: { A: "Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu.", B: "Mâu thuẫn đối kháng và mâu thuẫn không đối kháng.", C: "Mâu thuẫn cơ bản và mâu thuẫn không cơ bản.", D: "Mâu thuẫn bên trong và mâu thuẫn bên ngoài." }, correctAnswer: "B", explanation: "Đây là cách phân loại mâu thuẫn đặc thù dùng riêng cho lĩnh vực xã hội có giai cấp.", points: 10 },
    { id: 2303, question: "Câu 103. Loại mâu thuẫn đặc thù chỉ có trong lĩnh vực xã hội là:", options: { A: "Mâu thuẫn bên trong và mâu thuẫn bên ngoài.", B: "Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu.", C: "Mâu thuẫn cơ bản và mâu thuẫn không cơ bản.", D: "Mâu thuẫn đối kháng và mâu thuẫn không đối kháng." }, correctAnswer: "D", explanation: "Chỉ trong xã hội con người mới nảy sinh quan hệ giai cấp, bóc lột, do đó mới có khái niệm đối kháng giai cấp.", points: 10 },
    { id: 2304, question: "Câu 104. Dựa trên quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa lý luận và thực tiễn, luận điểm nào sau đây là SAI?", options: { A: "Thực tiễn không có lý luận là thực tiễn mù quáng.", B: "Lý luận không có thực tiễn là lý luận suông.", C: "Lý luận có thể phát triển tự nó không cần thực tiễn.", D: "Lý luận và thực tiễn có mối quan hệ biện chứng." }, correctAnswer: "C", explanation: "Thực tiễn là cơ sở, là nguồn gốc của mọi lý luận. Lý luận không thể tự sinh ra từ hư vô nếu không có hoạt động thực tiễn của loài người.", points: 10 },
    { id: 2305, question: "Câu 105. Dựa trên quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa lý luận và thực tiễn, luận điểm nào sau đây là ĐÚNG?", options: { A: "Lý luận bắt nguồn trực tiếp từ kinh nghiệm, nhiều kinh nghiệm ắt dẫn đến lý luận.", B: "Lý luận được hình thành từ kinh nghiệm, trên cơ sở kinh nghiệm, kinh nghiệm là cơ sở của lý luận.", C: "Lý luận và kinh nghiệm tách rời nhau, không liên quan đến nhau.", D: "Lý luận luôn đi trước kinh nghiệm, kinh nghiệm luôn đi sau lý luận và phục vụ cho lý luận." }, correctAnswer: "B", explanation: "Kinh nghiệm thực tiễn là chất liệu, vật liệu để con người đúc kết, trừu tượng hóa và hệ thống hóa nâng lên thành lý luận khoa học.", points: 10 },
    { id: 2306, question: "Câu 106. Quan điểm ủng hộ cái mới, chống lại cái cũ, cái lỗi thời kìm hãm sự phát triển là quan điểm được rút ra trực tiếp từ:", options: { A: "Quy luật thống nhất và đấu tranh các mặt đối lập.", B: "Quy luật chuyển hoá từ những sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại.", C: "Quy luật phủ định của phủ định.", D: "Quy luật phát triển." }, correctAnswer: "C", explanation: "Quy luật PĐ của PĐ chỉ ra rằng cái mới luôn ra đời từ quá trình phủ định cái cũ một cách tất yếu khách quan.", points: 10 },
    { id: 2307, question: "Câu 107. Tư tưởng nôn nóng, đốt cháy giai đoạn phản ánh trực tiếp việc:", options: { A: "Không vận dụng đúng quy luật thống nhất và đấu tranh của các mặt đối lập.", B: "Không vận dụng đúng quy luật từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại.", C: "Không vận dụng đúng quy luật tự nhiên.", D: "Không vận dụng đúng quy luật phủ định của phủ định." }, correctAnswer: "B", explanation: "Nôn nóng là muốn có ngay cái CHẤT mới trong khi chưa chịu đổ mồ hôi công sức để tích lũy LƯỢNG.", points: 10 },
    { id: 2308, question: "Câu 108. Từ nguyên lý về sự phát triển phép biện chứng duy vật, chúng ta rút ra nguyên tắc phương pháp luận nào cho hoạt động lý luận và thực tiễn?", options: { A: "Nguyên tắc khách quan.", B: "Nguyên tắc phát triển.", C: "Nguyên tắc toàn diện.", D: "Nguyên tắc thống nhất giữa lý luận và thực tiễn." }, correctAnswer: "B", explanation: "Nguyên tắc đòi hỏi phải luôn nhìn sự vật trong trạng thái động, biến đổi không ngừng.", points: 10 },
    { id: 2309, question: "Câu 109. Từ nguyên lý về mối liên hệ phổ biến của phép biện chứng duy vật, chúng ta rút ra những nguyên tắc phương pháp luận nào cho hoạt động lý luận và thực tiễn?", options: { A: "Quan điểm phát triển.", B: "Quan điểm lịch sử - cụ thể.", C: "Quan điểm toàn diện.", D: "Quan điểm toàn diện và lịch sử - cụ thể." }, correctAnswer: "D", explanation: "Vì vạn vật liên hệ với nhau chằng chéo nên phải nhìn 'toàn diện'; và vì các mối liên hệ đó thay đổi theo từng hoàn cảnh cụ thể nên phải nhìn 'lịch sử - cụ thể'.", points: 10 },
    { id: 2310, question: "Câu 110. Từ nguyên lý về sự phát triển của phép biện chứng duy vật, chúng ta rút ra những nguyên tắc phương pháp luận nào cho hoạt động lý luận và thực tiễn?", options: { A: "Quan điểm phát triển.", B: "Quan điểm lịch sử - cụ thể.", C: "Quan điểm toàn diện.", D: "Quan điểm phát triển và quan điểm lịch sử - cụ thể." }, correctAnswer: "D", explanation: "Phát triển là một quá trình kéo dài, trải qua các nấc thang khác nhau. Do đó ta phải vận dụng cả quan điểm phát triển và quan điểm lịch sử-cụ thể.", points: 10 },
    { id: 2311, question: "Câu 111. Tính hệ thống của các phạm trù và quy luật của phép biện chứng duy vật có nguyên nhân là do:", options: { A: "Bản thân thế giới là một hệ thống.", B: "Thế giới tồn tại khách quan, độc lập với ý thức.", C: "Các mối liên hệ trong thế giới rất phức tạp.", D: "Do tư tuy con người có năng lực hệ thống hóa." }, correctAnswer: "A", explanation: "Vì bản thân thế giới vật chất bên ngoài là một chỉnh thể thống nhất liên kết thành hệ thống, nên các quy luật (là ảnh phản chiếu của thế giới) cũng phải có tính hệ thống.", points: 10 },
    { id: 2312, question: "Câu 112. Giả sử Hà Nội là một cái riêng thì yếu tố nào sau đây là cái đơn nhất của nó?", options: { A: "Thủ đô nước Cộng hoà xã hội chủ nghĩa Việt Nam.", B: "Mật độ dân số cao.", C: "Ô nhiễm không khí nghiêm trọng.", D: "Lối sống đô thị." }, correctAnswer: "A", explanation: "Chỉ duy nhất Hà Nội mang danh vị 'Thủ đô của nước CHXHCN Việt Nam', nó không lặp lại ở bất kỳ tỉnh thành (cái riêng) nào khác.", points: 10 },
    { id: 2313, question: "Câu 113. Quan điểm duy vật biện chứng khẳng định nguồn gốc của sự phát triển là do:", options: { A: "Sự tác động của lực lượng siêu nhiên.", B: "Ý chí chủ quan của con người.", C: "Giải quyết các mâu thuẫn trong bản thân sự vật.", D: "Ý thức, cảm giác của con người." }, correctAnswer: "C", explanation: "Nguồn gốc sâu xa luôn là quá trình tự đấu tranh sinh tồn giữa các mặt đối lập nằm ngay BÊN TRONG sự vật.", points: 10 },
    { id: 2314, question: "Câu 114. Quan điểm duy vật biện chứng khẳng định nguồn gốc của mối liên hệ phổ biến là do:", options: { A: "Lực lượng siêu nhiên quy định.", B: "Tính thống nhất vật chất của thế giới.", C: "Tư duy của con người tạo ra rồi đưa vào tự nhiên và xã hội.", D: "Tính ngẫu nhiên của các hiện tượng vật chất." }, correctAnswer: "B", explanation: "Các sự vật dù khác biệt đến đâu cũng đều được cấu tạo từ các hạt cơ bản, tuân theo quy luật vật lý chung, tức là thống nhất ở tính vật chất.", points: 10 },
    { id: 2315, question: "Câu 115. Theo quan điểm của triết học Mác Lênin, phát triển là:", options: { A: "Quá trình vận động tiến lên từ thấp đến cao, từ đơn giản đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn của sự vật.", B: "Mọi sự biến đổi nói chung của sự vật.", C: "Mọi sự vận động, biến đổi của sự vật làm cho sự vật mới ra đời thay thế sự vật cũ.", D: "Chỉ là quá trình tích luỹ về lượng." }, correctAnswer: "A", explanation: "Định nghĩa chuẩn của sự phát triển, phân biệt nó với sự tiến hóa hay tiến bộ đơn thuần.", points: 10 },
    { id: 2316, question: "Câu 116. Hai xu hướng duy thực và duy danh giải quyết mối quan hệ giữa cặp phạm trù nào trong triết học Mác - Lênin?", options: { A: "Bản chất - hiện tương.", B: "Khả năng - hiện thực.", C: "Cái chung - cái riêng.", D: "Nội dung - hình thức." }, correctAnswer: "C", explanation: "Trong lịch sử triết học Trung cổ, cuộc tranh luận lớn giữa phái Duy Thực và phái Duy Danh xoay quanh việc cái chung hay cái riêng tồn tại thực sự.", points: 10 },
    { id: 2317, question: "Câu 117. Khi bàn về mối quan hệ giữa cái chung và cái riêng, các nhà duy thực khẳng định:", options: { A: "Cái chung không tồn tại trong hiện thực khách quan.", B: "Cái chung tồn tại độc lập, không phụ thuộc vào cái riêng.", C: "Cái chung tồn tại lệ thuộc hoàn toàn vào cái riêng.", D: "Cái chung và cái riêng tồn tại không tách rời nhau, gắn liền với đối tượng xác định." }, correctAnswer: "B", explanation: "Phái duy thực (điển hình như Platon) cho rằng 'Cái chung' (ý niệm) có trước và tồn tại độc lập hoàn toàn ở một thế giới siêu nhiên.", points: 10 },
    { id: 2318, question: "Câu 118. Khi bàn về mối quan hệ giữa cái chung và cái riêng, các nhà duy danh khẳng định:", options: { A: "Cái riêng và cái chung tồn tại không tách rời nhau, gắn liền với đối tượng xác định.", B: "Cái riêng không tồn tại trong hiện thực khách quan.", C: "Cái riêng tồn tại lệ thuộc hoàn toàn vào cái chung.", D: "Cái riêng tồn tại độc lập, không phụ thuộc vào cái chung." }, correctAnswer: "D", explanation: "Phái duy danh ngược lại, cho rằng chỉ có các sự vật cá biệt (cái riêng) mới tồn tại thật, còn cái chung chỉ là 'cái tên gọi' trống rỗng do con người đặt ra.", points: 10 },
    { id: 2319, question: "Câu 119. Quy luật nào đóng vai trò là hạt nhân cốt lõi của phép biện chứng duy vật?", options: { A: "Quy luật chuyển hoá từ những thay đổi về lượng thành những thay đổi về chất và ngược lại.", B: "Quy luật thống nhất và đấu tranh của các mặt đối lập.", C: "Quy luật phủ định của phủ định.", D: "Quy luật tiến hoá và cách mạng." }, correctAnswer: "B", explanation: "Lênin gọi quy luật Mâu thuẫn là 'hạt nhân' vì nó chứa đựng nguyên lý gốc rễ tạo nên mọi động lực vận động.", points: 10 },
    { id: 2320, question: "Câu 120. Căn cứ vào thời gian của sự thay đổi về chất và dựa trên cơ chế của sự thay đổi đó, bước nhảy được chia thành:", options: { A: "Bước nhảy toàn bộ và bước nhảy cục bộ.", B: "Bước nhảy bên trong và bước nhảy bên ngoài.", C: "Bước nhảy cơ bản và bước nhảy không cơ bản.", D: "Bước nhảy tức thời và bước nhảy dần dần." }, correctAnswer: "D", explanation: "Phân chia theo thời gian tốc độ thì có bước nhảy diễn ra cực nhanh (tức thời - như một vụ nổ) và bước nhảy kéo dài (dần dần - như tiến hóa sinh học).", points: 10 },
    { id: 2321, question: "Câu 121. Căn cứ vào sự tồn tại và phát triển của toàn bộ sự vật, hiện tượng, mâu thuẫn được chia thành:", options: { A: "Mâu thuẫn cơ bản và mâu thuẫn không cơ bản.", B: "Mâu thuẫn bên trong và mâu thuẫn bên ngoài.", C: "Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu.", D: "Mâu thuẫn đối kháng và không đối kháng." }, correctAnswer: "A", explanation: "Mâu thuẫn cơ bản là mâu thuẫn xuyên suốt, quyết định bản chất của sự vật từ khi sinh ra đến khi chết đi.", points: 10 },
    { id: 2322, question: "Câu 122. Chất của sự vật là:", options: { A: "Bất kỳ thuộc tính nào của sự vật.", B: "Thuộc tính cơ bản của sự vật.", C: "Tổng hợp các thuộc tính cơ bản của sự vật.", D: "Các yếu tố ngẫu nhiên tạo nên sự vật." }, correctAnswer: "C", explanation: "Chất không phải là một thuộc tính đơn lẻ, mà là một khối cấu trúc tổng hòa của NHIỀU thuộc tính CƠ BẢN.", points: 10 },
    { id: 2323, question: "Câu 123. Theo quan điểm của triết học Mác Lênin, nguyên nhân là:", options: { A: "Sự tác động lẫn nhau giữa các mặt trong cùng một sự vật.", B: "Sự tác động lẫn nhau giữa các sự vật.", C: "Sự tác động lẫn nhau giữa các mặt trong một sự vật hoặc giữa các sự vật với nhau, gây ra một biến đổi nhất định nào đó.", D: "Những yếu tố tình cờ dẫn đến thay đổi." }, correctAnswer: "C", explanation: "Định nghĩa đầy đủ về nguyên nhân (bao gồm cả tương tác nội bộ và tương tác ngoại lai).", points: 10 },
    { id: 2324, question: "Câu 124. Việc trang trí bìa của một cuốn sách (màu sắc trình bày, khổ chữ, kiểu chữ...) là nội dung hay hình thức của cuốn sách?", options: { A: "Nội dung", B: "Hình thức.", C: "Không là nội dung cũng không là hình thức.", D: "Là nội dung hay hình thức phải tuỳ thuộc vào quan hệ" }, correctAnswer: "B", explanation: "Văn bản, cốt truyện là nội dung, còn cách bài trí in ấn là phương thức biểu hiện ra ngoài, tức hình thức.", points: 10 },
    { id: 2325, question: "Câu 125. Khái niệm hiện thực dùng để chỉ:", options: { A: "Các sự vật, hiện tượng vật chất tồn tại độc lập với ý thức con người.", B: "Các sự vật, hiện tượng vật chất đang tồn tại một cách khách quan trong thực tế và cả những gì đang tồn tại một cách chủ quan trong ý thức con người.", C: "Hiện thực khách quan.", D: "Cái chỉ tồn tại trong tư duy." }, correctAnswer: "B", explanation: "Phạm trù 'hiện thực' bao hàm cả hiện thực khách quan (vật chất) và hiện thực chủ quan (ý thức của con người đang diễn ra thực sự).", points: 10 },
    { id: 2326, question: "Câu 126. Theo quan điểm của triết học Mác - Lênin, khả năng:", options: { A: "Là cái hiện chưa xảy ra, nhưng nhất định sẽ xảy ra khi có điều kiện thích hợp.", B: "Là cái đang có, đang tồn tại khách quan.", C: "Là các mối liên hệ khách quan, tất nhiên bên trong sự vật.", D: "Là phương thức tồn tại, biểu hiện và phát triển của sự vật." }, correctAnswer: "A", explanation: "Khả năng là tập hợp các tiền đề đang phôi thai trong hiện thực, hứa hẹn sẽ biến thành hiện thực trong tương lai.", points: 10 },
    { id: 2327, question: "Câu 127. Khả năng được hình thành do:", options: { A: "Quy luật vận động nội tại của sự vật.", B: "Các tương tác ngẫu nhiên.", C: "Các tương tác tất nhiên.", D: "Ý muốn chủ quan của con người." }, correctAnswer: "A", explanation: "Khả năng không phải do con người tưởng tượng bừa bãi, mà nó được nhen nhóm một cách khách quan từ chính quy luật vận động của sự vật đó.", points: 10 },
    { id: 2328, question: "Câu 128. Quy luật là:", options: { A: "Bản thân các sự vật, hiện tượng.", B: "Các thuộc tính của sự vật, hiện tượng.", C: "Mối liên hệ giữa các sự vật hay giữa các thuộc tính của sự vật biểu hiện trong sự vận động của nó.", D: "Những gì do con người quy ước đặt ra." }, correctAnswer: "C", explanation: "Quy luật là những mối liên hệ bản chất, tất nhiên, phổ biến và lặp đi lặp lại.", points: 10 },
    { id: 2329, question: "Câu 129. Quan niệm nào sau đây về độ là quan niệm đúng:", options: { A: "Độ là mối liên hệ giữa chất và lượng của sự vật.", B: "Độ là sự thống nhất giữa chất và lượng của sự vật.", C: "Độ là phạm vi biến đổi không có giới hạn.", D: "Độ là giới hạn thống nhất giữa chất và lượng của sự vật, là giới hạn trong đó sự thay đổi về lượng của sự vật chưa làm thay đổi căn bản chất của sự vật ấy." }, correctAnswer: "D", explanation: "Định nghĩa hoàn chỉnh về giới hạn 'Độ' trong quy luật lượng-chất.", points: 10 },
    { id: 2330, question: "Câu 130. Mặt đối lập biện chứng là:", options: { A: "Các mặt có đặc điểm, thuộc tính, có khuynh hướng biến đổi trái ngược nhau.", B: "Các mặt đối lập nằm trong sự liên hệ, tác động qua lại lẫn nhau.", C: "Các mặt cùng tồn tại trong một sự vật, chúng có mối liên hệ hữu cơ, ràng buộc, làm tiền đề tồn tại cho nhau nhưng lại phát triển theo chiều hướng trái ngược nhau.", D: "Các yếu tố bên ngoài có trong các sự vật do con người tạo ra." }, correctAnswer: "C", explanation: "Đây là định nghĩa đầy đủ để phân biệt đối lập biện chứng (vừa thống nhất vừa đấu tranh) với đối lập thông thường.", points: 10 },
    { id: 2331, question: "Câu 131. Dựa trên quan điểm của triết học Mác - Lênin về sự đấu tranh của các mặt đối lập, luận điểm nào sau đây là ĐÚNG?", options: { A: "Đấu tranh giữa các mặt đối lập là tạm thời.", B: "Đấu tranh giữa các mặt đối lập là tuyệt đối.", C: "Đấu tranh giữa các mặt đối lập là tương đối.", D: "Đấu tranh giữa các mặt đối lập vừa tuyệt đối vừa tương đối." }, correctAnswer: "B", explanation: "Sự thống nhất là tương đối, tạm thời. Còn sự vận động, sự đấu tranh mâu thuẫn để phát triển là quá trình diễn ra liên tục, vĩnh viễn, tức tuyệt đối.", points: 10 },
    { id: 2332, question: "Câu 132. Thống nhất của hai mặt đối lập biện chứng là:", options: { A: "Sự bài trừ, gạt bỏ lẫn nhau giữa hai mặt đối lập biện chứng.", B: "Sự liên hệ, qui định, xâm nhập vào nhau tạo thành một chủ thể thống nhất.", C: "Hai mặt đối lập có tính chất, đặc điểm, khuynh hướng phát triển trái ngược nhau.", D: "Quá trình cái mới ra đời thay thế cái cũ." }, correctAnswer: "B", explanation: "Mặt đối lập này lấy mặt đối lập kia làm tiền đề tồn tại, hòa quyện với nhau trong một kết cấu chung gọi là thống nhất.", points: 10 },
    { id: 2333, question: "Câu 133. Đấu tranh của hai mặt đối lập biện chứng là:", options: { A: "Sự liên hệ, tác động, bài trừ, phủ định, chuyển hóa lẫn nhau làm cho sự vật luôn vận động, phát triển và biến đổi.", B: "Sự hỗ trợ lẫn nhau.", C: "Sự gắn bó lẫn nhau giữa hai mặt đối lập biện chứng.", D: "Sự tác động lẫn nhau giữa hai mặt đối lập biện chứng." }, correctAnswer: "A", explanation: "Đấu tranh không phải là phá hoại vô nghĩa, mà là quá trình xung đột nhằm tạo ra sự chuyển hóa và khai sinh cái mới.", points: 10 },
    { id: 2334, question: "Câu 134. Theo quan điểm của triết học Mác - Lênin, sự đấu tranh của các mặt đối lập là:", options: { A: "Đấu tranh giữa các mặt đối lập là tạm thời.", B: "Đấu tranh giữa các mặt đối lập là tuyệt đối.", C: "Đấu tranh giữa các mặt đối lập là tương đối.", D: "Đấu tranh giữa các mặt đối lập vừa tuyệt đối vừa tương đối." }, correctAnswer: "B", explanation: "Giống với câu 131, sự đấu tranh luôn là tuyệt đối trong mọi hoàn cảnh.", points: 10 },
    { id: 2335, question: "Câu 135. Trong phép biện chứng, khái niệm nào được dùng để chỉ sự tác động qua lại theo hướng bài trừ, phủ định lẫn nhau giữa các mặt đối lập?", options: { A: "Thống nhất giữa các mặt đối lập.", B: "Đấu tranh giữa các mặt đối lập.", C: "Chuyển hóa giữa các mặt đối lập.", D: "Mâu thuẫn giữa các mặt đối lập." }, correctAnswer: "B", explanation: "Sự bài trừ, gạt bỏ nhau là biểu hiện của 'Sự đấu tranh'.", points: 10 },
    { id: 2336, question: "Câu 136. Mâu thuẫn nào trong số các mâu thuẫn sau đây là mâu thuẫn cơ bản:", options: { A: "Mâu thuẫn quy định bản chất của sự vật, tồn tại từ đầu đến cuối trong suốt quá trình tổn tại, phát triển của sự vật và khi mâu thuẫn này được giải quyết thì làm thay đổi căn bản chất của sự vật.", B: "Mâu thuẫn chỉ đặc trưng cho một phương diện nào đó của sự vật.", C: "Mâu thuẫn nổi lên hàng đầu và chi phối các mâu thuẫn khác trong giai đoạn phát triển nhất định của sự vật.", D: "Mâu thuẫn phản ánh sự thay đổi tạm thời và không ảnh hưởng đến bản chất của sự vật." }, correctAnswer: "A", explanation: "Khái niệm mâu thuẫn cơ bản là sợi chỉ đỏ xuyên suốt vòng đời của một sự vật, quyết định bản chất tồn tại của nó.", points: 10 },
