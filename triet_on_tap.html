    { id: 2337, question: "Câu 137. Hãy chọn phán đoán đúng về mối quan hệ giữa sự thống nhất và đấu tranh của các mặt đối lập:", options: { A: "Không có sự thống nhất của các mặt đối lập vẫn có đấu tranh của các mặt đối lập.", B: "Không có sự đấu tranh của các mặt đối lập, vẫn có thống nhất của các mặt đối lập.", C: "Sự thống nhất và đấu tranh của các mặt đối lập là không thể tách rời nhau.", D: "Sự đấu tranh của các mặt đối lập vừa tương đối, vừa tuyệt đối." }, correctAnswer: "C", explanation: "Giống như hai mặt của một đồng xu, sự thống nhất và đấu tranh gắn chặt hữu cơ, không thể chia cắt.", points: 10 },
    { id: 2338, question: "Câu 138. Đâu là cách đúng đắn để giải quyết mâu thuẫn biện chứng?", options: { A: "Thủ tiêu các mặt đối lập.", B: "Kiềm chế các mặt đối lập không cho chúng bộc phát.", C: "Chuyển hóa các mặt đối lập.", D: "Giữ mặt đối lập này và gạt bỏ mặt đối lập khác." }, correctAnswer: "C", explanation: "Phương pháp biện chứng yêu cầu giải quyết mâu thuẫn thông qua sự đấu tranh để dẫn tới sự CHUYỂN HÓA lên một chất mới cao hơn.", points: 10 },
    { id: 2339, question: "Câu 139. Dựa trên quan điểm của triết học Mác - Lênin về phủ định biện chứng, luận điểm nào sau đây là SAI?", options: { A: "Phủ định biện chứng mang tính khách quan.", B: "Phủ định biện chứng mang tính kế thừa.", C: "Phủ định biện chứng là sự tự phủ định.", D: "Phủ định biện chứng là sự trải qua hai lần phủ định." }, correctAnswer: "D", explanation: "Trải qua 2 lần phủ định là đặc trưng của quy luật 'Phủ định của phủ định', chứ không phải khái niệm 'phủ định biện chứng' chung chung.", points: 10 },
    { id: 2340, question: "Câu 140. Phủ định biện chứng là:", options: { A: "Sự vật mới ra đời sau sự vật cũ.", B: "Sự phủ định có tác động của sự vật khác.", C: "Sự thay thế sự vật này bằng sự vật khác trong quá trình vận động và phát triển.", D: "Sự phủ định khách quan và mang tính kế thừa những yếu tố tích cực của sự vật cũ." }, correctAnswer: "D", explanation: "Hai đặc trưng cốt lõi của phủ định biện chứng là 'Tính khách quan' và 'Tính kế thừa'.", points: 10 },
    { id: 2341, question: "Câu 141. Theo quan điểm siêu hình thì sự phủ định là?", options: { A: "Sự thay thế sự vật này bằng sự vật khác trong quá trình vận động và phát triển.", B: "Xoá bỏ hoàn toàn cái cũ, chấm dứt sự phát triển.", C: "Là tiền đề, điều kiện cho sự phát triển liên tục, cho sự ra đời của cái mới thay thế.", D: "Là sự kế thừa cái cũ." }, correctAnswer: "B", explanation: "Siêu hình coi phủ định là sự tiêu diệt thuần túy, sạch trơn, như việc xay lúa thành bột chứ không phải gieo hạt lúa mọc thành cây.", points: 10 },
    { id: 2342, question: "Câu 142. Phủ định biện chứng diễn ra theo hình thức nào?", options: { A: "Đường thẳng đi lên.", B: "Đồ thị hình sin.", C: "Đường dích dắc.", D: "Đường xoáy ốc đi lên." }, correctAnswer: "D", explanation: "Sự phát triển biện chứng luôn đi theo đường xoáy trôn ốc: đi lên nhưng có sự lặp lại ở một cấp độ cao hơn.", points: 10 },
    { id: 2343, question: "Câu 143. Theo quy luật phủ định của phủ định, kết thúc một chu kỳ phát triển, sự vật:", options: { A: "Quay trở lại xuất phát điểm ban đầu.", B: "Kết thúc quá trình phát triển.", C: "Tiếp tục lặp lại một chu kỳ phát triển như trước.", D: "Mở ra một chu kỳ phát triển mới trên cơ sở cao hơn." }, correctAnswer: "D", explanation: "Mỗi chu kỳ đóng lại là mở ra một chu kỳ mới lớn hơn, vô cùng vô tận.", points: 10 },
    { id: 2344, question: "Câu 144. Đâu không phải là tính chất chung của phủ định biện chứng?", options: { A: "Phủ định biện chứng có tính khách quan.", B: "Phủ định biện chứng có tính phổ biến.", C: "Phủ định biện chứng có tính đa dạng, phong phú.", D: "Phủ định biện chứng có tính kế thừa siêu hình." }, correctAnswer: "D", explanation: "Biện chứng đòi hỏi kế thừa có chọn lọc, loại bỏ yếu tố tiêu cực. 'Kế thừa siêu hình' (giữ lại toàn bộ hoặc vứt bỏ toàn bộ) là quan điểm sai lầm.", points: 10 },
    { id: 2345, question: "Câu 145. Đâu không phải là tính chất của phủ định của phủ định biện chứng?", options: { A: "Tính toàn diện.", B: "Tính chu kỳ.", C: "Tính phát triển về chất.", D: "Tính kế thừa." }, correctAnswer: "A", explanation: "Các tính chất đặc trưng của quy luật này bao gồm tính chu kỳ, tính phát triển và tính kế thừa. Tính toàn diện thuộc về nguyên lý mối liên hệ.", points: 10 },
    { id: 2346, question: "Câu 146. Dựa trên quan điểm của triết học Mác - Lênin về phủ định của phủ định, luận điểm nào sau đây là ĐÚNG?", options: { A: "Phủ định của phủ định có tỉnh chất chu kỳ, đó là sự vật hoàn toàn quay trở lại điểm xuất phát ban đầu.", B: "Phủ định của phủ định có tính chất khép kín, đó là sự vật hoàn toàn quay trở lại điểm xuất phát ban đầu.", C: "Phủ định của phủ định có tính chất chu kỳ, đưa sự vật dường như quay trở lại trạng thái cũ, kết thúc một chu kỳ phát triển và mở ra một chu kỳ phát triển mới.", D: "Phủ định của phủ định có tính chất lặp lại, đưa sự vật quay trở lại trạng thái cũ, kết thúc một chu kỳ phát triển và lặp lại một chu kỳ phát triển như cũ." }, correctAnswer: "C", explanation: "Sự quay lại điểm xuất phát ban đầu chỉ là 'dường như' nhưng thực chất là đã ở trên một nền tảng cao hơn.", points: 10 },
    { id: 2347, question: "Câu 147. Dựa trên quan điểm của triết học Mác - Lênin về ý nghĩa phương pháp luận rút ra từ quy luật phủ định của phủ định, luận điểm nào sau đây là SAI?", options: { A: "Để cái mới ra đời thay thế cái cũ theo đúng quy luật của nó, chúng ta phải nhận dạng được cái mới, ủng hộ cái mới và quan trọng hơn là tạo điều kiện cho cái mới phát triển.", B: "Để cái mới ra đời thay thế cái cũ theo đúng quy luật của nó, chúng ta cần khắc phục tư tưởng giáo điều, bảo thủ, kìm hãm sự ra đời, phát triển của cái mới.", C: "Phủ định của phủ định có tính kế thừa, vì vậy, phải có quan điểm biện chứng trong quá trình kế thừa của sự phát triển.", D: "Phủ định của phủ định có tính kế thừa, vì vậy cần kế thừa hoàn toàn cái cũ để tạo ra phát triển của cái mới." }, correctAnswer: "D", explanation: "Kế thừa biện chứng phải là sự kế thừa có chọn lọc, lọc bỏ những yếu tố tàn dư tiêu cực và giữ lại những yếu tố tinh hoa, chứ không bao giờ kế thừa 'hoàn toàn' cái cũ.", points: 10 }
        ],
        "2.3. Lý luận nhận thức": [
            // Dán các câu hỏi phần 2.3 vào đây
            { id: 2301, question: "Câu 1. Trường phái triết học nào cho rằng nhận thức không phải là sự phản ánh thế giới khách quan bởi con người mà chỉ là sự phản ánh trạng thái chủ quan của con người?", options: { A: "Chủ nghĩa duy tâm chủ quan.", B: "Chủ nghĩa duy tâm khách quan.", C: "Chủ nghĩa duy vật biện chứng.", D: "Chủ nghĩa duy vật siêu hình." }, correctAnswer: "A", explanation: "Chủ nghĩa duy tâm chủ quan phủ nhận hiện thực khách quan, coi nhận thức chỉ là sự phản ánh hoặc phức hợp của các cảm giác, trạng thái chủ quan của con người.", points: 10 },
    { id: 2302, question: "Câu 2. Trường phái triết học nào cho rằng, nhận thức là tự nhận thức của “tinh thần thế giới” hay “ý niệm tuyết đối”?", options: { A: "Chủ nghĩa duy tâm chủ quan.", B: "Chủ nghĩa duy tâm khách quan.", C: "Chủ nghĩa duy vật biện chứng.", D: "Chủ nghĩa duy vật siêu hình." }, correctAnswer: "B", explanation: "Chủ nghĩa duy tâm khách quan (điển hình là Hêghen) cho rằng thế giới vật chất chỉ là sự tha hóa của 'ý niệm tuyệt đối', nên nhận thức thế giới thực chất là quá trình ý niệm tuyệt đối tự nhận thức chính bản thân nó.", points: 10 },
    { id: 2303, question: "Câu 3. Quan điểm cho rằng, nhận thức là sự phản ảnh hiện thực khách quan vào đầu óc con người một cách đơn giản, thụ động và nội dung của nó phụ thuộc vào đối tượng nhận thức là của trường phái triết học nào?", options: { A: "Chủ nghĩa duy vật chất phác.", B: "Chủ nghĩa duy tâm chủ quan.", C: "Chủ nghĩa duy tâm khách quan.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "A", explanation: "Chủ nghĩa duy vật trước Mác (chất phác, siêu hình) coi nhận thức giống như một tấm gương soi, phản ánh sự vật một cách thụ động, máy móc, giản đơn mà không thấy được vai trò năng động, sáng tạo của thực tiễn.", points: 10 },
    { id: 2304, question: "Câu 4. Theo quan điểm của triết học Mác - Lênin, bản chất của nhận thức là:", options: { A: "Tự nhận thức của con người.", B: "Sự tiến gần của tư duy đến khách thể.", C: "Quá trình phản ánh thế giới khách quan của mọi sinh vật sống.", D: "Sự phản ánh tích cực, tự giác và sáng tạo thế giới khách quan vào bộ óc con người trên cơ sở thực tiễn, nhằm tạo ra tri thức mới về hiện thực khách quan." }, correctAnswer: "D", explanation: "Theo triết học Mác - Lênin, nhận thức không phải là phản ánh thụ động mà là một quá trình phản ánh tích cực, tự giác và sáng tạo thế giới khách quan vào bộ óc con người, lấy thực tiễn làm cơ sở.", points: 10 },
    { id: 2305, question: "Câu 5. Theo quan điểm của triết học Mác - Lênin, chức năng quan trọng nhất của lý luận là:", options: { A: "Giáo dục.", B: "Nhận định, đánh giá.", C: "Định hướng.", D: "Thông tin." }, correctAnswer: "C", explanation: "Lý luận có chức năng định hướng, dẫn dắt hoạt động thực tiễn của con người. Không có lý luận soi đường, thực tiễn sẽ trở thành thực tiễn mù quáng.", points: 10 },
    { id: 2306, question: "Câu 6. Theo quan điểm của triết học Mác - Lênin, cơ sở và động lực của nhận thức là:", options: { A: "Hoạt động lý luận.", B: "Hoạt động thực tiễn.", C: "Hoạt động nghiên cứu khoa học.", D: "Hoạt động sáng tạo." }, correctAnswer: "B", explanation: "Thực tiễn cung cấp tư liệu, đề ra nhu cầu, nhiệm vụ và phương hướng phát triển cho nhận thức, do đó nó là cơ sở và động lực sâu xa của nhận thức.", points: 10 },
    { id: 2307, question: "Câu 7. Theo quan điểm của chủ nghĩa duy vật biện chứng, mục đích của nhận thức nhằm:", options: { A: "Thỏa mãn sự hiểu biết của con người.", B: "Phục vụ nhu cầu thực tiễn của con người.", C: "Phục vụ hoạt động lao động sản xuất.", D: "Giúp con người hiểu bản chất của mình." }, correctAnswer: "B", explanation: "Nhận thức không phải để nhận thức suông, mà suy cho cùng nhận thức là để phục vụ, cải tạo thế giới, đáp ứng các nhu cầu của hoạt động thực tiễn.", points: 10 },
    { id: 2308, question: "Câu 8. Giai đoạn nhận thức nào diễn ra trên cơ sở sự tác động trực tiếp của các sự vật lên các giác quan của con người?", options: { A: "Nhận thức lý tính.", B: "Nhận thức lý luận.", C: "Nhận thức cảm tính.", D: "Nhận thức khoa học." }, correctAnswer: "C", explanation: "Nhận thức cảm tính là giai đoạn mở đầu, khi sự vật tác động trực tiếp lên các giác quan của con người để tạo ra cảm giác, tri giác và biểu tượng.", points: 10 },
    { id: 2309, question: "Câu 9. Luận điểm, “cảm giác là hình ảnh chủ quan về thế giới khách quan\" thuộc lập trường triết học nào?", options: { A: "Chủ nghĩa duy tâm chủ quan.", B: "Chủ nghĩa duy tâm khách quan.", C: "Thuyết nhị nguyên.", D: "Chủ nghĩa duy vật biện chứng." }, correctAnswer: "D", explanation: "Theo chủ nghĩa duy vật biện chứng, cảm giác là sự phản ánh thế giới khách quan vào bộ óc con người, nên nó có nội dung khách quan (phản ánh thế giới vật chất) nhưng hình thức tồn tại lại là chủ quan (nằm trong đầu óc).", points: 10 },
    { id: 2310, question: "Câu 10. Luận điểm sau đây là của nhà triết học nào: “Từ trực quan sinh động đến tư duy trừu tượng và từ tư duy trừu tượng đến thực tiễn, đó là con đường biện chứng của sự nhận thức chân lý, nhận thức thực tại khách quan\"?", options: { A: "C. Mác.", B: "V.I. Lênin.", C: "Ph. Ăngghen.", D: "Hêghen." }, correctAnswer: "B", explanation: "Đây là câu nói kinh điển của V.I. Lênin khái quát quy luật và con đường biện chứng của quá trình nhận thức chân lý.", points: 10 },
    { id: 2311, question: "Câu 11. Luận điểm sau của V.I. Lênin được viết trong tác phẩm nào: “Từ trực quan sinh động đến tư duy trừu tượng và từ tư duy trừu tượng đến thực tiễn, đó là con đường biện chứng của sự nhận thức chân lý, nhận thức thực tại khách quan\"?", options: { A: "Luận cương về Phoiơbắc.", B: "Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán.", C: "Biện chứng của tự nhiên.", D: "Bút ký triết học." }, correctAnswer: "D", explanation: "Luận điểm nổi tiếng về con đường biện chứng của sự nhận thức được V.I. Lênin đúc kết và viết trong tác phẩm 'Bút ký triết học'.", points: 10 },
    { id: 2312, question: "Câu 12. Theo V.I Lênin, 2 giai đoạn cơ bản của quá trình nhận thức là:", options: { A: "Nhận thức thông thường và nhận thức khoa học.", B: "Nhận thức cơ bản và nhận thức nâng cao.", C: "Nhận thức cảm tính và nhận thức lý tính.", D: "Nhận thức kinh nghiệm và nhận thức lý luận." }, correctAnswer: "C", explanation: "Nhận thức được chia làm 2 giai đoạn cơ bản: Nhận thức cảm tính (trực quan sinh động) và Nhận thức lý tính (tư duy trừu tượng).", points: 10 },
    { id: 2313, question: "Câu 13. Trong các giai đoạn cơ bản của quá trình nhận thức, biểu tượng:", options: { A: "Là hình thức đầu tiên của nhận thức lý tính.", B: "Là hình thức nhận thức cao nhất và phức tạp nhất của nhận thức lý tính.", C: "Là hình ảnh của sự vật được tái hiện trong óc nhờ trí nhớ và là khâu trung gian chuyển từ nhận thức cảm tính lên nhận thức lý tính.", D: "Là tổng số nhận thức cảm giác và tri giác cộng lại." }, correctAnswer: "C", explanation: "Biểu tượng là hình ảnh được lưu giữ trong trí nhớ khi sự vật không còn tác động trực tiếp, nó là khâu cao nhất của nhận thức cảm tính, chuẩn bị bước nhảy vọt lên nhận thức lý tính.", points: 10 },
    { id: 2314, question: "Câu 14. Giai đoạn nhận thức nào phản ánh trừu tượng, khái quát những đặc điểm chung, bản chất của các sự vật, hiện tượng?", options: { A: "Nhận thức khoa học.", B: "Nhận thức kinh nghiệm.", C: "Nhận thức lý tính.", D: "Nhận thức cảm tính." }, correctAnswer: "C", explanation: "Nhận thức lý tính (bao gồm khái niệm, phán đoán, suy luận) có khả năng phản ánh cái chung, cái bản chất, quy luật của sự vật một cách gián tiếp và trừu tượng.", points: 10 },
    { id: 2315, question: "Câu 15. Theo quan điểm của triết học Mác - Lênin, tri giác được hình thành:", options: { A: "Trên cơ sở liên kết các biểu tượng về sự vật.", B: "Trên cơ sở liên kết, tổng hợp những cảm giác về sự vật.", C: "Từ những suy luận của chủ thể nhận thức với những tri thức đã được tích lũy.", D: "Từ sự tưởng tượng của chủ thể nhận thức." }, correctAnswer: "B", explanation: "Tri giác là sự tổng hợp của nhiều cảm giác khi sự vật đang trực tiếp tác động lên các giác quan, mang lại hình ảnh tương đối toàn vẹn về bề ngoài của sự vật.", points: 10 },
    { id: 2316, question: "Câu 16. Trong các giai đoạn cơ bản của quá trình nhận thức, cảm giác:", options: { A: "Là hình ảnh của sự vật được tái hiện trong óc nhờ trí nhớ và là khâu trung gian chuyển từ nhận thức cảm tính lên nhận thức lý tính.", B: "Là hình thức đầu tiên của nhận thức lý tính.", C: "Là hình thức nhận thức cao nhất và phức tạp nhất của nhận thức lý tính.", D: "Là hình thức đầu tiên của nhận thức cảm tính, nảy sinh do sự tác động trực tiếp của khách thể lên các giác quan của con người hình thành tri thức giản đơn nhất về một thuộc tính riêng lẻ của sự vật." }, correctAnswer: "D", explanation: "Cảm giác là hình thức thấp nhất và đầu tiên, chỉ phản ánh từng thuộc tính riêng lẻ của sự vật (màu sắc, âm thanh, mùi vị...) khi nó đang tác động trực tiếp vào giác quan.", points: 10 },
    { id: 2317, question: "Câu 17. Nhận thức cảm tính được thực hiện dưới những hình thức nào?", options: { A: "Cảm giác, tri giác và biểu tượng.", B: "Khái niệm, suy luận, biểu tượng.", C: "Khái niệm, phán đoán, suy luận.", D: "Tri giác, biểu tượng, khái niệm." }, correctAnswer: "A", explanation: "Nhận thức cảm tính gồm 3 hình thức từ thấp đến cao: Cảm giác -> Tri giác -> Biểu tượng.", points: 10 },
    { id: 2318, question: "Câu 18. Nhận thức lý tính được thực hiện dưới những hình thức nào?", options: { A: "Cảm giác, tri giác và biểu tượng.", B: "Khái niệm, suy luận, biểu tượng.", C: "Khái niệm, phán đoán, suy luận.", D: "Tri giác, biểu tượng, khái niệm." }, correctAnswer: "C", explanation: "Nhận thức lý tính gồm 3 hình thức từ thấp đến cao: Khái niệm -> Phán đoán -> Suy luận.", points: 10 },
    { id: 2319, question: "Câu 19. Hình thức thấp nhất của nhận thức cảm tính là:", options: { A: "Cảm giác.", B: "Suy luận.", C: "Biểu tượng.", D: "Khái niệm." }, correctAnswer: "A", explanation: "Cảm giác là nấc thang đầu tiên, thấp nhất của toàn bộ quá trình nhận thức.", points: 10 },
    { id: 2320, question: "Câu 20. Hình thức cao nhất của nhận thức cảm tính là:", options: { A: "Suy luận.", B: "Tri giác.", C: "Biểu tượng.", D: "Khái niệm." }, correctAnswer: "C", explanation: "Biểu tượng là hình thức cao nhất của nhận thức cảm tính, tái hiện lại hình ảnh sự vật trong óc khi không còn quan sát trực tiếp, tạo tiền đề bước sang khái niệm của nhận thức lý tính.", points: 10 },
    { id: 2321, question: "Câu 21. Hình thức thấp nhất của nhận thức lý tính là:", options: { A: "Phán đoán.", B: "Cảm giác.", C: "Khái niệm.", D: "Biểu tượng." }, correctAnswer: "C", explanation: "Khái niệm là hình thức cơ bản, đầu tiên và thấp nhất của giai đoạn nhận thức lý tính, phản ánh cái chung và bản chất của sự vật.", points: 10 },
    { id: 2322, question: "Câu 22. Hình thức cao nhất của nhận thức lý tính là:", options: { A: "Tri giác.", B: "Suy luận.", C: "Phán đoán.", D: "Biểu tượng." }, correctAnswer: "B", explanation: "Suy luận là sự liên kết các phán đoán để rút ra tri thức mới, là hình thức nhận thức cao nhất và phức tạp nhất của tư duy con người.", points: 10 },
    { id: 2323, question: "Câu 23. Theo quan điểm của triết học Mác - Lênin, khái niệm:", options: { A: "Là hình thức cơ bản của nhận thức lý tính, phản ánh những đặc tính bản chất của sự vật.", B: "Là cơ sở để hình thành nên những ý niệm trong quá trình con người tư duy về sự vật khách quan.", C: "Là những thuật ngữ của con người để mô tả sự vật hoặc để trao đổi thông tin.", D: "Là hình thức tiên thiên, vốn có trước khi con người xuất hiện." }, correctAnswer: "A", explanation: "Khái niệm phản ánh những thuộc tính chung, bản chất nhất của một lớp các sự vật, hiện tượng.", points: 10 },
    { id: 2324, question: "Câu 24. Theo quan điểm của triết học Mác - Lênin, chân lý:", options: { A: "Những ý kiến thuộc về số đông.", B: "Những kiến thức khoa học.", C: "Những lý luận phù hợp với ý chí, quyền lợi của con người.", D: "Những tri thức phù hợp với hiện thực khách quan và được kiểm nghiệm bằng thực tiễn." }, correctAnswer: "D", explanation: "Chân lý không phải là ý kiến của số đông hay ý muốn chủ quan, mà là những tri thức có nội dung phù hợp với hiện thực khách quan và đã được thực tiễn kiểm chứng.", points: 10 },
    { id: 2325, question: "Câu 25. Theo quan điểm của triết học Mác - Lênin, tính cụ thể của chân lý là:", options: { A: "Sự phản ánh đúng về sự vật, hiện tượng ở trong một điều kiện cụ thể, một không gian và thời gian xác định.", B: "Nội dung chân lý phù hợp với một mục đích nào đó của một cá nhân cụ thể.", C: "Nội dung chân lý phù hợp với một quan niệm nào đó của một cá nhân cụ thể.", D: "Sự phản ánh chân thực và đầy đủ về một đối tượng cụ thể." }, correctAnswer: "A", explanation: "Tính cụ thể của chân lý đòi hỏi tri thức phải gắn liền với điều kiện lịch sử cụ thể, không gian và thời gian xác định. V.I. Lênin từng nói 'Không có chân lý trừu tượng, chân lý luôn luôn là cụ thể'.", points: 10 },
    { id: 2326, question: "Câu 26. Chọn cụm từ thích hợp, điền vào chỗ trống để có định nghĩa đúng về phạm trù thực tiễn: “Thực tiễn là toàn bộ ... có mục đích mang tính lịch sử - xã hội của con người nhằm cải tạo tự nhiên và xã hội”.", options: { A: "Hoạt động vật chất.", B: "Hoạt động tinh thần.", C: "Hoạt động vật chất và tinh thần.", D: "Hoạt động sản xuất." }, correctAnswer: "A", explanation: "Thực tiễn luôn là những 'hoạt động vật chất - cảm tính' của con người tương tác với thế giới khách quan.", points: 10 },
    { id: 2327, question: "Câu 27. Dựa trên quan điểm của triết học Mác - Lênin về phạm trù thực tiễn, luận điểm nào sau đây là SAI?", options: { A: "Thực tiễn không phải là toàn bộ hoạt động của con người mà chỉ là những hoạt động vật chất - cảm tính.", B: "Thực tiễn là những hoạt động mang tính lịch sử - xã hội của con người.", C: "Thực tiễn là hoạt động có tính mục đích nhằm cải tạo tự nhiên và xã hội phục vụ con người.", D: "Thực tiễn là toàn bộ những hoạt động vật chất và tinh thần của con người." }, correctAnswer: "D", explanation: "Thực tiễn CHỈ bao gồm các hoạt động VẬT CHẤT, không bao gồm các hoạt động tinh thần (như suy nghĩ, tư duy, lý luận đơn thuần).", points: 10 },
    { id: 2328, question: "Câu 28. Hình thức hoạt động thực tiễn cơ bản, đầu tiên là:", options: { A: "Hoạt động thực nghiệm khoa học.", B: "Hoạt động nghiên cứu khoa học.", C: "Hoạt động sản xuất vật chất.", D: "Hoạt động chính trị - xã hội." }, correctAnswer: "C", explanation: "Sản xuất vật chất là hình thức thực tiễn cơ bản nhất, xuất hiện sớm nhất, quyết định sự tồn tại và phát triển của con người và xã hội loài người.", points: 10 },
    { id: 2329, question: "Câu 29. Điền từ thích hợp vào chỗ trống (...): “... là hoạt động thực tiễn thể hiện tính tự giác cao của con người nhằm biến đổi, cải tạo xã hội, phát triển các thiết chế xã hội, các quan hệ xã hội, v.v..\"?", options: { A: "Hoạt động thực nghiệm khoa học.", B: "Hoạt động nghiên cứu khoa học.", C: "Hoạt động sản xuất vật chất.", D: "Hoạt động chính trị - xã hội." }, correctAnswer: "D", explanation: "Hoạt động chính trị - xã hội (như cách mạng xã hội, đấu tranh giai cấp) là hoạt động nhằm biến đổi, cải tạo các quan hệ xã hội, các thiết chế xã hội.", points: 10 },
    { id: 2330, question: "Câu 30. Theo quan điểm của triết học Mác - Lênin, chân lý bao gồm các tính chất:", options: { A: "Tính khách quan, tính tuyệt đối, tính tương đối, tính cụ thể.", B: "Tính khách quan, tính phổ biến, tính phát triển.", C: "Tính đa dạng và phong phú.", D: "Tính khách quan, tính phổ biến và tính đa dạng." }, correctAnswer: "A", explanation: "Chân lý có 4 tính chất cơ bản: tính khách quan, tính tuyệt đối, tính tương đối và tính cụ thể.", points: 10 },
    { id: 2331, question: "Câu 31. Dựa trên quan điểm của triết học Mác - Lênin về phạm trù thực tiễn, luận điểm nào sau đây là ĐÚNG?", options: { A: "Thực tiễn là tiêu chuẩn của chân lý hoàn toàn có tính chất tuyệt đối.", B: "Thực tiễn là tiêu chuẩn của chân lý hoàn toàn có tính chất tương đối.", C: "Thực tiễn là tiêu chuẩn của chân lý vừa có tính chất tuyệt đối, vừa có tính chất tương đối.", D: "Thực tiễn không phải là tiêu chuẩn khách quan để kiểm tra chân lý." }, correctAnswer: "C", explanation: "Thực tiễn vừa có tính tuyệt đối (nó là tiêu chuẩn khách quan duy nhất để kiểm tra chân lý) vừa có tính tương đối (thực tiễn luôn vận động, phát triển nên không thể xác nhận hay bác bỏ vĩnh viễn mọi tri thức ở một thời điểm).", points: 10 },
    { id: 2332, question: "Câu 32. Điền từ thích hợp vào chỗ trống (...) trong luận điểm sau của V.I. Lênin: “Con người chứng minh bằng ... của mình sự đúng đắn khách quan của những ý niệm, khái niệm, tri thức của mình, của khoa học của mình\"?", options: { A: "Thực tiễn.", B: "Hành động.", C: "Lịch sử.", D: "Nhận thức." }, correctAnswer: "A", explanation: "Thực tiễn là thước đo duy nhất để chứng minh sự đúng đắn khách quan của nhận thức, lý luận. Lý luận phải được mang ra kiểm nghiệm trong đời sống thực tiễn.", points: 10 },
    { id: 2333, question: "Câu 33. Theo quan điểm của triết học Mác - Lênin, thực tiễn:", options: { A: "Là hoạt động vật chất và hoạt động tinh thần của con người.", B: "Là hoạt động vật chất có mục đích mang tính lịch sử - xã hội của con người nhằm cải tạo tự nhiên và xã hội.", C: "Là hoạt động tinh thần của con người.", D: "Là hoạt động vật chất, hoạt động tinh thần, hoạt động giải trí của con người." }, correctAnswer: "B", explanation: "Đây là định nghĩa đầy đủ và chuẩn xác nhất về thực tiễn trong triết học Mác - Lênin, nhấn mạnh tính vật chất, tính mục đích và tính lịch sử - xã hội.", points: 10 },
    { id: 2334, question: "Câu 34. Theo quan điểm của triết học Mác - Lênin, thực tiễn đóng vai trò:", options: { A: "Là điểm khởi đầu của nhận thức.", B: "Là đích đến của nhận thức.", C: "Là cơ sở, động lực, mục đích của nhận thức và là tiêu chuẩn của chân lý.", D: "Tồn tại song hành, hỗ trợ quá trình nhận thức." }, correctAnswer: "C", explanation: "Thực tiễn đóng vai trò toàn diện đối với nhận thức: sinh ra nhận thức (cơ sở, động lực), là cái đích nhận thức hướng tới (mục đích), và là thước đo kiểm tra nhận thức (tiêu chuẩn chân lý).", points: 10 },
    { id: 2335, question: "Câu 35. Theo quan điểm của triết học Mác - Lênin, có bao nhiêu hoạt động thực tiễn cơ bản?", options: { A: "1 hoạt động.", B: "2 hoạt động.", C: "3 hoạt động.", D: "4 hoạt động." }, correctAnswer: "C", explanation: "Thực tiễn có 3 hình thức cơ bản: sản xuất vật chất, chính trị - xã hội, và thực nghiệm khoa học.", points: 10 },
    { id: 2336, question: "Câu 36. Theo quan điểm của triết học Mác - Lênin, các hoạt động thực tiễn cơ bản là:", options: { A: "Hoạt động sản xuất vật chất; hoạt động chính trị - xã hội; hoạt động nhận thức lý luận.", B: "Hoạt động sản xuất vật chất; hoạt động tư tưởng; hoạt động khoa học kỹ thuật.", C: "Hoạt động sản xuất vật chất; hoạt động chính trị - xã hội; hoạt động thực nghiệm khoa học.", D: "Hoạt động thực nghiệm khoa học; hoạt động văn hóa nghệ thuật; hoạt động giáo dục." }, correctAnswer: "C", explanation: "Ba hình thức cơ bản của thực tiễn là: sản xuất vật chất (quan trọng nhất), hoạt động chính trị - xã hội và thực nghiệm khoa học.", points: 10 },
    { id: 2337, question: "Câu 37. Theo quan điểm của triết học Mác - Lênin, hoạt động thực tiễn nào là cơ bản và đầu tiên, giúp con người hoàn thiện cả bản tính sinh học và xã hội?", options: { A: "Hoạt động thực nghiệm khoa học.", B: "Hoạt động chính trị - xã hội.", C: "Hoạt động sản xuất vật chất.", D: "Hoạt động nhận thức lý luận." }, correctAnswer: "C", explanation: "Hoạt động sản xuất vật chất là hoạt động xuất hiện sớm nhất, quyết định sự sinh tồn của loài người và quá trình tiến hóa tách con người khỏi giới động vật.", points: 10 },
    { id: 2338, question: "Câu 38. Theo quan điểm của triết học Mác - Lênin, hoạt động thực tiễn nào có mục đích biến đổi các quan hệ xã hội, trong đó đỉnh cao nhất là biến đổi các hình thái kinh tế - xã hội?", options: { A: "Hoạt động chính trị - xã hội.", B: "Hoạt động thực nghiệm khoa học.", C: "Hoạt động nhận thức lý luận.", D: "Hoạt động sản xuất vật chất." }, correctAnswer: "A", explanation: "Đỉnh cao của hoạt động chính trị - xã hội chính là các cuộc đấu tranh giai cấp, cách mạng xã hội để lật đổ hình thái kinh tế - xã hội cũ, thiết lập hình thái mới.", points: 10 },
    { id: 2339, question: "Câu 39. Theo quan điểm của triết học Mác - Lênin, hoạt động thực tiễn nào là quá trình mô phỏng hiện thực khách quan trong phòng thí nghiệm để hình thành chân lý?", options: { A: "Hoạt động chính trị - xã hội.", B: "Hoạt động thực nghiệm khoa học.", C: "Hoạt động nhận thức lý luận.", D: "Hoạt động sản xuất vật chất." }, correctAnswer: "B", explanation: "Thực nghiệm khoa học là quá trình con người chủ động tạo ra các điều kiện nhân tạo (thường trong phòng thí nghiệm) để nghiên cứu, quan sát hiện tượng tự nhiên và xác minh chân lý.", points: 10 },
    { id: 2340, question: "Câu 40. Theo quan điểm của triết học Mác - Lênin, hoạt động thực tiễn nào đóng vai trò quan trọng nhất?", options: { A: "Hoạt động sản xuất vật chất.", B: "Hoạt động chính trị - xã hội.", C: "Hoạt động nhận thức lý luận.", D: "Hoạt động thực nghiệm khoa học." }, correctAnswer: "A", explanation: "Sản xuất vật chất là nền tảng, gốc rễ quyết định sự tồn tại của con người, quyết định các hình thức thực tiễn khác và quyết định toàn bộ đời sống xã hội.", points: 10 },
    { id: 2341, question: "Câu 41. Nhận thức kinh nghiệm có đặc trưng nào sau đây? Chọn đáp án ĐÚNG.", options: { A: "Là tri thức hình thành một cách chủ động của chủ thể nhận thức phản ánh tính quy luật của đối tượng nhận thức.", B: "Là tri thức chỉ ra được tính tất yếu, bản chất của các sự vật, hiện tượng.", C: "Là tri thức dựa trên sự quan sát trực tiếp các sự vật, hiện tượng hay các thí nghiệm khoa học.", D: "Là tri thức mang tính tự phát trong các hoạt động hàng ngày của con người." }, correctAnswer: "C", explanation: "Nhận thức kinh nghiệm được hình thành từ việc quan sát, trải nghiệm trực tiếp thông qua hoạt động sống hàng ngày, lao động sản xuất hoặc thực nghiệm khoa học.", points: 10 },
    { id: 2342, question: "Câu 42. Điền từ thích hợp vào chỗ trống (...) trong luận điểm sau của V.I. Lênin: “Thừa nhận ... khách quan, tức là ... không phụ thuộc vào con người và loài người”?", options: { A: "Nhận thức.", B: "Thực tiễn.", C: "Thực tại.", D: "Chân lý." }, correctAnswer: "D", explanation: "Chân lý khách quan là những tri thức mà nội dung của nó phù hợp với khách thể, hoàn toàn khách quan và không phụ thuộc vào ý muốn chủ quan của con người hay nhân loại.", points: 10 },
    { id: 2343, question: "Câu 43. Theo quan điểm của triết học Mác - Lênin, một trong những vai trò cơ bản của thực tiễn đối với nhận thức là?", options: { A: "Thực tiễn làm nảy sinh nhu cầu giao tiếp.", B: "Thực tiễn giúp con người phát triển các giác quan của mình hơn.", C: "Thực tiễn là mục đích của nhận thức.", D: "Thực tiễn thể hiện khả năng chinh phục tự nhiên của con người." }, correctAnswer: "C", explanation: "Nhận thức thế giới không phải để thỏa mãn sự tò mò trừu tượng, mà mục đích cuối cùng của lý luận, nhận thức là để quay lại phục vụ, soi đường cho hoạt động thực tiễn cải tạo thế giới.", points: 10 },
    { id: 2344, question: "Câu 44. Theo quan điểm của triết học Mác - Lênin, nhận thức là một quá trình:", options: { A: "Phản ánh trực tiếp thế giới khách quan vào trong đầu óc con người.", B: "Biện chứng của sự vận động tư duy thông qua các quy luật của chính nó.", C: "Phản ánh sáng tạo hiện thực khách quan vào bộ óc người từ đó hình thành tri thức về thế giới khách quan.", D: "Phân tích và tổng hợp các thông tin từ thế giới khách quan." }, correctAnswer: "C", explanation: "Nhận thức không phải là sự chép lại thụ động, bê nguyên xi hiện thực vào đầu óc, mà là một quá trình phản ánh mang tính năng động, sáng tạo dựa trên cơ sở thực tiễn.", points: 10 },
    { id: 2345, question: "Câu 45. Chọn đáp án SAI. Bệnh giáo điều là khuynh hướng tư tưởng và hành động thể hiện:", options: { A: "Xa rời cuộc sống thực tiễn, rơi vào bệnh sách vở.", B: "Áp dụng rập khuôn kiến thức, kinh nghiệm mà không tính đến những điều kiện thực tiễn - lịch sử cụ thể.", C: "Chú trọng công tác tổng kết thực tiễn.", D: "Tách rời lý luận khỏi thực tiễn." }, correctAnswer: "C", explanation: "Bệnh giáo điều là việc áp dụng lý luận, kinh nghiệm một cách rập khuôn, máy móc mà xa rời thực tiễn. Do đó, 'chú trọng tổng kết thực tiễn' là sai với bản chất của bệnh giáo điều (người mắc bệnh giáo điều thường lười hoặc không biết tổng kết thực tiễn).", points: 10 },
    { id: 2346, question: "Câu 46. Hoạt động lai tạo giống, cấy ghép gen thuộc hình thức hoạt động thực tiễn nào sau đây?", options: { A: "Hoạt động chính trị - xã hội.", B: "Hoạt động nghiên cứu tự nhiên.", C: "Hoạt động sản xuất vật chất.", D: "Hoạt động thực nghiệm khoa học." }, correctAnswer: "D", explanation: "Lai tạo giống, cấy ghép gen là những hoạt động tạo ra điều kiện nhân tạo để nghiên cứu, thao tác trên đối tượng nhằm xác minh quy luật sinh học, thuộc về hình thức thực nghiệm khoa học.", points: 10 },
    { id: 2347, question: "Câu 47. Hoạt động thực nghiệm khoa học có mối quan hệ thế nào với hoạt động sản xuất vật chất?", options: { A: "Độc lập.", B: "Không có mối quan hệ.", C: "Tác động.", D: "Quyết định." }, correctAnswer: "C", explanation: "Thực nghiệm khoa học và sản xuất vật chất có mối quan hệ biện chứng, tác động qua lại lẫn nhau (thực nghiệm tạo ra kỹ thuật mới giúp tăng năng suất sản xuất, sản xuất lại cung cấp thiết bị và đặt ra yêu cầu cho thực nghiệm).", points: 10 },

    { id: 3214, question: "Câu 14. Theo quan điểm triết học Mác - Lênin, nguyên nhân khách quan của đấu tranh giai cấp là:", options: { A: "Do một lý thuyết khoa học về giai cấp thúc đẩy quần chúng nhân dân nổi dậy.", B: "Do sự lôi kéo của một thủ lĩnh có uy tín trong nhân dân phát động và lãnh đạo.", C: "Do sự nghèo khổ của quần chúng nhân dân.", D: "Do mâu thuẫn giữa trình độ phát triển của lực lượng sản xuất xã hội với quan hệ sản xuất đã trở nên lỗi thời." }, correctAnswer: "D", explanation: "Đấu tranh giai cấp có nguồn gốc kinh tế. Mâu thuẫn giữa LLSX phát triển và QHSX cũ đã lỗi thời buộc xã hội phải thay đổi thông qua đấu tranh.", points: 10 },
    { id: 3215, question: "Câu 15. Theo quan điểm triết học Mác - Lênin, nguyên nhân sâu xa của sự xuất hiện giai cấp là:", options: { A: "Sự phát triển của lực lượng sản xuất trong lòng xã hội nguyên thủy.", B: "Sự tan rã dần dần của chế độ cộng sản nguyên thủy.", C: "Sự phát triển của chế độ chiếm hữu nô lệ.", D: "Ham muốn quyền lực của con người." }, correctAnswer: "A", explanation: "Sự phát triển của LLSX dẫn đến năng suất lao động tăng, tạo ra của cải dư thừa, từ đó mới có khả năng xuất hiện sự chiếm đoạt của riêng.", points: 10 },
    { id: 3216, question: "Câu 16. Theo quan điểm triết học Mác - Lênin, nguyên nhân trực tiếp của sự xuất hiện giai cấp là:", options: { A: "Sự xuất hiện của phân công lao động xã hội.", B: "Sự xuất hiện của chế độ tư hữu về tư liệu sản xuất.", C: "Ham muốn quyền lực của con người.", D: "Sự tan rã của chế độ nguyên thủy." }, correctAnswer: "B", explanation: "Chế độ tư hữu là nguyên nhân trực tiếp khiến xã hội chia thành người có của và người không có của.", points: 10 },
    { id: 3217, question: "Câu 17. Dựa trên quan điểm của triết học Mác - Lênin về đấu tranh giai cấp, luận điểm nào sau đây là SAI?", options: { A: "Trong thời kì quá độ đi lên chủ nghĩa xã hội ở Việt Nam vẫn tồn tại giai cấp và đấu tranh giai cấp.", B: "Trong thời kì quá độ đi lên chủ nghĩa xã hội ở Việt Nam do không còn đối kháng giai cấp nên không còn đấu tranh giai cấp.", C: "Trong thời kì quá độ đi chủ nghĩa xã hội ở Việt Nam, cuộc đấu tranh giai cấp diễn ra trên nhiều lĩnh vực với nội dung và hình thức khác nhau.", D: "Đấu tranh trên lĩnh vực kinh tế là một biểu hiện của cuộc đấu tranh giai cấp trong thời kì quá độ đi lên chủ nghĩa xã hội ở Việt Nam." }, correctAnswer: "B", explanation: "Trong thời kỳ quá độ, giai cấp vẫn còn tồn tại và đấu tranh vẫn tiếp diễn (dù không còn đối kháng như trong xã hội tư bản cũ) nên không thể nói không còn đấu tranh giai cấp.", points: 10 },
    { id: 3218, question: "Câu 18. Dựa trên quan điểm của triết học Mác - Lênin về vai trò của đấu tranh giai cấp, luận điểm nào sau đây là ĐÚNG?", options: { A: "Đấu tranh giai cấp là động lực cơ bản và duy nhất đối với sự phát triển của mọi xã hội.", B: "Mọi cuộc đấu tranh giai cấp đều trực tiếp phải giải quyết vấn đề quyền lực nhà nước.", C: "Đấu tranh giai cấp là một trong những động lực cơ bản thúc đẩy sự phát triển, tiến bộ của xã hội có giai cấp.", D: "Trong điều kiện giai cấp công nhân nắm chính quyền nhà nước, đấu tranh giai cấp không còn là động lực cho sự phát triển xã hội." }, correctAnswer: "C", explanation: "Đấu tranh giai cấp là động lực quan trọng của xã hội CÓ GIAI CẤP, chứ không phải động lực duy nhất của mọi xã hội (vì xã hội nguyên thủy không có giai cấp vẫn phát triển).", points: 10 },
    { id: 3219, question: "Câu 19. Dựa trên quan điểm của triết học Mác - Lênin về giai cấp, luận điểm nào sau đây là SAI?", options: { A: "Giai cấp tồn tại trong mọi xã hội.", B: "Giai cấp là một phạm trù lịch sử.", C: "Giai cấp là những tập đoàn người mà tập đoàn này có thể chiếm đoạt lao động của tập đoàn khác.", D: "Sự ra đời của giai cấp không phụ thuộc vào ý muốn chủ quan của con người." }, correctAnswer: "A", explanation: "Giai cấp không tồn tại trong mọi xã hội. Trong xã hội Cộng sản nguyên thủy và xã hội Cộng sản chủ nghĩa tương lai, giai cấp không tồn tại.", points: 10 },
    { id: 3220, question: "Câu 20. Điền từ thích hợp vào chỗ trống (...) trong luận điểm sau của V.I. Lênin: “Giai cấp là những tập đoàn người có ... khác nhau trong một hệ thống sản xuất xã hội nhất định trong lịch sử”?", options: { A: "Quyền lực chính trị.", B: "Địa vị xã hội.", C: "Địa vị kinh tế - xã hội.", D: "Đẳng cấp." }, correctAnswer: "C", explanation: "Đây là vế chính trong định nghĩa giai cấp của Lênin, xác định vị trí trong hệ thống sản xuất là căn cứ xác định giai cấp.", points: 10 },
    { id: 3221, question: "Câu 21. Dựa trên quan điểm của triết học Mác - Lênin về đấu tranh giai cấp, luận điểm nào sau đây là ĐÚNG?", options: { A: "Đấu tranh giai cấp là quy luật cốt yếu của xã hội có giai cấp.", B: "Đấu tranh giai cấp là hệ quả của cách mạng công nghiệp.", C: "Đấu tranh giai cấp là động lực phát triển của xã hội có giai cấp đối kháng.", D: "Đấu tranh giai cấp là động lực phát triển của mọi xã hội." }, correctAnswer: "A", explanation: "Đấu tranh giai cấp là quy luật tất yếu khách quan trong xã hội có giai cấp đối kháng.", points: 10 },
    { id: 3222, question: "Câu 22. Sự khác nhau về địa vị kinh tế - xã hội của các giai cấp trong một hệ thống sản xuất xã hội nhất định có nguyên nhân là:", options: { A: "Sự khác nhau về quan hệ của họ trong lực lượng sản xuất.", B: "Sự khác nhau về quan hệ của họ trong quan hệ sản xuất.", C: "Sự khác nhau về quan hệ của họ trong thể chế chính trị.", D: "Sự khác nhau về năng lực của họ trong hoạt động sản xuất vật chất." }, correctAnswer: "B", explanation: "Địa vị kinh tế-xã hội của giai cấp được xác định bởi quan hệ của họ đối với tư liệu sản xuất (tức Quan hệ sản xuất).", points: 10 },
    { id: 3223, question: "Câu 23. Theo quan điểm của triết học Mác - Lênin, giai cấp có bao nhiêu đặc trưng cơ bản?", options: { A: "2 đặc trưng.", B: "4 đặc trưng.", C: "1 đặc trưng.", D: "5 đặc trưng." }, correctAnswer: "A", explanation: "Xét theo định nghĩa của Lênin, giai cấp có đặc trưng cơ bản nhất là sự chiếm đoạt lao động và địa vị khác nhau trong hệ thống sản xuất xã hội.", points: 10 },
    { id: 3224, question: "Câu 24. Ai là người phát hiện ra xu hướng khách quan trong sự phát triển của dân tộc?", options: { A: "C. Mác.", B: "Hồ Chí Minh.", C: "Ph. Ăngghen.", D: "V.I. Lênin." }, correctAnswer: "D", explanation: "V.I. Lênin là người đã nghiên cứu sâu sắc và phát hiện ra hai xu hướng khách quan trong sự phát triển dân tộc: xu hướng cộng đồng và xu hướng tách rời dân tộc.", points: 10 },
    { id: 3225, question: "Câu 25. C. Mác và Ph. Ăngghen đã dựa vào những phát kiến nào để xây dựng luận chứng về sứ mệnh lịch sử của giai cấp công nhân?", options: { A: "Chủ nghĩa xã hội không tưởng - phê phán.", B: "Chủ nghĩa duy vật lịch sử và Học thuyết giá trị thặng dư.", C: "Triết học cổ điển Đức và Kinh tế chính trị học cổ điển Anh.", D: "Tất cả các đáp án trên đều đúng." }, correctAnswer: "B", explanation: "Hai phát kiến vĩ đại của Mác-Ăngghen là CNDV lịch sử và học thuyết giá trị thặng dư đã chứng minh một cách khoa học rằng giai cấp công nhân là lực lượng sẽ lật đổ chủ nghĩa tư bản.", points: 10 },
    { id: 3226, question: "Câu 26. Đặc trưng quan trọng nhất của giai cấp là:", options: { A: "Sự khác nhau về vai trò trong tổ chức, quản lý quá trình sản xuất.", B: "Sự khác nhau về sở hữu tư liệu sản xuất.", C: "Sự khác nhau về quan hệ phân phối của cải xã hội.", D: "Sự khác nhau về vị thế xã hội." }, correctAnswer: "B", explanation: "Sở hữu tư liệu sản xuất quyết định quyền lực kinh tế và địa vị giai cấp.", points: 10 },
    { id: 3227, question: "Câu 27. Theo sự phát triển của xã hội, thứ tự sự phát triển của các hình thức cộng đồng trong lịch sử là:", options: { A: "Bộ lạc - Bộ tộc - Thị tộc - Dân tộc.", B: "Bộ tộc - Thị tộc - Bộ lạc - Dân tộc.", C: "Thị tộc - Bộ lạc - Bộ tộc - Dân tộc.", D: "Bộ tộc - Bộ lạc - Thị tộc - Dân tộc." }, correctAnswer: "C", explanation: "Sự tiến hóa của cộng đồng người: Thị tộc (nhỏ nhất) -> Bộ lạc -> Bộ tộc -> Dân tộc (đã có nhà nước).", points: 10 }
        ],
        "3.3. Nhà nước và cách mạng xã hội": [
            // Dán các câu hỏi phần 3.3 vào đây
            { id: 3301, question: "Câu 1. Theo quan điểm của chủ nghĩa duy vật lịch sử, sự ra đời của nhà nước là do:", options: { A: "Nguyện vọng của giai cấp thống trị.", B: "Nguyện vọng của mỗi quốc gia, dân tộc.", C: "Tất yếu, khách quan, do nguyên nhân kinh tế.", D: "Do sự phát triển của xã hội." }, correctAnswer: "C", explanation: "Sự ra đời của nhà nước là kết quả tất yếu của quá trình phân hóa xã hội thành giai cấp, mà nguyên nhân sâu xa là do sự phát triển của sản xuất làm nảy sinh chế độ tư hữu.", points: 10 },
    { id: 3302, question: "Câu 2. Theo quan điểm của chủ nghĩa duy vật lịch sử, sự ra đời và tồn tại của nhà nước:", options: { A: "Là hiện tượng mang tính khách quan, bị quyết định bởi quá trình phát triển của xã hội.", B: "Là hiện tượng mang tính chủ quan, phụ thuộc vào nguyện vọng của giai cấp cầm quyền.", C: "Là hiện tượng mang tính chủ quan, phụ thuộc vào nguyện vọng của mỗi quốc gia, mỗi dân tộc.", D: "Là hiện tượng mang tính chủ quan, phản ánh mâu thuẫn giữa các giai cấp trong xã hội." }, correctAnswer: "A", explanation: "Nhà nước là một hiện tượng lịch sử khách quan, nó sinh ra và mất đi theo quy luật phát triển của phương thức sản xuất.", points: 10 },
    { id: 3303, question: "Câu 3. Theo quan điểm của chủ nghĩa duy vật lịch sử, nguyên nhân trực tiếp làm xuất hiện nhà nước là:", options: { A: "Sự thỏa thuận của mọi tầng lớp trong xã hội.", B: "Những mâu thuẫn giai cấp không thể điều hòa được.", C: "Tham vọng quyền lực của các chính trị gia.", D: "Lý tưởng cao đẹp của những người ưu tú trong xã hội." }, correctAnswer: "B", explanation: "Khi mâu thuẫn giai cấp trở nên gay gắt không thể điều hòa bằng các biện pháp thông thường, nhà nước xuất hiện như một cơ quan quyền lực để duy trì trật tự.", points: 10 },
    { id: 3304, question: "Câu 4. Theo quan điểm của chủ nghĩa duy vật lịch sử, nguyên nhân sâu xa làm xuất hiện nhà nước là:", options: { A: "Sự thỏa thuận của mọi tầng lớp trong xã hội.", B: "Mong ước của nhân dân vì một xã hội tốt đẹp.", C: "Sự ra đời của chế độ tư hữu.", D: "Đấu tranh giai cấp." }, correctAnswer: "C", explanation: "Chế độ tư hữu là gốc rễ, nó làm nảy sinh sự bất bình đẳng kinh tế, từ đó phân chia giai cấp và dẫn đến sự ra đời nhà nước.", points: 10 },
    { id: 3305, question: "Câu 5. Theo quan điểm của chủ nghĩa duy vật lịch sử, nhà nước xuất hiện và tồn tại:", options: { A: "Ngay khi xã hội loài người xuất hiện.", B: "Trong một giai đoạn lịch sử nhất định.", C: "Từ trước khi xã hội có giai cấp.", D: "Trong mọi giai đoạn lịch sử." }, correctAnswer: "B", explanation: "Nhà nước là phạm trù lịch sử: nó có sinh ra (khi có giai cấp) và có mất đi (khi giai cấp tự tiêu vong).", points: 10 },
    { id: 3306, question: "Câu 6. Theo quan điểm của chủ nghĩa duy vật lịch sử, giai cấp thống trị về kinh tế trong xã hội trở thành giai cấp thống trị về chính trị là nhờ:", options: { A: "Hệ thống luật pháp.", B: "Hệ thống thuế khóa.", C: "Bộ máy nhà nước.", D: "Sức mạnh quân sự." }, correctAnswer: "C", explanation: "Bộ máy nhà nước là công cụ sắc bén nhất để hợp thức hóa sự thống trị kinh tế thành quyền lực chính trị.", points: 10 },
    { id: 3307, question: "Câu 7. Theo quan điểm của chủ nghĩa duy vật lịch sử, trong xã hội có giai cấp đối kháng, nhà nước là:", options: { A: "Bộ máy công quyền phục vụ lợi ích chung của xã hội.", B: "Công cụ quyền lực bảo vệ lợi ích của giai cấp thống trị.", C: "Trọng tài phân xử các mâu thuẫn của các giai cấp trong xã hội.", D: "Kẻ thù của mọi giai tầng bị thống trị trong xã hội." }, correctAnswer: "B", explanation: "Trong xã hội đối kháng, nhà nước luôn mang tính giai cấp rõ rệt, nó được lập ra để bảo vệ đặc quyền của giai cấp cầm quyền.", points: 10 },
    { id: 3308, question: "Câu 8. Theo quan điểm của triết học Mác - Lênin, bản chất của nhà nước là:", options: { A: "Công cụ quyền lực quản lý xã hội vì mục đích chung.", B: "Công cụ quyền lực thực hiện chuyên chính giai cấp của giai cấp thống trị.", C: "Công cụ quyền lực thực hiện chuyên chính giai cấp.", D: "Công cụ quyền lực của giai cấp thống trị." }, correctAnswer: "B", explanation: "Bản chất cốt lõi của nhà nước là chuyên chính giai cấp (sự thống trị của giai cấp này đối với giai cấp khác).", points: 10 },
    { id: 3309, question: "Câu 9. Trong các hình thức giai cấp dưới đây, hình thức nào thuộc về kiểu nhà nước phong kiến?", options: { A: "Quân chủ lập hiến, cộng hòa đại nghị.", B: "Quân chủ tập quyền, quân chủ phân quyền.", C: "Chính thể phân quyền, chính thể cộng hòa.", D: "Quân chủ chuyên chế, cộng hòa hỗn hợp." }, correctAnswer: "B", explanation: "Chế độ quân chủ (tập quyền hoặc phân quyền) là đặc trưng phổ biến của nhà nước phong kiến.", points: 10 },
    { id: 3310, question: "Câu 10. Theo quan điểm của triết học Mác - Lênin, nhà nước có mấy đặc trưng cơ bản?", options: { A: "2 đặc trưng.", B: "3 đặc trưng.", C: "4 đặc trưng.", D: "5 đặc trưng." }, correctAnswer: "B", explanation: "Nhà nước có 3 đặc trưng cơ bản: (1) Quản lý dân cư theo lãnh thổ; (2) Thiết lập quyền lực công cộng; (3) Ban hành thuế.", points: 10 },
    { id: 3311, question: "Câu 11. Theo quan điểm của chủ nghĩa duy vật lịch sử, chức năng giai cấp của nhà nước là:", options: { A: "Củng cố mở rộng cơ sở chính trị xã hội cho sự thống trị của giai cấp cầm quyền.", B: "Tổ chức kiến tạo kết cấu giai cấp của xã hội.", C: "Thực hiện chuyên chính, trấn áp các giai cấp đối lập.", D: "Thúc đẩy sự hình thành và phát triển của các giai cấp mới." }, correctAnswer: "C", explanation: "Chức năng giai cấp (hay chức năng trấn áp) là chức năng thực thi bạo lực, trấn áp các giai cấp bị trị để bảo vệ sự thống trị của giai cấp cầm quyền.", points: 10 },
    { id: 3312, question: "Câu 12. Chức năng nào sau đây thể hiện rõ bản chất nhà nước?", options: { A: "Chức năng đối ngoại.", B: "Chức năng đối nội.", C: "Chức năng xã hội.", D: "Chức năng thống trị chính trị của giai cấp." }, correctAnswer: "D", explanation: "Thống trị chính trị là bản chất cốt lõi nhất, chi phối mọi hoạt động đối nội và đối ngoại của nhà nước.", points: 10 },
    { id: 3313, question: "Câu 13. Trong 3 chức năng cơ bản của nhà nước, chức năng nào là cơ bản nhất?", options: { A: "Chức năng thống trị chính trị của giai cấp.", B: "Chức năng xã hội.", C: "Chức năng đối nội.", D: "Chức năng đối ngoại." }, correctAnswer: "A", explanation: "Không có sự thống trị chính trị, nhà nước sẽ không còn là bộ máy quyền lực của giai cấp thống trị nữa.", points: 10 },
    { id: 3314, question: "Câu 14. Theo quan điểm của triết học Mác - Lênin, lịch sử phát triển của xã hội loài người đã tồn tại mấy kiểu nhà nước?", options: { A: "3 kiểu nhà nước.", B: "4 kiểu nhà nước.", C: "5 kiểu nhà nước.", D: "6 kiểu nhà nước." }, correctAnswer: "B", explanation: "4 kiểu nhà nước tương ứng với 4 hình thái kinh tế - xã hội có giai cấp: Chủ nô, Phong kiến, Tư sản, và Vô sản.", points: 10 },
    { id: 3315, question: "Câu 15. Theo quan điểm của triết học Mác - Lênin, lịch sử phát triển của xã hội loài người đang và sẽ tồn tại các kiểu nhà nước nào?", options: { A: "Nhà nước chiếm hữu nô lệ; nhà nước phong kiến; nhà nước tư bản chủ nghĩa.", B: "Nhà nước chiếm hữu nô lệ; nhà nước cộng sản nguyên thuỷ; nhà nước phong kiến.", C: "Nhà nước chiếm hữu nô lệ; nhà nước cộng sản nguyên thuỷ; nhà nước phong kiến; nhà nước tư bản chủ nghĩa.", D: "Nhà nước chiếm hữu nô lệ; nhà nước cộng sản nguyên thuỷ; nhà nước phong kiến; nhà nước tư bản chủ nghĩa; nhà nước cộng sản chủ nghĩa." }, correctAnswer: "A", explanation: "Chỉ có 4 kiểu nhà nước đối kháng (Nô lệ, Phong kiến, Tư bản, Vô sản). Nhà nước Cộng sản chủ nghĩa là khái niệm chưa chính xác vì trong tương lai nhà nước sẽ tự tiêu vong.", points: 10 },
    { id: 3316, question: "Câu 16. Theo quan điểm của chủ nghĩa duy vật lịch sử, căn cứ để phân loại kiểu nhà nước là:", options: { A: "Chức năng của nhà nước.", B: "Bản chất của giai cấp nhà nước.", C: "Nguồn gốc của nhà nước.", D: "Cách thức tổ chức quyền lực nhà nước." }, correctAnswer: "B", explanation: "Giai cấp nào nắm quyền lực kinh tế thì nhà nước mang bản chất của giai cấp đó, đó là căn cứ để phân loại.", points: 10 },
    { id: 3317, question: "Câu 17. Vì sao nói nhà nước vô sản là nhà nước “nửa nhà nước”?", options: { A: "Vì nó không có chức năng trấn áp.", B: "Vì nó không phải là công cụ bóc lột.", C: "Vì nó không có chức năng xây dựng.", D: "Vì nó không có thiên vị giai cấp." }, correctAnswer: "B", explanation: "Vì nó đại diện cho lợi ích của đông đảo quần chúng nhân dân lao động, không còn thực hiện chức năng bóc lột như các nhà nước của giai cấp bóc lột cũ.", points: 10 },
    { id: 3318, question: "Câu 18. Mục tiêu của chuyên chính vô sản là:", options: { A: "Vĩnh cửu hóa quyền thống trị của giai cấp vô sản.", B: "Xóa bỏ giai cấp tư sản.", C: "Xóa bỏ mọi giai cấp.", D: "Xóa bỏ sở hữu tư nhân." }, correctAnswer: "C", explanation: "Mục tiêu cuối cùng của chuyên chính vô sản là xây dựng xã hội cộng sản, nơi mà sự phát triển tự do của mỗi người là điều kiện cho sự phát triển của tất cả mọi người, tức là xóa bỏ hoàn toàn giai cấp.", points: 10 },
    { id: 3319, question: "Câu 19. Nhà nước trong thời kì quá độ đi lên chủ nghĩa xã hội là:", options: { A: "Nhà nước dân chủ cộng hòa.", B: "Nhà nước dân chủ tư sản.", C: "Nhà nước chuyên chính vô sản.", D: "Nhà nước dân chủ nhân dân." }, correctAnswer: "C", explanation: "Trong thời kỳ quá độ, nhà nước vẫn thực hiện chuyên chính vô sản để bảo vệ thành quả cách mạng.", points: 10 },
    { id: 3320, question: "Câu 20. Xu hướng phát triển của nhà nước trong chủ nghĩa cộng sản là:", options: { A: "Củng cố vững chắc quyền lực giai cấp.", B: "Chuyển hóa thành nhà nước cộng sản.", C: "Chuyển hóa thành nhà nước toàn cầu.", D: "Nhà nước tự tiêu vong." }, correctAnswer: "D", explanation: "Khi xã hội không còn giai cấp, không còn đối kháng, bộ máy cưỡng bức (nhà nước) mất đi cơ sở tồn tại và sẽ tự tiêu vong.", points: 10 },
    { id: 3321, question: "Câu 21. Hiện nay, Đảng Cộng sản Việt Nam chủ trương xây dựng:", options: { A: "Nhà nước dân chủ đại nghị.", B: "Nhà nước xã hội chủ nghĩa.", C: "Nhà nước pháp quyền xã hội chủ nghĩa.", D: "Nhà nước pháp quyền dân chủ nhân dân." }, correctAnswer: "C", explanation: "Chủ trương xây dựng Nhà nước pháp quyền XHCN của dân, do dân, vì dân dưới sự lãnh đạo của Đảng.", points: 10 },
    { id: 3322, question: "Câu 22. Theo quan điểm của triết học Mác - Lênin, cách mạng xã hội theo nghĩa rộng là:", options: { A: "Sự biến đổi về kinh tế.", B: "Sự biến đổi căn bản về chính trị.", C: "Sự biến đổi về văn hóa.", D: "Sự chuyển biến từ hình thái kinh tế - xã hội lỗi thời lên một hình thái kinh tế - xã hội mới có trình độ phát triển cao hơn." }, correctAnswer: "D", explanation: "Cách mạng xã hội nghĩa rộng là sự thay đổi cả một hình thái kinh tế - xã hội, thay đổi từ nền tảng kinh tế đến kiến trúc thượng tầng.", points: 10 },
    { id: 3323, question: "Câu 23. Theo quan điểm của triết học Mác - Lênin, nguyên nhân sâu xa nhất của cách mạng xã hội là:", options: { A: "Nguyên nhân chính trị.", B: "Nguyên nhân kinh tế.", C: "Nguyên nhân tư tưởng.", D: "Nguyên nhân văn hoá." }, correctAnswer: "B", explanation: "Nguyên nhân kinh tế (mâu thuẫn giữa LLSX và QHSX) luôn là cái gốc quyết định sự bùng nổ cách mạng.", points: 10 },
    { id: 3324, question: "Câu 24. Theo quan điểm của triết học Mác - Lênin, nguyên nhân trực tiếp dẫn đến cách mạng xã hội là:", options: { A: "Nguyên nhân kinh tế.", B: "Nguyên nhân chính trị.", C: "Nguyên nhân văn hoá.", D: "Nguyên nhân tư tưởng." }, correctAnswer: "B", explanation: "Khi các mâu thuẫn kinh tế dồn nén, chúng bộc phát thành cuộc đấu tranh giành chính quyền, tức nguyên nhân chính trị trực tiếp.", points: 10 },
    { id: 3325, question: "Câu 25. Theo quan điểm của triết học Mác - Lênin, điều kiện khách quan của cách mạng xã hội là:", options: { A: "Phương pháp cách mạng.", B: "Tình thế cách mạng.", C: "Thời cơ cách mạng.", D: "Tình thế và thời cơ cách mạng." }, correctAnswer: "D", explanation: "Tình thế (do điều kiện khách quan tạo ra) và thời cơ (thời điểm thuận lợi) là hai yếu tố khách quan cần thiết để cách mạng thắng lợi.", points: 10 },
    { id: 3326, question: "Câu 26. Việc lật đổ một chế độ chính tri đã lỗi thời và thiết lập một chế độ chính trị tiến bộ hơn của giai cấp cách mạng được gọi là:", options: { A: "Đảo chính.", B: "Cách mạng xã hội.", C: "Cải cách.", D: "Tiến bộ xã hội." }, correctAnswer: "B", explanation: "Cách mạng xã hội là sự thay đổi quyền lực chính trị mang tính chất bước ngoặt.", points: 10 },
    { id: 3327, question: "Câu 27. Đặc trưng chủ yếu của cách mạng xã hội là:", options: { A: "Sự thay đổi về cơ cấu, tổ chức hoạt động sản xuất ra của cải vật chất trong xã hội.", B: "Sự thay đổi về hệ tư tưởng nói riêng và toàn bộ đời sống tinh thần của xã hội nói chung.", C: "Sự thay đổi chính quyền nhà nước từ tay giai cấp cách mạng sang tay giai cấp thống trị.", D: "Sự thay đổi chính quyền nhà nước từ tay giai cấp thống trị đã lỗi thời sang tay giai cấp cách mạng." }, correctAnswer: "D", explanation: "Vấn đề cơ bản của mọi cuộc cách mạng là vấn đề chính quyền. Đặc trưng chủ yếu là chuyển giao chính quyền từ tay giai cấp cũ sang giai cấp mới.", points: 10 },
    { id: 3328, question: "Câu 28. Trong những yếu tố dưới đây, yếu tố nào không phải là tình thế cách mạng?", options: { A: "Giai cấp thống trị khủng hoảng về chính trị.", B: "Giai cấp cách mạng có một thủ lĩnh dũng cảm.", C: "Nỗi cùng khổ của giai cấp bị trị nặng nề hơn những giai đoạn khác.", D: "Tính tích cực cách mạng của quần chúng được nâng cao." }, correctAnswer: "B", explanation: "Thủ lĩnh là yếu tố chủ quan. Tình thế cách mạng bao gồm: giai cấp thống trị không thể cai trị như cũ, giai cấp bị trị không muốn sống như cũ, và quần chúng tích cực hành động.", points: 10 }

    { id: 3409, question: "Câu 9. Theo quan điểm của chủ nghĩa duy vật lịch sử, mối quan hệ giữa tồn tại xã hội và ý thức xã hội thực chất là biểu hiện của mối quan hệ giữa:", options: { A: "Kinh tế và chính trị.", B: "Vật chất và tinh thần.", C: "Thực tiễn và lý luận.", D: "Kinh tế và văn hóa." }, correctAnswer: "B", explanation: "Về mặt triết học, mối quan hệ giữa Tồn tại xã hội và Ý thức xã hội chính là sự áp dụng quy luật cơ bản của triết học (vật chất quyết định ý thức) vào đời sống xã hội.", points: 10 },
    { id: 3410, question: "Câu 10. Yếu tố nào sau đây là yếu tố cơ bản nhất của tồn tại xã hội?", options: { A: "Điều kiện tự nhiên.", B: "Dân số.", C: "Phương thức sản xuất vật chất.", D: "Năng suất lao động." }, correctAnswer: "C", explanation: "Phương thức sản xuất vật chất là nền tảng, yếu tố cơ bản nhất quyết định sự tồn tại và phát triển của xã hội loài người.", points: 10 },
    { id: 3411, question: "Câu 11. Dựa trên quan điểm của chủ nghĩa duy vật lịch sử về ý thức xã hội, luận điểm nào sau đây là SAI?", options: { A: "Ý thức xã hội là sự phản ánh tồn tại xã hội.", B: "Ý thức xã hội có tính độc lập tương đối trong quan hệ với tồn tại xã hội.", C: "Ý thức xã hội là đời sống chính trị của xã hội.", D: "Ý thức xã hội không đồng nhất với ý thức cá nhân." }, correctAnswer: "C", explanation: "Ý thức xã hội rộng hơn nhiều so với đời sống chính trị. Nó bao gồm cả đạo đức, tôn giáo, khoa học, thẩm mỹ... nên đồng nhất ý thức xã hội với đời sống chính trị là sai.", points: 10 },
    { id: 3412, question: "Câu 12. Theo quan điểm của chủ nghĩa duy vật lịch sử, ý thức xã hội gồm:", options: { A: "Ý thức chính trị; ý thức pháp quyền; ý thức đạo đức; ý thức văn hóa; ý thức tôn giáo; ý thức khoa học; ý thức triết học.", B: "Ý thức chính trị; ý thức pháp quyền; ý thức đạo đức; ý thức thẩm mỹ; ý thức tôn giáo; ý thức khoa học; ý thức triết học.", C: "Ý thức chính trị; ý thức pháp quyền; ý thức đạo đức; ý thức dân tộc; ý thức tôn giáo; ý thức khoa học; ý thức triết học.", D: "Ý thức chính trị; ý thức pháp quyền; ý thức văn hóa; ý thức môi trường; ý thức tôn giáo; ý thức khoa học; ý thức triết học." }, correctAnswer: "B", explanation: "Các hình thái ý thức xã hội cơ bản bao gồm: Chính trị, pháp quyền, đạo đức, thẩm mỹ, tôn giáo, khoa học, triết học.", points: 10 },
    { id: 3413, question: "Câu 13. Dựa trên quan điểm của chủ nghĩa duy vật lịch sử về ý thức thông thường, luận điểm nào sau đây là SAI?", options: { A: "Ý thức thông thường phản ánh sinh động và trực tiếp các mặt khác nhau của cuộc sống thường ngày.", B: "Ý thức thông thường là cơ sở và tiền đề cho sự hình thành ý thức lý luận.", C: "Ý thức thông thường không phản ánh tồn tại xã hội.", D: "Ý thức thông thường ở trình độ thấp hơn nhưng phong phú hơn ý thức lý luận." }, correctAnswer: "C", explanation: "Ý thức thông thường (như kinh nghiệm sống, thói quen) vẫn là sự phản ánh tồn tại xã hội, chỉ là nó phản ánh mang tính kinh nghiệm, chưa được hệ thống hóa.", points: 10 },
    { id: 3414, question: "Câu 14. Dựa trên quan điểm của chủ nghĩa duy vật lịch sử về tâm lý xã hội, luận điểm nào sau đây là ĐÚNG?", options: { A: "Tâm lý xã hội cho biết những mối liên hệ khách quan, bản chất, tất yếu, mang tính quy luật của các sự vật và quá trình xã hội.", B: "Tâm lý xã hội phản ánh một cách trực tiếp và tự phát những điều kiện sinh hoạt hàng ngày của con người.", C: "Tâm lý xã hội phản ánh một cách trực tiếp và tự giác những điều kiện sinh hoạt hàng ngày của con người.", D: "Tâm lý xã hội không bao gồm tư tưởng của xã hội hình thành dưới tác động trực tiếp của cuộc sống thường ngày." }, correctAnswer: "B", explanation: "Tâm lý xã hội là các thói quen, cảm xúc, tâm trạng... phản ánh trực tiếp và tự phát điều kiện sống, thường thiếu tính hệ thống và tính lý luận.", points: 10 },
    { id: 3415, question: "Câu 15. Dựa trên quan điểm của chủ nghĩa duy vật lịch sử về ý thức giai cấp, luận điểm nào sau đây là SAI?", options: { A: "Giai cấp bị trị chịu ảnh hưởng tư tưởng của giai cấp thống trị.", B: "Giai cấp thống trị không chịu ảnh hưởng tư tưởng của giai cấp bị trị.", C: "Giai cấp bị trị có thể có hệ tư tưởng riêng của mình.", D: "Giai cấp thống trị luôn tìm cách đặt hệ tư tưởng của mình cho các giai cấp khác." }, correctAnswer: "B", explanation: "Trong thực tế, tư tưởng của giai cấp thống trị và bị trị luôn có sự thâm nhập, tác động qua lại lẫn nhau, chứ không phải giai cấp thống trị hoàn toàn biệt lập với tư tưởng của giai cấp bị trị.", points: 10 },
    { id: 3416, question: "Câu 16. Theo quan điểm của chủ nghĩa duy vật lịch sử, khi tồn tại xã hội thay đổi thì:", options: { A: "Ý thức tôn giáo sẽ không thay đổi.", B: "Ý thức triết học sẽ thay đổi triệt để.", C: "Ý thức xã hội sớm hay muộn cũng sẽ có những thay đổi nhất định.", D: "Ý thức xã hội sẽ thay đổi một cách hệ thống và đồng bộ." }, correctAnswer: "C", explanation: "Vì tính độc lập tương đối, ý thức xã hội thay đổi chậm hơn tồn tại xã hội (lạc hậu hơn), nhưng sớm hay muộn nó vẫn sẽ thay đổi để phản ánh lại tồn tại xã hội mới.", points: 10 },
    { id: 3417, question: "Câu 17. Ở các nước Tây Âu, thời đại nào ý thức tôn giáo đã từng thống trị, kìm hãm sự phát triển của khoa học và xã hội?", options: { A: "Thời cổ đại.", B: "Thời trung cổ.", C: "Thời phục hưng.", D: "Thời khai sáng." }, correctAnswer: "B", explanation: "Thời Trung cổ ở Tây Âu, tôn giáo thống trị hoàn toàn, các hệ tư tưởng khác (khoa học, triết học) đều phải lệ thuộc vào thần học.", points: 10 },
    { id: 3418, question: "Câu 18. Dựa trên quan điểm của chủ nghĩa duy vật lịch sử về ý thức xã hội, luận điểm nào sau đây là SAI?", options: { A: "Ý thức xã hội luôn lạc hậu hơn tồn tại xã hội.", B: "Ý thức xã hội có thể vượt trước tồn tại xã hội.", C: "Ý thức xã hội có thể tác động trở lại tồn tại xã hội.", D: "Ý thức xã hội có tính độc lập tương đối với tồn tại xã hội." }, correctAnswer: "A", explanation: "Nói 'luôn' lạc hậu là sai. Mặc dù xu hướng chung là lạc hậu, nhưng trong một số trường hợp, các tư tưởng khoa học, tiên tiến có thể vượt trước sự phát triển của thực tiễn.", points: 10 },
    { id: 3419, question: "Câu 19. Trong các hình thái ý thức xã hội dưới đây, hình thái ý thức xã hội nào ra đời ngay trong xã hội cộng sản nguyên thủy?", options: { A: "Ý thức triết học.", B: "Ý thức thẩm mỹ.", C: "Ý thức chính trị.", D: "Ý thức giai cấp." }, correctAnswer: "B", explanation: "Ý thức thẩm mỹ (tranh vẽ hang động, đồ trang sức) đã nảy sinh từ rất sớm trong xã hội nguyên thủy khi con người bắt đầu cảm nhận về cái đẹp.", points: 10 },
    { id: 3420, question: "Câu 20. Trong các hình thái ý thức xã hội dưới đây, hình thái ý thức xã hội nào sau đây ra đời từ khi xã hội chưa phân chia giai cấp?", options: { A: "Ý thức triết học.", B: "Ý thức tôn giáo.", C: "Ý thức chính trị.", D: "Ý thức pháp quyền." }, correctAnswer: "B", explanation: "Tôn giáo (dưới dạng sơ khai là tín ngưỡng vạn vật hữu linh) ra đời từ xã hội nguyên thủy, trước khi xuất hiện giai cấp và nhà nước.", points: 10 }
        ],
        "3.5. Triết học về con người": [
            // Dán các câu hỏi phần 3.5 vào đây
            { id: 3501, question: "Câu 1. Nhà triết nào cho rằng: “Bản tính con người là tình yêu”?", options: { A: "Cantơ (Kant).", B: "Phoiơbắc (Feuerbach).", C: "Hêghen (Hegel).", D: "Lênin (Lenin)." }, correctAnswer: "B", explanation: "L. Phoi-ơ-bắc là nhà duy vật nhân bản, ông cho rằng bản chất con người là tình yêu thương đồng loại.", points: 10 },
    { id: 3502, question: "Câu 2. C. Mác viết: “Các học thuyết duy vật chủ nghĩa cho rằng con người là sản phẩm của những hoàn cảnh giáo dục. Các học thuyết ấy quên rằng chính những con người làm thay đổi hoàn cảnh và bản thân nhà giáo dục cũng cần phải được giáo dục”. Câu nói này nằm trong tác phẩm nào sau đây:", options: { A: "Luận cương về Phoiơbắc.", B: "Hệ tư tưởng Đức.", C: "Bản thảo kinh tế - triết học năm 1844.", D: "Góp phần phê phán triết học pháp quyền của Hêghen." }, correctAnswer: "A", explanation: "Đây là Luận điểm số 3 trong 'Luận cương về Phoi-ơ-bắc' (1845), đánh dấu bước ngoặt tư tưởng của Mác về bản chất con người.", points: 10 },
    { id: 3503, question: "Câu 3. C. Mác đã định nghĩa bản chất con người như thế nào?", options: { A: "Trong tính hiện thực, bản chất con người là tổng hoà các mối quan hệ giống loài.", B: "Trong tính hiện thực của nó, bản chất con người là tổng hoà tất cả các mối quan hệ gia đình, nhà nước và pháp luật.", C: "Bản chất con người không phải là cái trừu tượng cố hữu của cá nhân riêng biệt; trong tính hiện thực của nó, bản chất con người là tổng hoà các quan hệ xã hội.", D: "Con người là động vật xã hội có tính chất đặc biệt." }, correctAnswer: "C", explanation: "Đây là luận điểm nổi tiếng trong 'Luận cương về Phoi-ơ-bắc', bác bỏ quan điểm cho rằng bản chất con người là cái gì đó bẩm sinh, trừu tượng.", points: 10 },
    { id: 3504, question: "Câu 4. “Trong tính hiện thực của nó, bản chất con người là … các …” (C. Mác). Các từ còn thiếu trong câu trên là:", options: { A: "tổng thể, hoạt động xã hội.", B: "tổng hòa, quan hệ xã hội.", C: "toàn bộ, yếu tố tự nhiên.", D: "sự phản ánh, điều kiện sinh học." }, correctAnswer: "B", explanation: "C. Mác dùng từ 'tổng hòa các quan hệ xã hội' để chỉ ra rằng con người là một thực thể xã hội, không thể hiểu con người tách rời các mối quan hệ xã hội.", points: 10 },
    { id: 3505, question: "Câu 5. Theo quan điểm của triết học Mác - Lênin, bản chất của con người được quyết định bởi:", options: { A: "Nỗ lực của mỗi cá nhân.", B: "Nền giáo dục của gia đình và nhà trường.", C: "Hoàn cảnh xã hội.", D: "Các quan hệ xã hội" }, correctAnswer: "D", explanation: "Vì bản chất con người là tổng hòa các quan hệ xã hội, nên sự thay đổi các mối quan hệ xã hội (như giai cấp, nghề nghiệp, gia đình...) sẽ quyết định sự thay đổi bản chất của chính con người đó.", points: 10 },
    { id: 3506, question: "Câu 6. Theo quan điểm của triết học Mác - Lênin, con người là thể thống nhất của các mặt cơ bản nào?", options: { A: "Sinh học - xã hội.", B: "Tâm lý - xã hội.", C: "Xã hội - tinh thần.", D: "Nhân cách - xã hội." }, correctAnswer: "A", explanation: "Con người không chỉ là thực thể xã hội mà còn là một thực thể sinh học (cần ăn, uống, sinh sản...). Đó là một thể thống nhất hữu cơ.", points: 10 },
    { id: 3507, question: "Câu 7. Cống hiến quan trọng nhất của triết học Mác - Lênin về bản chất con người là:", options: { A: "Vạch ra bản chất con người là chủ thể sáng tạo lịch sử.", B: "Vạch ra vai trò của quan hệ xã hội trong việc hình thành bản chất con người.", C: "Vạch ra hai mặt cơ bản tạo thành bản chất con người là cái sinh vật và cái xã hội.", D: "Vạch ra bản chất con người vừa là sản phẩm của hoàn cảnh, vừa là chủ thể của hoàn cảnh." }, correctAnswer: "B", explanation: "Việc xác định bản chất con người mang tính xã hội thông qua các quan hệ xã hội là đóng góp cách mạng nhất của Mác, thay thế cho quan điểm trừu tượng của CNDV cũ.", points: 10 },
    { id: 3508, question: "Câu 8. Điền từ thích hợp vào chỗ trống (...) trong luận điểm sau của C. Mác: “Con người vừa là … của lịch sử, vừa là … của lịch sử”?", options: { A: "khách thể; động lực.", B: "sản phẩm; người sáng tạo.", C: "chủ thể; sản phẩm.", D: "mục đích; động lực." }, correctAnswer: "B", explanation: "Con người là sản phẩm của hoàn cảnh lịch sử cũ, nhưng đồng thời thông qua lao động và đấu tranh, họ lại trở thành chủ thể sáng tạo ra hoàn cảnh mới của lịch sử.", points: 10 },
    { id: 3509, question: "Câu 9. Chọn luận điểm đúng nhất trong các luận điểm dưới đây:", options: { A: "Cho dù các quan hệ xã hội thay đổi thì bản chất của con người vẫn không bao giờ thay đổi.", B: "Các quan hệ xã hội thay đổi thì ít hoặc nhiều, sớm hoặc muộn, bản chất con người cũng sẽ thay đổi theo.", C: "Các quan hệ xã hội thay đổi trước, bản chất con người thay đổi sau.", D: "Các quan hệ xã hội tồn tại độc lập với bản chất của con người." }, correctAnswer: "B", explanation: "Bản chất con người là tổng hòa quan hệ xã hội, do đó khi xã hội thay đổi (kinh tế, chính trị, văn hóa thay đổi) thì bản chất con người cũng biến đổi theo.", points: 10 },
    { id: 3510, question: "Câu 10. Theo quan điểm của triết học Mác - Lênin, thực chất của lao động bị tha hóa là:", options: { A: "Lao động tạo ra của cải vật chất cho đời sống xã hội.", B: "Quá trình lao động và sản phẩm của lao động từ chỗ để phục vụ con người, để phát triển con người đã bị biến thành lực lượng đối lập, nô dịch và thống trị con người.", C: "Lao động mang lại giá trị và sự tự do cho con người.", D: "Lao động là vinh quang." }, correctAnswer: "B", explanation: "Trong xã hội tư bản, lao động của người công nhân tạo ra của cải nhưng của cải đó lại quay lại làm giàu cho nhà tư bản và quay lại nô dịch chính người công nhân đó, đó gọi là tha hóa.", points: 10 },
    { id: 3511, question: "Câu 11. Điền từ thích hợp vào chỗ trống (...) trong luận điểm sau của C. Mác và Ph. Ăngghen: “Sự phát triển … của mỗi người là điều kiện cho sự phát triển … của tất cả mọi người”.", options: { A: "Trí truệ.", B: "Tự do.", C: "Năng lực.", D: "Bản chất." }, correctAnswer: "B", explanation: "Tuyên ngôn Đảng Cộng sản khẳng định: Sự phát triển tự do của mỗi người là điều kiện cho sự phát triển tự do của tất cả mọi người.", points: 10 },
    { id: 3512, question: "Câu 12. Nền tảng của mối quan hệ giữa cá nhân và xã hội là:", options: { A: "Quan hệ luật pháp.", B: "Quan hệ đạo đức.", C: "Quan hệ sở hữu.", D: "Quan hệ lợi ích." }, correctAnswer: "D", explanation: "Lợi ích (kinh tế) là động lực cơ bản nhất gắn kết cá nhân với xã hội. Sự hài hòa giữa lợi ích cá nhân và lợi ích tập thể là nền tảng của xã hội bền vững.", points: 10 },
    { id: 3513, question: "Câu 13. Dựa trên quan điểm của chủ nghĩa duy vật lịch sử khi diễn đạt về quan hệ giữa cá nhân và xã hội, luận điểm nào sau đây là SAI?", options: { A: "Cá nhân và xã hội không tách rời nhau.", B: "Xã hội do các cá nhân cụ thể hợp thành, mỗi cá nhân là một phần tử của xã hội sống và hoạt động trong xã hội đó.", C: "Quan hệ cá nhân - xã hội là tất yếu, là tiền đề và điều kiện tồn tại và phát triển của cả cá nhân lẫn xã hội.", D: "Quan hệ cá nhân - xã hội phụ thuộc hoàn toàn vào ý thức cá nhân." }, correctAnswer: "D", explanation: "Quan hệ cá nhân-xã hội mang tính khách quan, được quyết định bởi kinh tế, không phải phụ thuộc hoàn toàn vào ý thức chủ quan của cá nhân.", points: 10 },
    { id: 3514, question: "Câu 14. Dựa trên quan điểm của chủ nghĩa duy vật lịch sử về con người, luận điểm nào sau đây là SAI?", options: { A: "Con người là một sinh vật có tính xã hội ở trình độ phát triển cao nhất của giới tự nhiên và của lịch sử xã hội.", B: "Con người cũng như mọi động vật khác phải tìm kiếm thức ăn, nước uống, phải “đấu tranh sinh tồn” để ăn uống, sinh đẻ con cái, tồn tại và phát triển.", C: "Con người là một sáng tạo tuyệt đối của đấng sáng tạo tối cao trong vũ trụ, có quyền năng vô hạn.", D: "Con người là một bộ phận đặc biệt, quan trọng của giới tự nhiên, nhưng lại có thể biến đổi giới tự nhiên và chính bản thân mình, dựa trên các quy luật khách quan." }, correctAnswer: "C", explanation: "Đây là quan điểm duy tâm tôn giáo, trái ngược hoàn toàn với quan điểm duy vật lịch sử về nguồn gốc con người.", points: 10 },
    { id: 3515, question: "Câu 15. Tác phẩm nào của Ph. Ăngghen đã trình bày vai trò của lao động đối với việc hình thành và phát triển con người?", options: { A: "Gia đình thần thành.", B: "Tuyên ngôn của Đảng cộng sản.", C: "Biện chứng của tự nhiên.", D: "Hệ tư tưởng đức." }, correctAnswer: "C", explanation: "Trong tác phẩm 'Tác động của lao động trong việc chuyển biến từ vượn thành người' nằm trong 'Biện chứng của tự nhiên', Ăngghen đã giải thích rõ điều này.", points: 10 },
    { id: 3516, question: "Câu 16. Trong các nhà kinh điển của chủ nghĩa Mác - Lênin, ai là người bàn về vấn đề bản chất và sự tha hóa con người rõ nét nhất?", options: { A: "V.I. Lênin.", B: "Ph. Ăngghen.", C: "C. Mác.", D: "Phoiơbắc." }, correctAnswer: "C", explanation: "C.Mác đã dành nhiều công trình (nhất là Bản thảo kinh tế triết học 1844) để phân tích sâu sắc về sự tha hóa của lao động và bản chất con người.", points: 10 },
    { id: 3517, question: "Câu 17. Dựa trên quan điểm của triết học Mác - Lênin về giải phóng con người, luận điểm nào sau đây là SAI?", options: { A: "Việc giải phóng những con người cụ thể là để đi đến giải phóng giai cấp, giải phóng dân tộc và tiến tới giải phóng toàn thể nhân loại.", B: "Việc giải phóng con người được quan niệm một cách toàn diện, đầy đủ, ở tất cả các nội dung và phương diện của con người, cộng đồng, xã hội và nhân loại.", C: "Giải phóng con người là sự giải thoát khỏi cuộc sống tạm, khỏi bể khổ cuộc đời để lên cõi niết bàn hoặc lên thiên đường ở kiếp sau.", D: "Giải phóng con người là “giải phóng người lao động thoát khỏi lao động bị tha hóa”." }, correctAnswer: "C", explanation: "Đây là quan điểm tôn giáo, CNDV lịch sử không coi sự giải phóng con người ở kiếp sau mà là sự giải phóng ngay trong thực tiễn xã hội này.", points: 10 },
    { id: 3518, question: "Câu 18. Trong mối quan hệ thống nhất biện chứng giữa quần chúng nhân dân và lãnh tụ, chủ nghĩa Mác - Lênin khẳng định:", options: { A: "Vai trò quyết định của quần chúng nhân dân đồng thời đánh giá cao vai trò của lãnh tụ.", B: "Vai trò quyết định của lãnh tụ đồng thời đánh giá cao vai trò của quần chúng nhân dân.", C: "Vai trò độc lập lẫn nhau giữa quần chúng nhân dân và lãnh tụ.", D: "Vai trò tương đương nhau giữa quần chúng nhân dân và lãnh tụ." }, correctAnswer: "A", explanation: "Quần chúng nhân dân là chủ thể sáng tạo chân chính của lịch sử, nhưng lãnh tụ đóng vai trò định hướng và thúc đẩy phong trào nhanh hơn, mạnh hơn.", points: 10 },
    { id: 3519, question: "Câu 19. Hạt nhân cơ bản của quần chúng nhân dân là:", options: { A: "Các giai cấp, tầng lớp thúc đẩy sự tiến bộ xã hội.", B: "Những người lao động sản xuất ra của cải vật chất.", C: "Những người chống lại giai cấp thống trị phản động.", D: "Những người nghèo khổ." }, correctAnswer: "B", explanation: "Lao động sản xuất của cải vật chất là lực lượng đông đảo nhất, cơ bản nhất làm nên lịch sử.", points: 10 },
    { id: 3520, question: "Câu 20. Theo quan điểm của triết học Mác - Lênin, ai là chủ thể của lịch sử và là lực lượng sáng tạo ra lịch sử?", options: { A: "Nhà nước và các thiết chế chính trị.", B: "Các vĩ nhân, lãnh tụ, cá nhân kiệt xuất.", C: "Quần chúng nhân dân.", D: "Giai cấp cầm quyền trong xã hội." }, correctAnswer: "C", explanation: "Quần chúng nhân dân là lực lượng đông đảo, bền bỉ, trực tiếp sáng tạo ra của cải và văn hóa, từ đó quyết định sự vận động của lịch sử.", points: 10 },
    { 
        id: 3521, 
        question: "Câu 21. Theo quan điểm của triết học Mác - Lênin, điều kiện tiên quyết, cần thiết và chủ yếu quyết định sự hình thành và phát triển của con người cả về phương diện sinh học lẫn phương diện xã hội là gì?", 
        options: { A: "Lao động.", B: "Tư duy.", C: "Ngôn ngữ.", D: "Não bộ." }, 
        correctAnswer: "A", 
        explanation: "Lao động là quá trình con người tác động vào tự nhiên, tạo ra công cụ và của cải. Quá trình này không chỉ làm biến đổi giới tự nhiên mà còn làm biến đổi chính cơ thể con người (sinh học) và các mối quan hệ giữa người với người (xã hội).", 
        points: 10 
    },
    { 
        id: 3522,

        options: { A: "Thiện.", B: "Ác.", C: "Không thiện, không ác (mang bản chất tự nhiên).", D: "Tổng hòa các quan hệ xã hội." }, 
        correctAnswer: "D", 
        explanation: "Mác khẳng định: 'Trong tính hiện thực của nó, bản chất con người là tổng hòa các quan hệ xã hội'. Điều này có nghĩa là con người không có bản chất bẩm sinh, mà bản chất được định hình qua môi trường và mối quan hệ với xã hội.", 
        points: 10 
    },
    { 
        id: 3523, 
        question: "Câu 23. Theo quan điểm của triết học Mác - Lênin, thực chất của hiện tượng tha hóa con người là gì?", 
        options: { A: "Là lao động của con người bị tha hóa.", B: "Là chức năng của con người bị tha hóa.", C: "Là sự tha hóa của nền chính trị.", D: "Là sự tha hóa về tư tưởng." }, 
        correctAnswer: "A", 
        explanation: "Tha hóa lao động là khi sản phẩm con người làm ra (của cải, máy móc) không thuộc về họ mà lại trở thành lực lượng đối lập, thống trị và nô dịch chính họ, khiến người lao động trở thành nô lệ cho sản phẩm do mình làm ra.", 
        points: 10 
    },
    { 
        id: 3524, 
        question: "Câu 24. Theo quan điểm của triết học Mác - Lênin, lãnh tụ giữ vai trò gì trong lịch sử?", 
        options: { A: "Chủ thể của lịch sử, lực lượng sáng tạo ra lịch sử.", B: "Thúc đẩy hoặc kìm hãm sự phát triển xã hội.", C: "Đối kháng với quần chúng nhân dân.", D: "Là cá nhân có quyền lực tuyệt đối." }, 
        correctAnswer: "B", 
        explanation: "Lãnh tụ là những cá nhân kiệt xuất, đóng vai trò là những người đi trước, định hướng, thúc đẩy phong trào quần chúng phát triển nhanh hơn, hoặc nếu sai lầm thì có thể gây kìm hãm sự phát triển.", 
        points: 10 
    },
    { 
        id: 3525, 
        question: "Câu 25. Theo quan điểm của triết học Mác - Lênin, mối quan hệ giữa quần chúng nhân dân và lãnh tụ thể hiện như thế nào?", 
        options: { A: "Quần chúng nhân dân là lực lượng đóng vai trò quyết định đối với sự phát triển của lịch sử xã hội; lãnh tụ là người dẫn dắt, định hướng cho phong trào, thúc đẩy phong trào phát triển.", B: "Lãnh tụ là người đóng vai trò quyết định đối với sự phát triển của lịch sử xã hội; quần chúng nhân dân là lực lượng tham gia phong trào.", C: "Cả hai thống nhất biện chứng với nhau, có vai trò ngang nhau.", D: "Quần chúng nhân dân và lãnh tụ mâu thuẫn với nhau về lợi ích." }, 
        correctAnswer: "A", 
        explanation: "Quần chúng nhân dân là chủ thể sáng tạo ra lịch sử (quyết định). Lãnh tụ là người đại diện cho ý chí của quần chúng, giúp phong trào có đường lối đúng đắn, từ đó thúc đẩy lịch sử phát triển nhanh hơn.", 
        points: 10 
    },
    { 
        id: 3526, 
        question: "Câu 26. Theo quan điểm của triết học Mác - Lênin, yếu tố nào là cầu nối, liên kết, là mắt xích quyết định và là động lực để quần chúng nhân dân và lãnh tụ thống nhất về ý chí và hành động?", 
        options: { A: "Lợi ích.", B: "Hệ tư tưởng.", C: "Trình độ nhận thức.", D: "Nhiệm vụ chính trị." }, 
        correctAnswer: "A", 
        explanation: "Lợi ích là động lực trực tiếp. Khi đường lối của lãnh tụ đại diện đúng đắn cho lợi ích thiết thực của quần chúng, họ mới tự nguyện đi theo và biến tư tưởng của lãnh tụ thành hành động thực tế.", 
        points: 10 
    },
    { 
        id: 3527, 
        question: "Câu 27. Dựa trên quan điểm của triết học Mác - Lênin về mối quan hệ biện chứng giữa quần chúng nhân dân và lãnh tụ, luận điểm nào sau đây là SAI?", 
        options: { A: "Chủ nghĩa Mác - Lênin khẳng định vai trò quyết định của quần chúng nhân dân đồng thời đánh giá cao vai trò của lãnh tụ.", B: "Quần chúng nhân dân là lực lượng đóng vai trò quyết định đối với sự phát triển của lịch sử xã hội, là động lực của sự phát triển đó.", C: "Quần chúng nhân dân là người dẫn dắt định hướng cho phong trào, thúc đẩy phong trào phát triển, do đó mà thúc đẩy sự phát triển của lịch sử xã hội.", D: "Lãnh tụ là người dẫn dắt định hướng cho phong trào, thúc đẩy phong trào phát triển, do đó mà thúc đẩy sự phát triển của lịch sử xã hội." }, 
        correctAnswer: "C", 
        explanation: "Sai ở vế 'Quần chúng nhân dân là người dẫn dắt...'. Đây là vai trò của lãnh tụ. Quần chúng nhân dân là lực lượng trực tiếp lao động và đấu tranh, còn lãnh tụ là người định hướng phong trào.", 
        points: 10 
    },
